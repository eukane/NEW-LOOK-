    <path d="M290 262 L276 214" stroke="#12062b" stroke-width="16"/>
    <path d="M290 262 L276 214" stroke="#f7c6a3" stroke-width="10"/>
    <path d="M296 262 L316 218" stroke="#12062b" stroke-width="16"/>
    <path d="M296 262 L316 218" stroke="#f7c6a3" stroke-width="10"/>
