    <path d="M178 480 c-9 -14 -28 -3 -17 12 l17 14 l17 -14 c11 -15 -8 -26 -17 -12 z" fill="#ffe94d"/>
    <path d="M702 700 c-12 -18 -36 -3 -22 16 l22 18 l22 -18 c14 -19 -10 -34 -22 -16 z" fill="#2af0d8"/>
    <path d="M620 610 c-8 -12 -24 -2 -15 10 l15 12 l15 -12 c9 -12 -7 -22 -15 -10 z" fill="#ff2f7a"/>
