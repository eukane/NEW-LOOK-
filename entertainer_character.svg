  <circle cx="426" cy="211" r="3.6" fill="#ffffff"/>
  <path d="M431 224 l2 4 l4 1 l-3 3 l1 4 l-4 -2 l-4 2 l1 -4 l-3 -3 l4 -1 z" fill="#ffe94d" opacity="0.9"/>
