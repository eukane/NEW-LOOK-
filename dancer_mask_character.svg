<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0" stop-color="#5a1f4a"/>
      <stop offset="0.55" stop-color="#22102e"/>
      <stop offset="1" stop-color="#07060b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.5" stop-color="#e2b444"/>
      <stop offset="1" stop-color="#8f6418"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d3aa"/>
      <stop offset="0.55" stop-color="#c9a672"/>
      <stop offset="1" stop-color="#8a6238"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0243f"/>
      <stop offset="1" stop-color="#6d0f2b"/>
    </linearGradient>
    <linearGradient id="skirt1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d1236"/>
      <stop offset="0.5" stop-color="#ff4a6b"/>
      <stop offset="1" stop-color="#a3153f"/>
    </linearGradient>
    <linearGradient id="skirt2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b1470"/>
      <stop offset="0.5" stop-color="#b050e0"/>
      <stop offset="1" stop-color="#4b1470"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#ff3b8a"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b2f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- stage background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <polygon points="330,0 470,0 700,930 100,930" fill="url(#spot)"/>
  <ellipse cx="400" cy="935" rx="320" ry="38" fill="#ffd86b" opacity="0.25"/>
  <ellipse cx="400" cy="945" rx="230" ry="22" fill="#000" opacity="0.5"/>
  <!-- stage curtains hint -->
  <path d="M0 0 H90 Q60 300 100 560 Q70 800 90 1000 H0 Z" fill="#3a0c24" opacity="0.8"/>
  <path d="M800 0 H710 Q740 300 700 560 Q730 800 710 1000 H800 Z" fill="#3a0c24" opacity="0.8"/>
  <!-- hanging puppet strings (game motif) -->
  <g stroke="#e9e2cf" stroke-width="1.2" opacity="0.5">
    <line x1="400" y1="0" x2="400" y2="95"/>
    <line x1="560" y1="0" x2="592" y2="140"/>
    <line x1="250" y1="0" x2="230" y2="320"/>
  </g>

  <!-- floating petals / sparkles -->
  <g fill="#ff7aa5" opacity="0.8">
    <ellipse cx="190" cy="180" rx="9" ry="5" transform="rotate(30 190 180)"/>
    <ellipse cx="640" cy="330" rx="8" ry="4" transform="rotate(-25 640 330)"/>
    <ellipse cx="160" cy="620" rx="9" ry="5" transform="rotate(50 160 620)"/>
    <ellipse cx="660" cy="640" rx="9" ry="5" transform="rotate(-40 660 640)"/>
    <ellipse cx="610" cy="840" rx="8" ry="4" transform="rotate(20 610 840)"/>
    <ellipse cx="200" cy="810" rx="8" ry="4" transform="rotate(-30 200 810)"/>
  </g>
  <g fill="#ffe28a">
    <path d="M520 80 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
    <path d="M150 400 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
    <path d="M680 520 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
    <path d="M300 60 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
  </g>

  <!-- ===== trailing ribbons ===== -->
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M205 330 C120 300 90 420 140 470 C190 520 120 600 80 640" stroke-width="14"/>
    <path d="M205 330 C150 360 170 450 120 520" stroke-width="7" opacity="0.8"/>
    <path d="M590 150 C680 120 720 220 670 280 C630 330 700 380 730 420" stroke-width="12"/>
  </g>

  <!-- ===== hair (flowing) ===== -->
  <path d="M365 170 C300 190 270 300 300 400 C330 360 340 300 365 250 Z" fill="#c2186b"/>
  <path d="M365 180 C330 230 300 340 250 430 C320 420 360 330 380 240 Z" fill="#ff3b8a" opacity="0.9"/>
  <path d="M440 170 C500 190 520 270 510 340 C480 300 460 260 440 240 Z" fill="#c2186b"/>

  <!-- ===== headdress (golden fan crest) ===== -->
  <g stroke="#6b4812" stroke-width="2.5" stroke-linejoin="round">
    <path d="M400 165 L300 60 Q340 150 360 175 Z" fill="url(#gold)"/>
    <path d="M400 165 L335 28 Q372 128 385 170 Z" fill="url(#gold)"/>
    <path d="M400 165 L400 8 Q412 110 412 170 Z" fill="url(#gold)"/>
    <path d="M400 165 L465 28 Q428 128 415 170 Z" fill="url(#gold)"/>
    <path d="M400 165 L500 60 Q460 150 440 175 Z" fill="url(#gold)"/>
  </g>
  <g fill="#ff3b8a" stroke="#6b4812" stroke-width="2">
    <circle cx="300" cy="62" r="7"/><circle cx="335" cy="30" r="7"/><circle cx="400" cy="10" r="7"/><circle cx="465" cy="30" r="7"/><circle cx="500" cy="62" r="7"/>
  </g>
  <!-- gold circlet -->
  <path d="M352 178 Q400 150 448 178 L444 192 Q400 166 356 192 Z" fill="url(#gold)" stroke="#6b4812" stroke-width="2.5"/>
  <circle cx="400" cy="166" r="9" fill="#ff3b2f" stroke="#6b4812" stroke-width="2.5"/>

  <!-- ===== legs (behind skirt) ===== -->
  <g stroke="#2b1b0e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- standing leg -->
    <path d="M375 690 L368 790 L372 878" fill="none" stroke="#e8d3aa" stroke-width="22"/>
    <path d="M375 690 L368 790 L372 878" fill="none" stroke="url(#wood)" stroke-width="18"/>
    <circle cx="368" cy="790" r="12" fill="#8a6238"/>
    <path d="M356 880 L392 880 L400 900 L352 900 Z" fill="url(#crimson)"/>
    <rect x="388" y="900" width="8" height="30" fill="url(#gold)"/>
    <path d="M352 900 L356 930 L392 930 L400 900" fill="#5a0b21"/>
    <!-- raised bent leg -->
    <path d="M425 680 L505 735 L440 805" fill="none" stroke="#e8d3aa" stroke-width="20"/>
    <path d="M425 680 L505 735 L440 805" fill="none" stroke="url(#wood)" stroke-width="16"/>
    <circle cx="505" cy="735" r="12" fill="#8a6238"/>
    <path d="M425 800 L452 806 L418 842 L410 820 Z" fill="url(#crimson)"/>
  </g>

  <!-- ===== skirt layers (spinning) ===== -->
  <path d="M330 520 C230 590 130 680 120 760 C250 720 330 740 400 760 C470 740 560 720 690 760 C670 670 560 590 470 520 Z" fill="url(#skirt2)" stroke="#2b0a3d" stroke-width="3"/>
  <path d="M340 520 C260 580 190 650 175 720 C270 695 340 705 400 722 C460 705 540 690 625 720 C610 650 540 580 460 520 Z" fill="url(#skirt1)" stroke="#5a0b21" stroke-width="3"/>
  <!-- skirt ruffle folds -->
  <g stroke="#2b0a3d" stroke-width="2" opacity="0.6" fill="none">
    <path d="M372 540 C330 620 280 690 240 745"/><path d="M400 545 C400 640 395 700 395 755"/>
    <path d="M430 540 C470 620 520 690 560 740"/>
  </g>
  <!-- gold hem trim -->
  <path d="M120 760 C250 720 330 740 400 760 C470 740 560 720 690 760" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M175 720 C270 695 340 705 400 722 C460 705 540 690 625 720" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== torso (bodice) ===== -->
  <path d="M345 310 Q400 330 455 310 L470 400 Q440 470 460 525 L340 525 Q360 470 330 400 Z" fill="url(#crimson)" stroke="#3b0818" stroke-width="3"/>
  <!-- gold corset lacing -->
  <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M400 335 L400 520"/>
    <path d="M382 360 L418 372 M418 360 L382 372"/>
    <path d="M382 400 L418 412 M418 400 L382 412"/>
    <path d="M382 440 L418 452 M418 440 L382 452"/>
    <path d="M384 480 L416 490 M416 480 L384 490"/>
  </g>
  <!-- bodice gold collar & jewel -->
  <path d="M345 310 Q400 345 455 310 L450 332 Q400 362 350 332 Z" fill="url(#gold)" stroke="#6b4812" stroke-width="2.5"/>
  <circle cx="400" cy="352" r="8" fill="#ff3b2f" stroke="#6b4812" stroke-width="2"/>
  <!-- waist sash -->
  <path d="M336 505 Q400 535 464 505 L468 530 Q400 558 332 530 Z" fill="url(#gold)" stroke="#6b4812" stroke-width="2.5"/>

  <!-- ===== arms ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- sheer left sleeve (sweeping low-left) -->
    <path d="M350 325 Q290 360 232 355" stroke="#8d1236" stroke-width="34"/>
    <path d="M232 355 Q215 345 205 335" stroke="#e8d3aa" stroke-width="12"/>
    <path d="M232 355 Q215 345 205 335" stroke="url(#wood)" stroke-width="9"/>
    <!-- right raised arm -->
    <path d="M452 325 Q520 280 548 215" stroke="#8d1236" stroke-width="34"/>
    <path d="M548 215 Q572 185 590 152" stroke="#e8d3aa" stroke-width="13"/>
    <path d="M548 215 Q572 185 590 152" stroke="url(#wood)" stroke-width="9"/>
  </g>
  <!-- gold bangles/joints -->
  <g fill="#8a6238" stroke="#2b1b0e" stroke-width="2">
    <circle cx="548" cy="215" r="9"/><circle cx="232" cy="355" r="9"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="5"><circle cx="578" cy="172" r="9"/><circle cx="218" cy="344" r="8"/></g>
  <!-- left hand -->
  <circle cx="204" cy="333" r="10" fill="url(#wood)" stroke="#2b1b0e" stroke-width="2.5"/>
  <!-- right hand holding fan -->
  <circle cx="591" cy="150" r="10" fill="url(#wood)" stroke="#2b1b0e" stroke-width="2.5"/>

  <!-- fan -->
  <g stroke="#6b4812" stroke-width="2" stroke-linejoin="round">
    <path d="M591 150 L520 50 Q590 15 665 55 Z" fill="#ff3b8a"/>
    <path d="M591 150 L548 38 M591 150 L591 26 M591 150 L634 38 M591 150 L665 55" fill="none"/>
    <path d="M520 50 Q590 15 665 55" fill="none" stroke="url(#gold)" stroke-width="6"/>
  </g>
  <g fill="#ffe28a" opacity="0.9"><circle cx="560" cy="62" r="4"/><circle cx="598" cy="52" r="4"/><circle cx="632" cy="70" r="4"/></g>

  <!-- ===== neck + face + mask ===== -->
  <rect x="386" y="285" width="28" height="36" rx="6" fill="#e8d3aa" stroke="#2b1b0e" stroke-width="2.5"/>
  <!-- face (porcelain-wood) -->
  <path d="M352 205 Q352 170 400 168 Q448 170 448 205 Q452 250 428 282 Q410 300 400 302 Q390 300 372 282 Q348 250 352 205 Z" fill="url(#wood)" stroke="#2b1b0e" stroke-width="3.5"/>
  <!-- golden half mask over eyes -->
  <path d="M348 202 Q372 188 400 200 Q428 188 452 202 L452 232 Q430 252 412 238 Q400 230 388 238 Q370 252 348 232 Z" fill="url(#gold)" stroke="#6b4812" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes: glowing red slits -->
  <path d="M362 218 Q374 208 388 220 Q374 230 362 218 Z" fill="#12060a" stroke="#6b4812" stroke-width="2"/>
  <path d="M412 220 Q426 208 438 218 Q426 230 412 220 Z" fill="#12060a" stroke="#6b4812" stroke-width="2"/>
  <circle cx="375" cy="219" r="4" fill="#ff3b2f"/><circle cx="425" cy="219" r="4" fill="#ff3b2f"/>
  <circle cx="375" cy="219" r="10" fill="url(#glow)"/><circle cx="425" cy="219" r="10" fill="url(#glow)"/>
  <!-- mask filigree -->
  <g fill="none" stroke="#6b4812" stroke-width="2" stroke-linecap="round">
    <path d="M400 200 L400 232"/>
    <path d="M352 208 Q342 198 338 184"/><path d="M448 208 Q458 198 462 184"/>
    <path d="M360 238 q8 6 16 2"/><path d="M424 240 q8 4 16 -2"/>
  </g>
  <circle cx="400" cy="206" r="4.5" fill="#ff3b2f" stroke="#6b4812" stroke-width="1.5"/>
  <!-- nose -->
  <path d="M400 238 L406 262 L394 262" fill="none" stroke="#7a5430" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cheek paint -->
  <circle cx="365" cy="262" r="9" fill="#e0243f" opacity="0.75"/><circle cx="435" cy="262" r="9" fill="#e0243f" opacity="0.75"/>
  <!-- lips: confident smile -->
  <path d="M378 276 Q400 292 424 274 Q400 284 378 276 Z" fill="#c2185b" stroke="#5a0b21" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M378 276 Q400 298 424 274" fill="none" stroke="#5a0b21" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ear jewels -->
  <circle cx="347" cy="244" r="6" fill="url(#gold)" stroke="#6b4812" stroke-width="2"/>
  <circle cx="453" cy="244" r="6" fill="url(#gold)" stroke="#6b4812" stroke-width="2"/>
  <line x1="347" y1="250" x2="347" y2="276" stroke="url(#gold)" stroke-width="3"/>
  <line x1="453" y1="250" x2="453" y2="276" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="347" cy="280" r="5" fill="#ff3b2f"/><circle cx="453" cy="280" r="5" fill="#ff3b2f"/>

  <!-- floor reflections / motion arcs -->
  <g fill="none" stroke="#ffe28a" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <path d="M130 780 Q400 850 670 780"/>
    <path d="M160 800 Q400 880 640 800" opacity="0.6"/>
  </g>
</svg>
