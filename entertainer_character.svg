  <!-- REC -->
  <circle cx="64" cy="64" r="8" fill="#ff2a2a"/>
  <text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#ffffff">REC 00:42</text>
  <!-- LIVE badge -->
  <rect x="640" y="46" width="94" height="32" rx="8" fill="#ff2f7a" stroke="#ffffff" stroke-width="2"/>
  <text x="654" y="69" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#ffffff">LIVE</text>
  <path d="M714 54 l8 8 l-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- drone camera -->
