  <circle cx="334" cy="232" r="14" fill="#ff2f7a" stroke="#12062b" stroke-width="3"/>
  <circle cx="334" cy="232" r="6" fill="#ffe94d"/>
  <path d="M334 246 Q338 290 376 284" fill="none" stroke="#12062b" stroke-width="3.5" stroke-linecap="round"/>
