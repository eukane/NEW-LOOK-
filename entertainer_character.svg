  <ellipse cx="624" cy="492" rx="20" ry="17" fill="#f7c6a3" stroke="#12062b" stroke-width="3" transform="rotate(40 624 492)"/>
  <g stroke="#12062b" stroke-width="2" opacity="0.55"><path d="M616 484 l16 14 M611 492 l16 14"/></g>
  <!-- mic head (big = toward camera) -->
  <circle cx="668" cy="530" r="38" fill="#2a1745" stroke="#12062b" stroke-width="3.5"/>
  <circle cx="668" cy="530" r="34" fill="url(#grill)" stroke="#ffe94d" stroke-width="5"/>
  <circle cx="668" cy="530" r="34" fill="#4a2a80" opacity="0.5"/>
  <path d="M648 514 Q658 502 672 502" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="668" cy="530" r="5" fill="#ff2f7a"/>

  <!-- ===== face ===== -->
  <path d="M338 212 Q338 148 400 146 Q462 148 462 212 Q462 268 432 290 Q414 304 400 306 Q386 304 368 290 Q338 268 338 212 Z" fill="#f7c6a3" stroke="#12062b" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- ears + headset -->
  <ellipse cx="336" cy="232" rx="9" ry="14" fill="#f7c6a3" stroke="#12062b" stroke-width="3"/>
  <ellipse cx="464" cy="232" rx="9" ry="14" fill="#f7c6a3" stroke="#12062b" stroke-width="3"/>
