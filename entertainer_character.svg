  <circle cx="548" cy="416" r="9" fill="#ffe94d" stroke="#12062b" stroke-width="2.5"/>
  <circle cx="602" cy="472" r="12" fill="url(#wood)" stroke="#12062b" stroke-width="2.5"/>
  <rect x="582" y="450" width="36" height="12" rx="5" fill="#ffe94d" stroke="#12062b" stroke-width="2.5" transform="rotate(46 600 456)"/>
