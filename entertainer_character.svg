  <!-- belt -->
  <rect x="350" y="466" width="100" height="16" rx="5" fill="#ffe94d" stroke="#12062b" stroke-width="3"/>
  <rect x="390" y="463" width="20" height="22" rx="5" fill="#ff2f7a" stroke="#12062b" stroke-width="2.5"/>

