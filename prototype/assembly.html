<style>
:root{--ink:#0e0907;--paper:#a99b78;--blood:#7c1620;--brass:#8f7340;--bone:#d9cdb0;
  --f-disp:"Gugi","Black Han Sans","Noto Serif KR","WenQuanYi Zen Hei",serif;
  --f-body:"Hahmlet","Noto Serif KR","Noto Sans KR","WenQuanYi Zen Hei",serif;
  --f-black:"UnifrakturCook","Gugi",serif}
html,body{margin:0;height:100%;overflow:hidden;background:#070403;color:var(--bone);font:16px/1.6 var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.scr.left{justify-content:flex-start;padding-left:max(16px,4vw)}
.scr.bottom{align-items:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.panel{pointer-events:auto;max-width:520px;width:100%;max-height:92vh;overflow:auto;background:linear-gradient(#17100c ,#0d0806);color:var(--bone);border:1px solid #5a4528;border-radius:2px;box-shadow:0 0 0 3px #0a0604,0 0 0 4px #3d2e1a,0 24px 80px #000d;padding:24px 26px;position:relative}
.panel:before{content:"";position:absolute;inset:6px;border:1px solid #3a2c18;pointer-events:none}
.disp{font-family:var(--f-disp);letter-spacing:.04em}
.title{font:400 44px/1.05 var(--f-disp);margin:0 0 6px;color:#e6dcc0;transform:skewX(-6deg);text-shadow:3px 0 #7c1620,-2px 0 #1d4a52,0 4px 18px #000}
.sub{font:700 12px var(--f-black);letter-spacing:.35em;color:#8f7340;text-transform:uppercase}
.panel p{margin:8px 0}.dim{color:#9a8c6c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{pointer-events:auto;background:linear-gradient(#7c1620,#4a0c14);color:#e9dcc0;border:1px solid #2a0508;outline:1px solid #8f7340;outline-offset:-4px;padding:11px 24px;font:400 16px var(--f-disp);cursor:pointer;box-shadow:0 4px 0 #1e0306,0 8px 18px #000a;letter-spacing:.08em;transform:skewX(-6deg)}
.btn:active{transform:skewX(-6deg) translateY(2px);box-shadow:0 2px 0 #1e0306}
.btn.ghost{background:transparent;color:#cdbd96;border-color:#5a4528;outline-color:#3a2c18;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #3d2e1a;padding:8px 10px;margin:8px 0;background:#00000040;cursor:pointer;font-size:14px}
label.opt small{display:block;color:#8d7f60}
select{background:#0b0705;color:var(--bone);border:1px solid #5a4528;padding:5px 8px;font:inherit}
table{border-collapse:collapse;width:100%;font-size:.88em;margin:8px 0}
th,td{border-bottom:1px solid #6b5c3e66;padding:5px 7px;text-align:left}th{font-family:var(--f-disp);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid #0e0907}
.win{color:#4f8a58;font-weight:900}.lose{color:#a3323d;font-weight:900}
.bkwrap{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
.bkwrap.show{opacity:1}
.bk{position:absolute;box-sizing:border-box;padding:5.5% 6.5% 6%;color:#1a120b;overflow:auto;pointer-events:auto;line-height:1.55;font-family:var(--f-body)}
.bk h2{font:400 1.55em/1.2 var(--f-disp);margin:0 0 .3em;color:#3a0a12;transform:skewX(-5deg);text-shadow:1px 0 #7c162066}
.bk h3{font:700 .72em var(--f-black);letter-spacing:.3em;margin:0 0 .6em;color:#5a4528;text-transform:uppercase}
.bk p{margin:.5em 0}.bk .dim{color:#5a4a30}
.bk table{font-size:.9em}.bk th,.bk td{border-bottom:1px solid #3a2c1866}.bk th{color:#3a0a12}
.bk .win{color:#1e5a2a}.bk .lose{color:#8a1a28}
.bk .btn{font-size:.95em;padding:.6em 1.4em}
.bk .btn.ghost{color:#3a2a14;border-color:#5a4528}
.bk img.hero{display:block;margin:0 auto;height:min(40vh,340px)}
.bk .pairs{display:flex;gap:.6em;justify-content:center;align-items:flex-end;margin:.2em 0}
.bk .pairs img{height:min(16vh,160px)}
.bk .vs{font:400 1.6em var(--f-disp);color:#7c1620;transform:skewX(-8deg)}
.bk .quote{font:italic 500 1.02em/1.7 var(--f-body);color:#2a1d10;border-left:3px solid #7c1620;padding-left:.8em;margin:.8em 0}
#spells{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:none;flex-direction:column-reverse;gap:12px;pointer-events:none;z-index:5}
.sp{pointer-events:auto;position:relative;width:84px;height:84px;border-radius:50%;border:2px solid #8f7340;background:radial-gradient(#2a1c12,#0e0806);color:#e3d7b8;font:400 12px/1.2 var(--f-disp);text-align:center;overflow:hidden;box-shadow:0 0 0 3px #0a0604,0 8px 20px #000c;cursor:pointer;padding:0}
.sp b{display:block;font:700 10px var(--f-black);opacity:.7;letter-spacing:.2em}
.sp .cdm{position:absolute;inset:0;background:#000b;transform-origin:50% 100%;transform:scaleY(0)}
.sp.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.sp span{position:relative;z-index:1;display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:6px}
#load{position:fixed;inset:0;z-index:20;pointer-events:none;visibility:hidden}
#load.on{visibility:visible;pointer-events:auto}
#load .cur{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#2a070c 0 22px,#3d0d15 22px 44px,#2f0910 44px 66px);box-shadow:inset 0 0 90px #000d;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
#load .cur.l{left:0;transform:translateX(-101%);border-right:5px solid #5a4528}
#load .cur.r{right:0;transform:translateX(101%);border-left:5px solid #5a4528}
#load.closed .cur.l,#load.closed .cur.r{transform:translateX(0)}
#load .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .25s .25s}
#load.closed .mid{opacity:1}
#load .t{font:700 26px var(--f-black);letter-spacing:.22em;color:#d8ccb0;text-shadow:0 2px 0 #000}
#load .tip{font-size:14px;color:#a89a78;max-width:80vw;text-align:center;min-height:42px}
#load canvas{width:min(420px,86vw);height:auto}

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="spells"></div>
<div id="load"><div class="cur l"></div><div class="cur r"></div>
  <div class="mid"><canvas id="lcv" width="420" height="170"></canvas><div class="t" id="lt">NOW LOADING</div><div class="tip" id="ltip"></div></div></div>

<script>
/* ===================== CORE:BEGIN (DOM 없음: 규칙 + 듀얼 엔진) ===================== */
const JOBS = [
  {id:'ent',  name:'엔터테이너', color:'#f6e3a6', goal:'위기를 넘기며 시청자를 쌓는다'},
  {id:'tech', name:'기술자',     color:'#9be37a', goal:'발전기를 돌려 단독 탈출한다'},
  {id:'scout',name:'수색자',     color:'#7fe3ff', goal:'방해 요소를 찾아 해제한다'},
  {id:'arch', name:'기록자',     color:'#cdb6ff', goal:'단서를 모으고 목표를 간파한다'},
];
const STRING_NAMES = ['머리','가슴','좌 어깨','우 어깨','좌 팔꿈치','우 팔꿈치','좌 손목','우 손목','좌 무릎','우 무릎','좌 발목','우 발목'];
const N = 12, VITALS = 4;
const RULES0 = {basePicks:3, winBonus:1, comeback:'extra', winnerFirst:false}; // 승리 보상 = 선택 3개 → 4개 (이게 전부)

let rand = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri = n => Math.floor(rand()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,k){return shuffle(a).slice(0,k)}
function gauss(){let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const range = n => [...Array(n).keys()];

function makePlayers(humanIdx){
  const jobs = shuffle(JOBS);
  return range(4).map(i=>({
    i, job:jobs[i], human:i===humanIdx, name:jobs[i].name,
    vit:new Set(sample(range(N),VITALS)),   // 급소 4개: 랜덤 배정, 본인에게만 보임
    cut:new Set(),                           // 끊긴 급소: 모두에게 공개
    gold:0, skill:0.25+rand()*0.55, alive:true, duelWins:0,
  }));
}
const level = p => Math.min(5, Math.floor(p.gold/2));
const alive = P => P.filter(p=>p.alive);
function picksFor(p, won, rules){
  let n = rules.basePicks + (won ? rules.winBonus : 0);               // 이긴 쪽 4개 / 진 쪽 3개
  if(rules.comeback==='extra' && p.cut.size>=2) n += 1;                // 역전 기믹 A: 관객의 동정
  else if(rules.comeback==='last' && p.cut.size>=3) n = 5;             // 역전 기믹 B: 최후의 승부수
  return n;
}
function aiPicks(p, t, count){ return sample(range(N).filter(i=>!t.cut.has(i)), count); }
function resolveAttack(att, tar, picks){
  const hits = picks.filter(i=>tar.vit.has(i) && !tar.cut.has(i));
  hits.forEach(i=>tar.cut.add(i));
  if(tar.cut.size>=VITALS) tar.alive = false;
  return hits;
}
function applyPair(a, b, w, pa, pb, rules){
  const seq = rules.winnerFirst ? (w===a ? [[a,b,pa],[b,a,pb]] : [[b,a,pb],[a,b,pa]]) : [[a,b,pa],[b,a,pb]];
  const out = [];
  seq.forEach(([att,tar,pk],idx)=>{
    if(rules.winnerFirst && idx===1 && !att.alive){ out.push({att,tar,picks:pk,hits:[],canceled:true}); return; }
    out.push({att,tar,picks:pk,hits:resolveAttack(att,tar,pk)});
  });
  return out;
}
function pairUp(P){
  const al = shuffle(alive(P)), pairs = [];
  for(let i=0;i+1<al.length;i+=2) pairs.push([al[i],al[i+1]]);
  return {pairs, bye: al.length%2 ? al[al.length-1] : null};
}
function gainGold(P){ alive(P).forEach(p=>p.gold += 1+ri(2)); }

/* ---------- 규칙 시뮬레이션용 추상 듀얼 (엔진을 돌리지 않는 근사) ---------- */
function absDuel(a,b){
  const sa = 0.5*a.skill + 0.35*level(a)/5 + 0.075*gauss(), sb = 0.5*b.skill + 0.35*level(b)/5 + 0.075*gauss();
  return sa>=sb ? a : b;
}
function botGame(rules){
  const P = makePlayers(-1); let rounds = 0;
  while(alive(P).length>1 && rounds<60){
    rounds++; gainGold(P);
    pairUp(P).pairs.forEach(([a,b])=>{
      const w = absDuel(a,b); w.duelWins++; w.gold += 1;
      applyPair(a,b,w, aiPicks(a,b,picksFor(a,w===a,rules)), aiPicks(b,a,picksFor(b,w===b,rules)), rules);
    });
  }
  const al = alive(P);
  return {rounds, winner: al.length===1 ? al[0].i : -1, duelWins:P.map(p=>p.duelWins)};
}
function runBotGames(rules, n){
  let sum=0, draws=0, leaderGames=0, leaderWins=0;
  for(let g=0; g<n; g++){
    const r = botGame(rules); sum += r.rounds; if(r.winner<0) draws++;
    const mx = Math.max(...r.duelWins), idx = r.duelWins.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
    if(idx.length===1 && r.winner>=0){ leaderGames++; if(idx[0]===r.winner) leaderWins++; }
  }
  return {games:n, avgRounds:sum/n, draws:draws/n, leaderRate:leaderWins/Math.max(1,leaderGames)};
}

/* ================== 1대1 실시간 듀얼 엔진 ================== */
const AW=720, AH=1280, DUR=45, HP0=5;
const aimAng = (a,b) => Math.atan2(b.y-a.y, b.x-a.x);
function makeDuel(A,B){
  const mk=(p,y,dir,minY,maxY)=>({p,job:p.job,x:AW/2,y,homeY:y,dir,hp:HP0,inv:0,cd:[0,0,0],shot:0.5+rand()*0.4,r:7,speed:330,minY,maxY,mx:0,my:0,tx:null,ty:null,hits:0,face:'idle',ai:null});
  return {t:0,over:false,fxOn:false,A:mk(A,AH-230,-1,AH*0.44,AH-70),B:mk(B,250,1,70,AH*0.56),bul:[],zones:[],timers:[],banners:[],sparks:[],log:[],fx:[],parts:[],shake:0,flash:0};
}
function after(d,sec,fn){ d.timers.push({t:sec,fn}); }
function shoot(d,m,o){
  const b={x:o.x!==undefined?o.x:m.x, y:o.y!==undefined?o.y:m.y+m.dir*18, vx:Math.cos(o.ang)*o.sp, vy:Math.sin(o.ang)*o.sp,
           r:o.r||6, col:o.col||m.job.color, owner:m, tgt:m===d.A?d.B:d.A, upd:o.upd||null, age:0, shape:o.shape||'orb', spin:o.spin||0, rot:o.ang, trail:o.trail||0, tr:[], a0:o.ang, seed:rand()*100, ch:o.ch||''};
  if(d.bul.length<900) d.bul.push(b); return b;
}
function setVel(b,ang,sp){ b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.rot=ang; }
const downAng = m => m.dir>0 ? Math.PI/2 : -Math.PI/2;
function burst(d,x,y,col,n,sp){ if(!d.fxOn) return; for(let i=0;i<n;i++){ const a=rand()*6.283, v=sp*(0.3+rand()); d.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.4+rand()*0.4,col,sz:2+rand()*3}); } }
function castFx(d,m,kind){ if(!d.fxOn) return; d.fx.push({kind,x:m.x,y:m.y,t:0,col:m.job.color,job:m.job.id}); burst(d,m.x,m.y,m.job.color,22,260); }
const GLYPHS=['가','나','다','라','마','바','사','아','자','차','카','타','파','하','ㄱ','ㅁ','ㅅ','ㅇ','ㅈ','ㅎ','Ω','§','†','Ж','Σ'];

/* 직업별 기본 사격: 모양과 리듬이 다르다 */
const BASIC = {
  ent:  (d,m,f)=>{ const a=aimAng(m,f); for(const o of [-0.17,0,0.17]) shoot(d,m,{ang:a+o,sp:350,r:5,shape:'star',trail:3}); },
  tech: (d,m,f)=>{ const a=aimAng(m,f); for(const o of [-26,0,26]) shoot(d,m,{x:m.x+Math.cos(a+1.57)*o,y:m.y+m.dir*18+Math.sin(a+1.57)*o,ang:a,sp:300,r:6,shape:'bolt',trail:2}); },
  scout:(d,m,f)=>{ const a=aimAng(m,f); for(const o of [-0.3,0.3]) shoot(d,m,{ang:a+o,sp:230,r:5,shape:'flame',trail:5,upd:(b,dt)=>{ const w=aimAng(b,f); let cur=Math.atan2(b.vy,b.vx); const df=Math.atan2(Math.sin(w-cur),Math.cos(w-cur)); if(b.age<1.2) { cur+=Math.max(-0.9*dt,Math.min(0.9*dt,df)); setVel(b,cur,230+b.age*60);} }}); },
  arch: (d,m,f)=>{ const a=aimAng(m,f); for(const o of [-0.2,0,0.2]) shoot(d,m,{ang:a+o,sp:290,r:5,shape:'page',spin:5,upd:(b,dt)=>{ b.x+=Math.cos(a+1.57)*Math.sin(b.age*9+b.seed)*40*dt; b.y+=Math.sin(a+1.57)*Math.sin(b.age*9+b.seed)*40*dt; }}); },
};

/* 직업별 스펠 카드 3장: 쿨타임 + 재화 레벨로 해금. 모양/속도/효과가 직업마다 다르다 */
const SPELLS = {
 // 엔터테이너: 빠르고 화려한 기하학적 탄 — 조명, 앙코르, 장막
 ent:[
  {name:'조명 부채꼴', cd:5, lv:0, text:'눈부신 빛줄기가 부채꼴로 3연발', cast(d,m,f){ castFx(d,m,'flash');
    for(let k=0;k<3;k++) after(d,k*0.28,()=>{ const a=aimAng(m,f); for(let i=-3;i<=3;i++) shoot(d,m,{ang:a+i*0.17,sp:310,r:7,shape:'beam',trail:4}); }); }},
  {name:'앵콜 링', cd:9, lv:2, text:'고리로 퍼졌다가 상대를 향해 질주', cast(d,m,f){ castFx(d,m,'ring');
    const n=22; for(let i=0;i<n;i++) shoot(d,m,{ang:i/n*Math.PI*2,sp:95,r:8,shape:'ring',trail:5,upd:(b,dt)=>{ if(b.age>0.95){ if(!b.re){ b.re=1; b.a1=aimAng(b,f)+(rand()-0.5)*0.4; } setVel(b,b.a1,Math.min(320,(b.age-0.95)*700)); } }}); }},
  {name:'박수갈채', cd:14, lv:4, text:'붉은 장막이 세 겹으로 내려온다 (틈을 찾아라)', cast(d,m,f){ castFx(d,m,'curtain');
    for(let w=0;w<3;w++) after(d,w*0.85,()=>{ const gap=ri(12); for(let i=0;i<14;i++){ if(i===gap||i===gap+1) continue; shoot(d,m,{x:30+i*(AW-60)/13,y:m.y+m.dir*40,ang:downAng(m),sp:170+w*32,r:10,shape:'curtain',upd:(b,dt)=>{ b.x+=Math.sin(b.age*5+i)*18*dt; }}); } }); }},
 ],
 // 기술자: 무겁고 둔한 큰 탄 + 가속, 번개 — 렌치, 전기, 톱니
 tech:[
  {name:'렌치 부메랑', cd:5, lv:0, text:'묵직한 렌치가 날아갔다가 돌아온다', cast(d,m,f){ castFx(d,m,'clang');
    const a=aimAng(m,f); [-0.38,0,0.38].forEach(o=>shoot(d,m,{ang:a+o,sp:340,r:16,shape:'wrench',spin:9,trail:6,upd:(b,dt)=>{
      if(b.age<1.1){ b.vx*=(1-dt*0.9); b.vy*=(1-dt*0.9); } else { const aa=Math.atan2(m.y-b.y,m.x-b.x); const sp=Math.min(360,(b.age-1.1)*340); b.vx=Math.cos(aa)*sp; b.vy=Math.sin(aa)*sp; } }})); }},
  {name:'전기 그물', cd:9, lv:2, text:'경고선이 뜬 뒤 번개 기둥이 내리친다', cast(d,m,f){ castFx(d,m,'spark');
    [-220,-110,0,110,220].forEach((o,i)=>{ const x=Math.max(40,Math.min(AW-40,f.x+o+(rand()-0.5)*40)); d.zones.push({x,w:34,owner:m,tgt:f,phase:'wait',t:-i*0.14,warn:0.85,act:0.38}); }); }},
  {name:'톱니 나선', cd:14, lv:4, text:'느리게 시작해 점점 빨라지는 톱니 소용돌이', cast(d,m,f){ castFx(d,m,'clang');
    for(let i=0;i<42;i++) after(d,i*0.065,()=>{ for(let arm=0;arm<3;arm++) shoot(d,m,{ang:i*0.33+arm*2.094,sp:70,r:8,shape:'gear',spin:6,trail:3,upd:(b,dt)=>{ setVel(b,b.a0,Math.min(250,70+b.age*150)); }}); }); }},
 ],
 // 수색자: 매복하듯 느리게 시작해 가속 — 등불, 물결, 그림자 창

function unlocked(m,i){ return level(m.p) >= SPELLS[m.job.id][i].lv; }
function canCast(d,m,i){ return !d.over && unlocked(m,i) && m.cd[i]<=0; }
function castSpell(d,m,i){
  if(!canCast(d,m,i)) return false;
  const sp = SPELLS[m.job.id][i], f = m===d.A ? d.B : d.A;
  m.cd[i] = sp.cd; sp.cast(d,m,f);
  d.banners.push({text:sp.name,col:m.job.color,t:0,side:m===d.A?'A':'B'}); d.log.push([d.t.toFixed(1),m.job.name,sp.name]);
  return true;
}

function stepDuel(d,dt){
  if(d.over) return; d.t+=dt;
  for(const m of [d.A,d.B]){
    const f = m===d.A?d.B:d.A;
    m.inv=Math.max(0,m.inv-dt); for(let i=0;i<3;i++) m.cd[i]=Math.max(0,m.cd[i]-dt);
    let vx=m.mx, vy=m.my;
    if(m.tx!==null){ const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy); if(dist>2){ const sp=Math.min(dist/dt, m.speed*1.15); m.x+=dx/dist*sp*dt; m.y+=dy/dist*sp*dt; } vx=vy=0; }
    const mag=Math.hypot(vx,vy); if(mag>0){ m.x+=vx/Math.max(1,mag)*m.speed*dt; m.y+=vy/Math.max(1,mag)*m.speed*dt; }
    m.x=Math.max(32,Math.min(AW-32,m.x)); m.y=Math.max(m.minY,Math.min(m.maxY,m.y));
    m.shot-=dt; if(m.shot<=0){ m.shot=0.7; BASIC[m.job.id](d,m,f); }
  }
  for(let i=d.timers.length-1;i>=0;i--){ const tm=d.timers[i]; tm.t-=dt; if(tm.t<=0){ d.timers.splice(i,1); tm.fn(); } }
  for(let i=d.bul.length-1;i>=0;i--){
    const b=d.bul[i]; if(!b) continue; b.age+=dt; if(b.upd) b.upd(b,dt);
    b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.spin) b.rot+=b.spin*dt;
    if(d.fxOn && b.trail){ b.tr.push(b.x,b.y); if(b.tr.length>b.trail*4) b.tr.splice(0,2); }
    const t=b.tgt; let remove=!!b.dead;
    if(!remove && t.inv<=0 && Math.hypot(b.x-t.x,b.y-t.y)<b.r+t.r){ t.hp--; t.hits++; t.inv=1.2; t.face='hurt'; d.sparks.push({x:t.x,y:t.y,t:0,col:b.col}); burst(d,t.x,t.y,b.col,18,320); d.shake=0.35; d.flash=0.35; remove=true; }
    if(b.x<-60||b.x>AW+60||b.y<-60||b.y>AH+60) remove=true;
    if(remove) d.bul.splice(i,1);
  }
  for(let i=d.zones.length-1;i>=0;i--){
    const z=d.zones[i]; z.t+=dt;
    if(z.phase==='wait' && z.t>=0) z.phase='warn';
    if(z.phase==='warn' && z.t>=z.warn){
      z.phase='act';
      if(z.fire){ const a=Math.atan2(z.tgt.y-z.y,z.tgt.x-z.x); shoot(d,z.owner,{x:z.x,y:z.y,ang:a,sp:440,r:8,shape:'spear',trail:9}); }
      if(z.drop){ shoot(d,z.owner,{x:z.x,y:z.y,ang:downAng(z.owner),sp:130+rand()*90,r:9,shape:'glyph',spin:(rand()-0.5)*4,ch:GLYPHS[ri(GLYPHS.length)]}); }
      if(!z.type) burst(d,z.x,AH*0.5,'#c8ffd8',14,300);
    }
    if(z.phase==='act' && !z.type && z.tgt.inv<=0 && Math.abs(z.tgt.x-z.x)<z.w/2+z.tgt.r){ z.tgt.hp--; z.tgt.hits++; z.tgt.inv=1.2; z.tgt.face='hurt'; d.sparks.push({x:z.tgt.x,y:z.tgt.y,t:0,col:'#fff'}); burst(d,z.tgt.x,z.tgt.y,'#c8ffd8',20,340); d.shake=0.4; d.flash=0.35; }
    if(z.t>=z.warn+z.act) d.zones.splice(i,1);
  }
  for(let i=d.sparks.length-1;i>=0;i--){ d.sparks[i].t+=dt; if(d.sparks[i].t>0.5) d.sparks.splice(i,1); }
  if(d.fxOn){
    for(let i=d.parts.length-1;i>=0;i--){ const p=d.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; if(p.t>p.life) d.parts.splice(i,1); }
    for(let i=d.fx.length-1;i>=0;i--){ d.fx[i].t+=dt; if(d.fx[i].t>0.9) d.fx.splice(i,1); }

}
function duelResult(d){
  const a=d.A, b=d.B; let w;
  if(a.hp!==b.hp) w = a.hp>b.hp ? a : b;
  else if(level(a.p)!==level(b.p)) w = level(a.p)>level(b.p) ? a : b;
  else w = rand()<0.5 ? a : b;
  return {winner:w.p, hitsA:HP0-a.hp, hitsB:HP0-b.hp, hpA:a.hp, hpB:b.hp, t:d.t};
}

/* 봇 조종: 탄 예측 회피 + 쿨타임 스펠 사용 */
function aiControl(d,me,foe,skill,dt){
  const ai = me.ai || (me.ai={next:0,mx:0,my:0,castWait:0.8+rand()});
  ai.next-=dt;
  if(ai.next<=0){
    ai.next = 0.11 + (1-skill)*0.24;
    let best=[0,0], bs=1e9;
    const cand=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[.7,-.7],[-.7,.7],[-.7,-.7]];
    for(const c of cand){
      let score=0;
      for(const tt of [0.18,0.4]){
        const px=me.x+c[0]*me.speed*tt, py=me.y+c[1]*me.speed*tt, wgt = tt<0.3?3:1.6;
        for(const b of d.bul){ if(b.owner===me) continue;
          const dist=Math.hypot(b.x+b.vx*tt-px, b.y+b.vy*tt-py)-b.r-me.r;
          if(dist<46) score+=(46-Math.max(dist,0))*wgt+(dist<0?500*wgt:0); }
        for(const z of d.zones){ if(z.owner===me || z.type) continue;
          if(z.phase==='warn'||z.phase==='act'){ const dx=Math.abs(px-z.x)-z.w/2-me.r; if(dx<40) score+=(40-Math.max(dx,0))*(z.phase==='act'?4:1.6)+(dx<0&&z.phase==='act'?800:0); } }
      }
      const ex=me.x+c[0]*me.speed*0.45, ey=me.y+c[1]*me.speed*0.45;
      if(ex<60||ex>AW-60||ey<me.minY+10||ey>me.maxY-10) score+=140;
      score += Math.abs(ey-me.homeY)*0.035 + Math.abs(ex-foe.x)*0.012 + (c[0]===0&&c[1]===0?3:0) + rand()*2;
      if(score<bs){ bs=score; best=c; }
    }
    if(rand()<0.05+(1-skill)*0.22) best=cand[ri(cand.length)];
    ai.mx=best[0]; ai.my=best[1];
  }
  me.mx=ai.mx; me.my=ai.my; me.tx=null;
  ai.castWait-=dt;
  if(ai.castWait<=0){
    const ready=[0,1,2].filter(i=>canCast(d,me,i));
    if(ready.length){ castSpell(d,me,ready[ri(ready.length)]); ai.castWait=0.35+rand()*(1.6-skill); } else ai.castWait=0.2;
  }
}
function runDuelHeadless(A,B,skillA,skillB){
  const d=makeDuel(A,B); const dt=1/30;
  while(!d.over){ aiControl(d,d.A,d.B,skillA,dt); aiControl(d,d.B,d.A,skillB,dt); stepDuel(d,dt); }
  return duelResult(d);
}

/* ---- 실 선택/공개용 인형 (일반 비율 캐릭터 + 12개 연결점) ---- */

    pageFill(c,0,R.y,half,R.h,0.04+0.35*ease*ease);

    c.strokeStyle='rgba(20,10,4,.5)'; c.lineWidth=1.5; c.strokeRect(0,R.y,half,R.h);
    c.restore();
  }

  });
}

async function playGame(){
  P=makePlayers(ri(4)); round=0; const me=P.find(p=>p.human);
  await transition(()=>{},{text:'배역 배정',tip:'막이 오릅니다…',job:me.job});
  await assignScreen();
  while(alive(P).length>1 && round<40){
    round++; gainGold(P);
    const {pairs,bye}=pairUp(P), human=P.find(p=>p.human);
    await transition(()=>{ mode='title'; stageActors=alive(P).map(p=>p.job); },{text:`소집 ${round}`,job:human.job});
    const briefL=`<h3>Act ${round} · 소집</h3><h2>제 ${round} 소집</h2><p class="quote">${FLAVOR[(round-1+ri(3))%FLAVOR.length]}</p><p class="dim">탐색 라운드는 생략되었습니다. 모두 재화를 얻었습니다 (내 재화 Lv ${level(human)}).</p>`;
    const briefR=`<h3>대진표</h3>${spritesRow(pairs,bye)}`;
    await bookScreen({left:briefL,right:briefR,buttons:[{label:human.alive?'듀얼 시작':'관전 중… 계속',value:1}],tag:STOP==='brief'?'brief':'brief_'});
    const plan=[];
    for(const [a,b] of pairs){
      let r;
      if((a.human||b.human) && human.alive){
        const A=a.human?a:b, B=a.human?b:a; let rs;
        if((opts.duelMode==='play' && !AUTO) || (AUTO&&STOP==='duel')){
          await transition(()=>{},{text:'입장',tip:`${B.name}과(와)의 1대1. 사용 가능: ${SPELLS[A.job.id].filter(s=>level(A)>=s.lv).map(s=>s.name).join(' · ')}`,job:A.job});
          rs=await startDuelScene(A,B); duelScene=null; hideSpellButtons(); mode='title';
        } else rs=runDuelHeadless(A,B,0.6,B.skill);
        r={winner:rs.winner,hitsA:a===A?rs.hitsA:rs.hitsB,hitsB:a===A?rs.hitsB:rs.hitsA};
      } else { const rs=runDuelHeadless(a,b,a.skill,b.skill); r={winner:rs.winner,hitsA:rs.hitsA,hitsB:rs.hitsB}; }
      const w=r.winner,l=w===a?b:a; w.duelWins++; w.gold+=1; plan.push({a,b,w,l,r});
    }
    const mine=plan.find(x=>x.a.human||x.b.human);
    mode='title'; stageActors=alive(P).map(p=>p.job);
    const rows=plan.map(x=>`<tr><td>${nameOf(x.a)} vs ${nameOf(x.b)}</td><td>${nameOf(x.w)}</td><td>${x.r.hitsA} : ${x.r.hitsB}</td></tr>`).join('');
    let msg=''; if(mine && human.alive){ msg = mine.w===human ? `<p class="win">승리 — 이번 공격에서 실을 ${picksFor(human,true,rules)}개 고를 수 있습니다.</p>` : `<p class="lose">패배 — 이번 공격의 선택은 ${picksFor(human,false,rules)}개입니다.</p>`; }
    await transition(()=>{},{text:'결과',job:human.job});
    await bookScreen({left:`<h3>Act ${round} · 결과</h3><h2>듀얼 결과</h2><table><tr><th>대결</th><th>승자</th><th>피격</th></tr>${rows}</table>`,right:`<h3>다음 장</h3>${msg||'<p class="dim">당신은 관전 중입니다.</p>'}<p class="quote">책장이 넘어가자, 인형들의 실이 다시 팽팽해졌습니다.</p>`,buttons:[{label:'실 선택으로',value:1}],tag:STOP==='result'?'result':'result_'});
    const attacks=[];
    for(const x of plan) for(const [att,tar] of [[x.a,x.b],[x.b,x.a]]){
      const n=picksFor(att,x.w===att,rules); let picks;
      if(att.human && att.alive){ await transition(()=>{},{text:'실 선택',tip:`${tar.name}의 12개 실 중 ${n}개를 고르세요.`,job:att.job}); picks=await runPick(att,tar,n); }
      else picks=aiPicks(att,tar,n);
      attacks.push({att,tar,picks,n});
    }
    const snap={}; P.forEach(p=>snap[p.i]=new Set(p.cut));
    const results=[];
    for(const x of plan){ const A=attacks.find(q=>q.att===x.a), B=attacks.find(q=>q.att===x.b);
      results.push(...applyPair(x.a,x.b,x.w,A.picks,B.picks,rules).map(r=>({...r,n:(r.att===x.a?A:B).n}))); }
    const myA=results.find(r=>r.att.human);
    if(myA && human.alive){ const foeA=results.find(r=>r.att===myA.tar&&r.tar===myA.att);
      await transition(()=>{},{text:'공개',tip:'실이 팽팽해집니다…',job:human.job});
      await runReveal(human,myA.tar,myA.picks,foeA.picks,myA.hits,foeA.hits,snap,foeA.canceled); }
    mode='title';
  }
  const al=alive(P), win=al.length===1?al[0]:null;
  window.__result={rounds:round,winner:win?win.i:-1,humanWon:win?win.human:false};
  document.title='결과: '+JSON.stringify(window.__result);
  stageActors=win?[win.job]:[];
  await transition(()=>{ mode='title'; },{text:'막이 내립니다',job:me.job});
  return bookScreen({left:`<h3>Finale</h3><h2>${win?`${win.name} 승리`:'무승부'}</h2>${win?`<img class="hero" alt="" src="${spriteURL(win.job,1.7)}">`:''}`,right:`<h3>마지막 장</h3><p class="quote">${win?(win.human?'당신의 줄만이 끝까지 팽팽했습니다.':'끝까지 서 있던 것은 당신이 아니었습니다.'):'마지막 두 줄이 동시에 끊어졌습니다.'}</p><p class="dim">${round}번의 소집 끝에 막이 내립니다.</p>`,buttons:[{label:'다시 하기',value:'again'}],tag:STOP==='end'?'end':'end_'});
}
(async function main(){
  P=makePlayers(0); frame();
  const demo=params.get('demo');   // 디버그: ?demo=load / ?demo=duel / ?demo=book
  if(demo==='load'){ transition(()=>new Promise(()=>{}),{text:'NOW LOADING',tip:TIPS[0],job:JOBS[2]}); return; }
  if(demo==='duel'){ P.forEach(p=>p.gold=8); P[0].job=JOBS[+(params.get('a')||0)]; P[1].job=JOBS[+(params.get('b')||1)]; stageActors=[]; startDuelScene(P[0],P[1]); duelScene.count=0; duelScene.humanCtl=false; showSpellButtons(duelScene.d.A); return; }
  if(demo==='sprites'){ ui.innerHTML='<div class="scr" style="background:#a99b78"><div style="display:flex;gap:10px;pointer-events:auto">'+JOBS.map(j=>`<img src="${spriteURL(j,1.7)}" style="height:380px">`).join('')+'</div></div>'; return; }
  if(demo==='book'){ P.forEach(p=>p.gold=8); P[0].human=true; await assignScreen(); return; }
  while(true){ const act=await titleScreen(); if(act==='sim'||(AUTO&&act!=='start')) break; await playGame(); if(AUTO) break; }
})();
</script>
