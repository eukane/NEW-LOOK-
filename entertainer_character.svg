  <path d="M462 160 L474 106 L424 136 Z" fill="#ffe94d" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M338 144 L333 120 L358 134 Z" fill="#ff2f7a"/>
  <path d="M462 144 L467 120 L442 134 Z" fill="#ff2f7a"/>

