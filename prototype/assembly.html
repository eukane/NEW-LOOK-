<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>줄 위의 극장 · 소집 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gugi&family=Hahmlet:wght@400;700;900&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0907;--paper:#a99b78;--blood:#7c1620;--brass:#8f7340;--bone:#d9cdb0;
  --f-disp:"Gugi","Black Han Sans","Noto Serif KR","WenQuanYi Zen Hei",serif;
  --f-body:"Hahmlet","Noto Serif KR","Noto Sans KR","WenQuanYi Zen Hei",serif;
  --f-black:"UnifrakturCook","Gugi",serif}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:#070403;color:var(--bone);font:16px/1.6 var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.scr.left{justify-content:flex-start;padding-left:max(16px,4vw)}
.scr.bottom{align-items:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.panel{pointer-events:auto;max-width:520px;width:100%;max-height:92vh;overflow:auto;background:linear-gradient(#17100c ,#0d0806);color:var(--bone);border:1px solid #5a4528;border-radius:2px;box-shadow:0 0 0 3px #0a0604,0 0 0 4px #3d2e1a,0 24px 80px #000d;padding:24px 26px;position:relative}
.panel:before{content:"";position:absolute;inset:6px;border:1px solid #3a2c18;pointer-events:none}
.disp{font-family:var(--f-disp);letter-spacing:.04em}
.title{font:400 44px/1.05 var(--f-disp);margin:0 0 6px;color:#e6dcc0;transform:skewX(-6deg);text-shadow:3px 0 #7c1620,-2px 0 #1d4a52,0 4px 18px #000}
.sub{font:700 12px var(--f-black);letter-spacing:.35em;color:#8f7340;text-transform:uppercase}
.panel p{margin:8px 0}.dim{color:#9a8c6c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{pointer-events:auto;background:linear-gradient(#7c1620,#4a0c14);color:#e9dcc0;border:1px solid #2a0508;outline:1px solid #8f7340;outline-offset:-4px;padding:11px 24px;font:400 16px var(--f-disp);cursor:pointer;box-shadow:0 4px 0 #1e0306,0 8px 18px #000a;letter-spacing:.08em;transform:skewX(-6deg)}
.btn:active{transform:skewX(-6deg) translateY(2px);box-shadow:0 2px 0 #1e0306}
.btn.ghost{background:transparent;color:#cdbd96;border-color:#5a4528;outline-color:#3a2c18;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #3d2e1a;padding:8px 10px;margin:8px 0;background:#00000040;cursor:pointer;font-size:14px}
label.opt small{display:block;color:#8d7f60}
select{background:#0b0705;color:var(--bone);border:1px solid #5a4528;padding:5px 8px;font:inherit}
table{border-collapse:collapse;width:100%;font-size:.88em;margin:8px 0}
th,td{border-bottom:1px solid #6b5c3e66;padding:5px 7px;text-align:left}th{font-family:var(--f-disp);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid #0e0907}
.win{color:#4f8a58;font-weight:900}.lose{color:#a3323d;font-weight:900}
.bkwrap{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
.bkwrap.show{opacity:1}
.bk{position:absolute;box-sizing:border-box;padding:5.5% 6.5% 6%;color:#1a120b;overflow:auto;pointer-events:auto;line-height:1.55;font-family:var(--f-body)}
.bk h2{font:400 1.55em/1.2 var(--f-disp);margin:0 0 .3em;color:#3a0a12;transform:skewX(-5deg);text-shadow:1px 0 #7c162066}
.bk h3{font:700 .72em var(--f-black);letter-spacing:.3em;margin:0 0 .6em;color:#5a4528;text-transform:uppercase}
.bk p{margin:.5em 0}.bk .dim{color:#5a4a30}
.bk table{font-size:.9em}.bk th,.bk td{border-bottom:1px solid #3a2c1866}.bk th{color:#3a0a12}
.bk .win{color:#1e5a2a}.bk .lose{color:#8a1a28}
.bk .btn{font-size:.95em;padding:.6em 1.4em}
.bk .btn.ghost{color:#3a2a14;border-color:#5a4528}
.bk img.hero{display:block;margin:0 auto;height:min(28vh,250px)}
.bk .pairs{display:flex;gap:.6em;justify-content:center;align-items:flex-end;margin:.2em 0}
.bk .pairs img{height:min(16vh,160px)}
.bk .vs{font:400 1.6em var(--f-disp);color:#7c1620;transform:skewX(-8deg)}
.bk .quote{font:italic 500 1.02em/1.7 var(--f-body);color:#2a1d10;border-left:3px solid #7c1620;padding-left:.8em;margin:.8em 0}
#spells{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px;pointer-events:none;z-index:5;--spw:84px}
#spells.row{top:auto;right:0;left:0;transform:none;bottom:max(10px,env(safe-area-inset-bottom));flex-direction:row;justify-content:center}
.sp{pointer-events:auto;position:relative;width:var(--spw);height:var(--spw);border-radius:50%;border:2px solid #8f7340;background:radial-gradient(#2a1c12,#0e0806);color:#e3d7b8;font:400 12px/1.2 var(--f-disp);text-align:center;overflow:hidden;box-shadow:0 0 0 3px #0a0604,0 8px 20px #000c;cursor:pointer;padding:0}
.sp b{display:block;font:700 10px var(--f-black);opacity:.7;letter-spacing:.2em}
.sp .cdm{position:absolute;inset:0;background:#000b;transform-origin:50% 100%;transform:scaleY(0)}
.sp.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.sp span{position:relative;z-index:1;display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:6px}
#mute{position:fixed;top:8px;right:8px;width:34px;height:34px;z-index:30;border-radius:50%;border:1px solid #5a4528;background:#0b0705cc;color:#d9cdb0;font:400 17px/1 var(--f-disp);cursor:pointer;padding:0;opacity:.8}
#mute.off{color:#7a6a4a;text-decoration:line-through}
#skip{position:fixed;right:14px;bottom:12px;z-index:6;padding:8px 18px;font-size:14px}
#actbtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;z-index:6;display:none;border:2px solid #8f7340;background:radial-gradient(#3a2414,#120a06);color:#e9dcc0;font:400 15px/1.25 var(--f-disp);box-shadow:0 0 0 4px #0a0604,0 10px 26px #000c;cursor:pointer;padding:0;touch-action:none}
#tray{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(128px,calc(env(safe-area-inset-bottom) + 120px));display:none;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-end;max-height:calc(100dvh - 250px);gap:9px;z-index:6;align-items:flex-end}
.tb{width:58px;height:58px;border-radius:50%;border:2px solid #5a4528;background:radial-gradient(#2a2418,#0e0a06);color:#cdbd96;font:400 11px/1.2 var(--f-disp);cursor:pointer;padding:0;touch-action:none;box-shadow:0 0 0 3px #0a0604,0 8px 18px #000c;transition:transform .08s}
.tb:active{transform:scale(.92)}
.tb:disabled{opacity:.38}
#lightbtn.on{border-color:#ffe9a0;color:#fff2c0;background:radial-gradient(#5a4a22,#1a1408);box-shadow:0 0 0 3px #0a0604,0 0 22px #f6e3a6aa}
#lurebtn{border-color:#8f7340;color:#e3d29a}
#shakebtn{border-color:#8a3a4a;color:#e7b4bc}
#lockbtn{border-color:#5a7a8a;color:#bcd2dc}
#trapbtn{border-color:#7a8a4a;color:#d4e0a0}
#morphbtn{border-color:#a8432c;color:#ffb090}
#skbtn{border-color:#8f7340;color:#f1e6c8}
#skbtn.rdy{border-color:#f6d27a;color:#fff;box-shadow:0 0 0 3px #0a0604,0 0 18px #f6d27a88}
#morphbtn.rdy{border-color:#ff8a5c;color:#fff;background:radial-gradient(#6a2a1a,#1a0a06);box-shadow:0 0 0 3px #0a0604,0 0 24px #ff6a3aaa;animation:pulseR .8s infinite alternate}
@keyframes pulseR{to{box-shadow:0 0 0 3px #0a0604,0 0 36px #ff8a5cee}}
#actbtn.on{border-color:#ffe9a0;box-shadow:0 0 0 4px #0a0604,0 0 26px #f6e3a688,0 10px 26px #000c}
#actbtn:disabled{opacity:.45}
#load{position:fixed;inset:0;z-index:20;pointer-events:none;visibility:hidden}
#load.on{visibility:visible;pointer-events:auto}
#load .cur{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#2a070c 0 22px,#3d0d15 22px 44px,#2f0910 44px 66px);box-shadow:inset 0 0 90px #000d;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
#load .cur.l{left:0;transform:translateX(-101%);border-right:5px solid #5a4528}
#load .cur.r{right:0;transform:translateX(101%);border-left:5px solid #5a4528}
#load.closed .cur.l,#load.closed .cur.r{transform:translateX(0)}
#load .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .25s .25s}
#load.closed .mid{opacity:1}
@media (max-height:720px){.panel{padding:16px 22px}.title{font-size:34px}label.opt{padding:5px 9px;margin:5px 0;font-size:13px}.panel p{margin:5px 0;font-size:14px}.row{margin-top:10px}}
@keyframes stampIn{0%{transform:rotate(-12deg) scale(2.6);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.bk .hv{display:flex;align-items:flex-end;justify-content:center;gap:.2em;position:relative;margin:.1em 0 .3em}
.bk .hv img{height:min(30vh,250px)}.bk .hv .vs{align-self:center;font-size:2em}
.bk .hv .dead{filter:grayscale(1) brightness(.6);transform:rotate(-8deg) translateY(6%)}
.bk .hp{text-align:center;letter-spacing:.12em;color:#8a1a28;font-size:1.1em}.bk .hp i{font-style:normal;color:#3a2a1488}
.bk .nm{text-align:center;font:400 .95em var(--f-disp)}
.stamp{position:absolute;left:50%;margin-left:-1.7em;top:3%;white-space:nowrap;font:400 2.1em var(--f-disp);padding:.05em .45em;border:.1em solid currentColor;border-radius:.15em;transform:rotate(-12deg);animation:stampIn .45s .15s both;text-shadow:0 0 1px currentColor;mix-blend-mode:multiply;background:#ffffff0d}
.stamp.w{color:#1e5a2a}.stamp.l{color:#8a1a28}
.mini{display:flex;align-items:center;gap:.5em;border-top:1px solid #3a2c1855;padding:.45em 0}
.mini img{height:3.4em}.mini .mid{flex:1;font-size:.88em}.mini .res{font:400 .9em var(--f-disp);color:#3a0a12}
.rew{border:1px solid #5a4528;background:#00000010;padding:.6em .8em;margin:.7em 0;text-align:center}
.rew b{font:400 1.5em var(--f-disp);color:#1e5a2a}.rew.l b{color:#8a1a28}

.menu{text-align:left}.menu .btn{display:block;width:100%;margin:12px 0 0;text-align:center;padding:14px 20px;font-size:18px}
.logo{font:400 62px/1 var(--f-disp);margin:6px 0 4px;color:#e9dfc2;transform:skewX(-7deg);text-shadow:4px 0 #7c1620,-3px 0 #1d4a52,0 6px 24px #000}
.tag{font:italic 500 15px/1.7 var(--f-body);color:#a89a78;border-left:3px solid #7c1620;padding-left:12px;margin:14px 0 18px}
.jobs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.jobs .chip{border:1px solid #3d2e1a;padding:3px 9px;font-size:12px;background:#0006}
.setgrp{border:1px solid #3d2e1a;background:#0005;padding:10px 12px;margin:10px 0}.setgrp h4{margin:0 0 6px;font:400 13px var(--f-disp);color:#8f7340;letter-spacing:.2em}
.vrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#080403e6;border:1px solid #5a4528;padding:8px 12px;box-shadow:0 0 0 3px #0a0604}
.vrow span.l{font:400 12px var(--f-disp);color:#8f7340;letter-spacing:.15em;margin-right:4px}
.vc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid #b3202f;background:#3a0c12;color:#f1d4d4;font:400 12px var(--f-disp)}
.vc.cut{border-color:#4a3a20;background:#14100c;color:#6a5a3e;text-decoration:line-through}
.cards{display:flex;gap:10px;margin:2px 0 8px}.card2{flex:1;border:1px solid #4a3a20;background:#0008;padding:10px 12px;text-align:center}
.card2 .k{font:400 12px var(--f-disp);color:#8f7340;letter-spacing:.2em}.card2 .n{font:400 40px/1.1 var(--f-disp)}.card2 .n.w{color:#7fcf8a}.card2 .n.l{color:#e0506a}.card2 .n.z{color:#6a5a3e}
.card2 .s{font-size:12px;color:#a89a78;min-height:2.6em}
.body{display:block;height:min(19vh,150px);width:auto;flex:none}
.wq{width:100%;box-sizing:border-box;margin:.5em 0;padding:.65em .8em;background:#f3e8c8cc;border:1px solid #5a4528;border-bottom:3px double #5a4528;color:#2a1d10;font:500 1em var(--f-body);outline:none}
.wq:focus{background:#fbf2d6;border-color:#7c1620}
.wc{display:inline-block;margin:.2em .3em .2em 0;padding:.3em .7em;background:#00000014;border:1px dashed #5a4528;color:#3a2a14;font:500 .85em var(--f-body);cursor:pointer;pointer-events:auto}
.wc:hover{background:#7c162022}
.slip{position:relative;background:linear-gradient(#f1e5c0,#e2d2a6);border:1px solid #6a5632;padding:.55em .8em;margin:.55em 0;color:#2a1d10;box-shadow:2px 3px 0 #0003;font:500 .95em/1.5 var(--f-body);opacity:0;animation:slipIn .6s forwards;clip-path:polygon(0 4%,3% 0,97% 2%,100% 0,100% 96%,97% 100%,4% 98%,0 100%)}
.slip:nth-child(odd){transform:rotate(-.8deg)}.slip:nth-child(even){transform:rotate(.7deg);margin-left:.8em}
.slip i{display:block;font:italic 400 .7em var(--f-body);color:#7c1620;margin-bottom:.1em}
@keyframes slipIn{from{opacity:0;transform:translateY(-14px) rotate(2deg)}to{opacity:1}}
.seal{display:inline-block;width:2.4em;height:2.4em;border-radius:50%;background:radial-gradient(#a3232f,#5a0a14);color:#e9c9a0;text-align:center;line-height:2.4em;font:400 1em var(--f-disp);box-shadow:0 2px 4px #0006;transform:rotate(-8deg)}
#pausebtn{position:fixed;top:8px;right:48px;width:34px;height:34px;z-index:30;border-radius:50%;border:1px solid #5a4528;background:#0b0705cc;color:#d9cdb0;font:400 13px/1 var(--f-disp);cursor:pointer;padding:0;opacity:.8;display:none}
#pause{position:fixed;inset:0;z-index:40;background:radial-gradient(#000a,#000e);display:none;align-items:center;justify-content:center;padding:16px}
#pause.on{display:flex}
#pause .panel{max-width:420px}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.sl span{width:92px;flex:none;color:#bba878}
.sl input{flex:1;accent-color:#a3232f;height:22px}
#tip{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(92vw,520px);z-index:25;background:linear-gradient(#1e150e,#0e0a07);border:1px solid #8f7340;box-shadow:0 0 0 3px #0a0604,0 12px 30px #000c;padding:10px 16px 10px 14px;color:#e6dcc0;font:500 14px/1.55 var(--f-body);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;display:flex;gap:10px;align-items:flex-start}
#tip.xp{left:224px;right:128px;transform:translateY(20px);max-width:none;bottom:14px;font-size:12.5px;line-height:1.5;padding:8px 12px;background:linear-gradient(#1e150ecc,#0e0a07cc)}
#tip.xp.on{transform:none}
@media (max-width:700px){#tip.xp{left:12px;right:12px;bottom:auto;top:122px;transform:translateY(-12px)}}
#tip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tip.dt{bottom:auto;top:72px;max-width:min(88vw,420px);font-size:12.5px;padding:7px 12px;opacity:0}
#tip.dt.on{opacity:.92}
#tip b{font:400 11px var(--f-disp);letter-spacing:.2em;color:#8f7340;display:block;margin-bottom:2px}
#tip i{font-style:normal;color:#e0b43a;font:400 20px/1 var(--f-disp)}
#load .t{font:700 26px var(--f-black);letter-spacing:.22em;color:#d8ccb0;text-shadow:0 2px 0 #000}
#load .tip{font-size:14px;color:#a89a78;max-width:80vw;text-align:center;min-height:42px}
#load canvas{width:min(560px,92vw);height:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="spells"></div>
<button id="actbtn" disabled>수색</button>
<div id="tray"><button id="shakebtn" class="tb">실<br>흔들기</button><button id="lockbtn" class="tb" style="display:none">자물쇠<br>×1</button><button id="lurebtn" class="tb">미끼<br>×2</button><button id="morphbtn" class="tb" style="display:none">원한<br>0%</button><button id="skbtn" class="tb" style="display:none">능력</button><button id="trapbtn" class="tb">덫<br>×3</button><button id="lightbtn" class="tb">얼굴 빛<br>OFF</button></div>
<button id="mute" title="소리 (M)">♪</button>
<button id="pausebtn" title="일시정지 (Esc)">Ⅱ</button>
<div id="pause"><div class="panel"><div class="sub">Paused</div><h2 class="disp" style="margin:4px 0 6px;font-size:26px">일시정지</h2><div id="pause-set"></div><div class="row" style="justify-content:center"><button class="btn" id="pz-resume">계속하기</button><button class="btn ghost" id="pz-quit">처음 화면으로</button></div></div></div>
<div id="tip"></div>
<div id="load"><div class="cur l"></div><div class="cur r"></div>
  <div class="mid"><canvas id="lcv" width="560" height="260"></canvas><div class="t" id="lt">NOW LOADING</div><div class="tip" id="ltip"></div></div></div>

<script>
/* ===================== CORE:BEGIN (DOM 없음: 규칙 + 듀얼 엔진) ===================== */
const JOBS = [
  {id:'ent',  name:'엔터테이너', color:'#f6e3a6', goal:'빛을 켜고 위기를 넘겨 시청자를 쌓는다. 시청자가 많을수록 빠르고 듀얼에서 강해진다'},
  {id:'tech', name:'기술자',     color:'#9be37a', goal:'발전기 3개를 직접 고쳐 탈출구를 연다. 3번 탈출하면 승리 (대신 듀얼이 약하다)'},
  {id:'scout',name:'수색자',     color:'#7fe3ff', goal:'함정·허수아비·미믹을 찾아 해제한다 (해제마다 재화 +1)'},
  {id:'arch', name:'기록자',     color:'#cdb6ff', goal:'괴물 4종을 멀리서 관찰해 기록한다 (2종마다 재화 +1, 기록한 괴물은 나를 잘 못 본다, 4종 완성 시 +1과 수색 20% 단축)'},
  {id:'mender',name:'수선공',   color:'#ff9ec7', goal:'쓰러진 사람을 일으키고 끊긴 실을 이어 준다 (한 번에 재화 +1, 최대 4). 괴물 가위에 실이 끊기지 않고, 듀얼에서 상처를 한 번 꿰맨다'},
  {id:'digger',name:'도굴꾼',   color:'#c4824a', goal:'금 상자가 반짝여 보이고, 빈 땅을 파서 숨은 보물을 찾는다 (무덤가에서 성공률 ↑, 실패하면 뼈 소리가 괴물을 부른다)'},
  {id:'scare',name:'허수아비',   color:'#d9c46a', goal:'가만히 서 있으면 짚단으로 굳어 괴물의 눈을 속인다. 괴물이 곁을 지나가는 동안 버티면 재화를 얻는다 (움직이면 풀린다)'},

function absDuel(a,b){
  const sa = 0.5*a.skill + 0.35*level(a)/5 + 0.075*gauss(), sb = 0.5*b.skill + 0.35*level(b)/5 + 0.075*gauss();
  return sa>=sb ? a : b;
}
function botGame(rules){
  const P = makePlayers(-1); let rounds = 0;
  while(alive(P).length>1 && rounds<60){
    rounds++; gainGold(P);
    pairUp(P).pairs.forEach(([a,b])=>{
      const w = absDuel(a,b); w.duelWins++; w.gold += 1;
      applyPair(a,b,w, aiPicks(a,b,picksFor(a,w===a,rules)), aiPicks(b,a,picksFor(b,w===b,rules)), rules);
    });
  }
  const al = alive(P);
  return {rounds, winner: al.length===1 ? al[0].i : -1, duelWins:P.map(p=>p.duelWins)};
}
function runBotGames(rules, n){
  let sum=0, draws=0, leaderGames=0, leaderWins=0;
  for(let g=0; g<n; g++){
    const r = botGame(rules); sum += r.rounds; if(r.winner<0) draws++;
    const mx = Math.max(...r.duelWins), idx = r.duelWins.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
    if(idx.length===1 && r.winner>=0){ leaderGames++; if(idx[0]===r.winner) leaderWins++; }
  }
  return {games:n, avgRounds:sum/n, draws:draws/n, leaderRate:leaderWins/Math.max(1,leaderGames)};
}

}

function stepDuel(d,dt){
  if(d.over) return; d.t+=dt;
  d.spd = 1+Math.min(1,Math.max(0,(d.t-10)/35))*0.65;   // 10초 뒤부터 서서히 탄 가속 (최대 ×1.65)
  const bdt=dt*d.spd;
  for(const m of [d.A,d.B]){
    const f = m===d.A?d.B:d.A;
    m.inv=Math.max(0,m.inv-dt); for(let i=0;i<3;i++) m.cd[i]=Math.max(0,m.cd[i]-dt);
    let vx=m.mx, vy=m.my;
    if(m.tx!==null){ const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy); if(dist>2){ const sp=Math.min(dist/dt, m.speed*1.15); m.x+=dx/dist*sp*dt; m.y+=dy/dist*sp*dt; } vx=vy=0; }
    const mag=Math.hypot(vx,vy); if(mag>0){ m.x+=vx/Math.max(1,mag)*m.speed*dt; m.y+=vy/Math.max(1,mag)*m.speed*dt; }
    m.x=Math.max(32,Math.min(AW-32,m.x)); m.y=Math.max(m.minY,Math.min(m.maxY,m.y));
    m.shot-=dt; if(m.shot<=0){ m.shot=0.7/d.spd; BASIC[m.job.id](d,m,f); }
  }
  for(let i=d.timers.length-1;i>=0;i--){ const tm=d.timers[i]; tm.t-=dt; if(tm.t<=0){ d.timers.splice(i,1); tm.fn(); } }
  for(let i=d.bul.length-1;i>=0;i--){
    const b=d.bul[i]; if(!b) continue; b.age+=bdt; if(b.upd) b.upd(b,bdt);
    b.x+=b.vx*bdt; b.y+=b.vy*bdt; if(b.spin) b.rot+=b.spin*bdt;
    if(d.fxOn && b.trail){ b.tr.push(b.x,b.y); if(b.tr.length>b.trail*4) b.tr.splice(0,2); }
    const t=b.tgt; let remove=!!b.dead;

    if(b.x<-60||b.x>AW+60||b.y<-60||b.y>AH+60) remove=true;
    if(remove) d.bul.splice(i,1);
  }
  for(let i=d.zones.length-1;i>=0;i--){
    const z=d.zones[i]; z.t+=dt;
    if(z.phase==='wait' && z.t>=0) z.phase='warn';

      if(z.type==='slam'){ ev(d,'slam',z); d.shake=Math.max(d.shake,0.5); burst(d,z.x,z.y,'#c9c2a8',26,300,'spark');
        if(z.tgt.inv<=0 && Math.hypot(z.tgt.x-z.x,z.tgt.y-z.y)<z.rad+z.tgt.r) damage(d,z.tgt,'#ffd27a','spark');
        const r0=rand()*6.283; for(let k=0;k<8;k++) shoot(d,z.owner,{x:z.x,y:z.y,ang:r0+k/8*6.283,sp:190,r:7,shape:'rivet',spin:7,trail:2}); }
      else if(!z.type) ev(d,'zap',z);
      if(z.fire){ const a=Math.atan2(z.tgt.y-z.y,z.tgt.x-z.x); shoot(d,z.owner,{x:z.x,y:z.y,ang:a,sp:440,r:8,shape:'spear',trail:9}); }
      if(z.drop){ shoot(d,z.owner,{x:z.x,y:z.y,ang:downAng(z.owner),sp:130+rand()*90,r:9,shape:'glyph',spin:(rand()-0.5)*4,ch:GLYPHS[ri(GLYPHS.length)]}); }
      if(!z.type) burst(d,z.x,AH*0.5,'#c8ffd8',14,300);
    }
    if(z.phase==='act' && !z.type && z.tgt.inv<=0 && Math.abs(z.tgt.x-z.x)<z.w/2+z.tgt.r) damage(d,z.tgt,'#c8ffd8','spark');
    if(z.t>=z.warn+z.act) d.zones.splice(i,1);
  }
  for(let i=d.sparks.length-1;i>=0;i--){ d.sparks[i].t+=dt; if(d.sparks[i].t>0.5) d.sparks.splice(i,1); }
  if(d.fxOn){
    for(let i=d.parts.length-1;i>=0;i--){ const p=d.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; if(p.k==='ember') p.vy-=150*dt; else if(p.k==='spark') p.vy+=300*dt; else if(p.k==='ink') p.vy+=90*dt; if(p.t>p.life) d.parts.splice(i,1); }
    for(let i=d.fx.length-1;i>=0;i--){ d.fx[i].t+=dt; if(d.fx[i].t>0.9) d.fx.splice(i,1); }
    d.shake=Math.max(0,d.shake-dt); d.flash=Math.max(0,d.flash-dt);
  }
  for(const m of [d.A,d.B]) if(m.face==='hurt' && m.inv<0.8) m.face='idle';
  d.banners.forEach(b=>b.t+=dt); d.banners=d.banners.filter(b=>b.t<1.4);
  if(d.A.hp<=0 || d.B.hp<=0 || d.t>=DUR){ d.over=true; }
}
function duelResult(d){
  const a=d.A, b=d.B; let w;

  return {winner:w.p, hitsA:HP0-a.hp, hitsB:HP0-b.hp, hpA:a.hp, hpB:b.hp, t:d.t};
}

function aiControl(d,me,foe,skill,dt){
  const ai = me.ai || (me.ai={next:0,mx:0,my:0,castWait:0.8+rand()});
  ai.next-=dt;
  if(ai.next<=0){
    ai.next = 0.11 + (1-skill)*0.24;
    let best=[0,0], bs=1e9;
    const cand=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[.7,-.7],[-.7,.7],[-.7,-.7]];
    for(const c of cand){
      let score=0;
      for(const tt of [0.18,0.4]){
        const px=me.x+c[0]*me.speed*tt, py=me.y+c[1]*me.speed*tt, wgt = tt<0.3?3:1.6;
        for(const b of d.bul){ if(b.owner===me) continue;
          const dist=Math.hypot(b.x+b.vx*d.spd*tt-px, b.y+b.vy*d.spd*tt-py)-b.r-me.r;
          if(dist<46) score+=(46-Math.max(dist,0))*wgt+(dist<0?500*wgt:0); }
        for(const z of d.zones){ if(z.type==='slam'){ if(z.owner===me||z.phase!=='warn') continue; const left=z.warn-z.t, dd=Math.hypot(px-z.x,py-z.y)-z.rad-me.r;
            if(dd<12 && left<1.0) score += left<tt+0.3 ? 900 : 120; continue; }
          if(z.owner===me || z.type) continue;
          if(z.phase==='warn'||z.phase==='act'){ const dx=Math.abs(px-z.x)-z.w/2-me.r; if(dx<40) score+=(40-Math.max(dx,0))*(z.phase==='act'?4:1.6)+(dx<0&&z.phase==='act'?800:0); } }
      }
      const ex=me.x+c[0]*me.speed*0.45, ey=me.y+c[1]*me.speed*0.45;
      if(ex<60||ex>AW-60||ey<me.minY+10||ey>me.maxY-10) score+=140;
      score += Math.abs(ey-me.homeY)*0.035 + Math.abs(ex-foe.x)*0.012 + (c[0]===0&&c[1]===0?3:0) + rand()*2;
      if(score<bs){ bs=score; best=c; }
    }
    if(rand()<0.05+(1-skill)*0.22) best=cand[ri(cand.length)];
    ai.mx=best[0]; ai.my=best[1];
  }
  me.mx=ai.mx; me.my=ai.my; me.tx=null;
  ai.castWait-=dt;
  if(ai.castWait<=0){
    const ready=[0,1,2].filter(i=>canCast(d,me,i));
    if(ready.length){ castSpell(d,me,ready[ri(ready.length)]); ai.castWait=0.35+rand()*(1.6-skill); } else ai.castWait=0.2;
  }
}

  return duelResult(d);
}

/* ===================== 신규 직업: 탐험 능력 레지스트리 =====================
 * XSK[직업] = {name,desc,cd,max,regen, use(w,e), bot(w,e), tick(w,e,dt), onChest(w,e,o), spd(w,e), goal(e,w)}
 * 월드에 남는 효과(조명탄·구름·방벽·분신 …)는 w.xfx에 넣고 스냅숏으로 모두에게 동기화한다. */
const XSK={};
function xfxAdd(w,o){ o.id=++w.xfxN; o.t=o.t||1; o.t0=o.t; w.xfx.push(o); return o; }
function doSkill(w,e){ const K=XSK[e.p.job.id]; if(!K||!K.use||e.xsT>0||e.skN<=0||e.stun>0||e.out||!e.p.alive||e.morph>0||e.hidden||w.over) return false; if(!K.use(w,e)) return false; e.skN--; e.xsT=K.cd; w.events.push({type:'xsk',e}); return true; }
function xCloudMul(w,x,y,fid,own){ let m=1; for(const f of w.xfx){ if(f.k!=='poison'||(f.fid||0)!==(fid||0)||f.own===own) continue; if(Math.hypot(f.x-x,f.y-y)<f.r) m=0.55; } return m; }
function xSkillTick(w,e,dt){ const K=XSK[e.p.job.id]; if(!K) return; e.xsT=Math.max(0,e.xsT-dt); if(K.regen&&e.skN<K.max){ e.skR+=dt; if(e.skR>=K.regen){ e.skR=0; e.skN++; } } if(K.tick) K.tick(w,e,dt); if(K.spd) e.perk.spd*=K.spd(w,e); }
/* (독 구름 감속은 아래 공통 계산에서) */
Object.assign(EXP_PERK,{jester:{spd:1,chest:0.85,gen:1,sight:1},seer:{spd:1,chest:0.78,gen:1,sight:1},clock:{spd:0.98,chest:1,gen:0.72,sight:1},lamp:{spd:0.94,chest:0.95,gen:0.95,sight:1}});
const seerPg=w=>w.pg||w.mons.map((m,i)=>m.ptgt&&!m.asleep&&!m.type.fly?[i,Math.round(m.ptgt.x),Math.round(m.ptgt.y),m.ptgt.fid||0]:null).filter(Boolean);
const seerMm=w=>w.mm||w.objs.map((o,i)=>o.type==='chest'&&o.kind==='mimic'&&!o.done?i:-1).filter(i=>i>=0);
XSK.jester={ onChest(w,e,o){ if(o.kind!=='gold') return; const r=rand(); if(r<0.4){ e.gain+=1; e.xa++; w.events.push({type:'xgam',e,ok:1}); } else if(r<0.55){ noise(w,o.x,o.y,420,'lure'); w.events.push({type:'xgam',e,ok:0}); } },
  goal:e=>`도박 성공 ${e.xa|0}회 · 상자를 열 때 40%는 재화 +1, 15%는 방울이 울려 소음` };
XSK.seer={ onChest(w,e,o){ if(o.kind==='mimic'){ o.kind='gold'; o.val=1; e.xa++; w.events.push({type:'xgam',e,ok:2}); } },

const solidAt=(w,x,y,r)=>{ for(const q of w.rects){ if(x>q.x-r&&x<q.x+q.w+r&&y>q.y-r&&y<q.y+q.h+r) return true; } for(const c of w.circs){ if(Math.hypot(x-c.x,y-c.y)<c.r+r) return true; } return false; };
const sightBlock=(w,x,y)=>{ for(const q of w.rects){ if(q.kind==='plank'||q.low) continue; if(x>q.x&&x<q.x+q.w&&y>q.y&&y<q.y+q.h) return true; } for(const c of w.circs){ if(c.kind==='pond') continue; if(Math.hypot(x-c.x,y-c.y)<c.r*0.8) return true; } return false; };
function hasLOS(w,x1,y1,x2,y2){ const d=Math.hypot(x2-x1,y2-y1), n=Math.ceil(d/16); for(let i=1;i<n;i++) if(sightBlock(w,x1+(x2-x1)*i/n,y1+(y2-y1)*i/n)) return false; return true; }
function clearLine(w,a,b,r=15){ const d=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.ceil(d/14); for(let i=1;i<=n;i++) if(solidAt(w,a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n,r)) return false; return true; }
function pushOut(e,w){
  for(const q of w.rects){ if(q.kind==='plank'&&e.isMon&&false) continue; const cx=Math.max(q.x,Math.min(e.x,q.x+q.w)), cy=Math.max(q.y,Math.min(e.y,q.y+q.h)); const dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy);
    if(d<e.r){ if(d>0.001){ e.x=cx+dx/d*e.r; e.y=cy+dy/d*e.r; } else { const l=e.x-q.x, r_=q.x+q.w-e.x, t=e.y-q.y, b=q.y+q.h-e.y, m=Math.min(l,r_,t,b); if(m===l) e.x=q.x-e.r; else if(m===r_) e.x=q.x+q.w+e.r; else if(m===t) e.y=q.y-e.r; else e.y=q.y+q.h+e.r; } } }
  for(const c of w.circs){ const dx=e.x-c.x, dy=e.y-c.y, d=Math.hypot(dx,dy), m=e.r+c.r; if(d<m){ const k=d>0.001?1/d:0; e.x=c.x+(k?dx*k:1)*m; e.y=c.y+(k?dy*k:0)*m; } }
}

  pew:{w:104,h:24,low:1}, coffin:{w:86,h:38,low:1}, bench:{w:98,h:32,low:1}, counter:{w:112,h:32,low:1}, crates:{w:38,h:38} };

  theatre:[['storage',2],['dressing',3],['library',3],['rehearsal',3],['workshop',2],['empty',0.7]],
  cemetery:[['chapel',3],['crypt',3],['storage',2],['library',2],['bedroom',2],['empty',0.7]],
  village:[['bedroom',3],['dining',3],['workshop',2],['storage',2],['shop',3],['empty',0.7]] };

function pickRoomType(th,r,used){ const L=ROOM_W[th.id]||ROOM_W.theatre, c=[]; for(const [k,wt] of L){ const m=ROOM_MIN[k]; if(m&&(r.w<m[0]||r.h<m[1])) continue; c.push([k,wt*(used.includes(k)?0.25:1)]); } if(!c.length) return rand()<0.6?'storage':'empty'; let t=c.reduce((a,b)=>a+b[1],0)*rand(); for(const [k,wt] of c){ t-=wt; if(t<=0) return k; } return c[0][0]; }

  const clear=(x,y,hw,hh,pad=10)=>{ if(x-hw<r.x+2||x+hw>r.x+rw-2||y-hh<r.y+2||y+hh>r.y+rh-2) return false; if(nearDoor(x,y,hw,hh)) return false;

  const okConn=()=>{ const S=20, M=37, x0=r.x+M, y0=r.y+M, W=Math.floor((rw-2*M)/S)+1, H=Math.floor((rh-2*M)/S)+1; if(W<2||H<2) return true;   // 40px 격자 길찾기에서도 지나갈 수 있도록 여유 있게(통로 90 이상) 본다

    if(!ents.length) return true; const cell=(x,y)=>{ const ci=Math.max(0,Math.min(W-1,Math.round((x-x0)/S))), cj=Math.max(0,Math.min(H-1,Math.round((y-y0)/S))); for(let rr_=0;rr_<=2;rr_++) for(let dj=-rr_;dj<=rr_;dj++) for(let di=-rr_;di<=rr_;di++){ const a=ci+di, b=cj+dj; if(a>=0&&b>=0&&a<W&&b<H&&!bl[a+b*W]) return a+b*W; } return -1; };

    return cs.every(c=>seen[c])&&n>=free*0.6; };
  const put=(kind,x,y,side='n')=>{ const F=FURN[kind], hor=side==='n'||side==='s', hw=(hor?F.w:F.h)/2, hh=(hor?F.h:F.w)/2; if(!clear(x,y,hw,hh)) return false;
    placed.push({x,y,hw,hh}); if(!okConn()){ placed.pop(); return false; } w.rects.push({x:x-hw,y:y-hh,w:hw*2,h:hh*2,kind:'prop',pt:kind,low:F.low?1:0,side}); return true; };
  const along=(side,kind,n,gap=8)=>{ const F=FURN[kind], hor=side==='n'||side==='s', L=hor?F.w:F.h, D=hor?F.h:F.w, span=hor?rw:rh; let c=0;
    const slots=Math.floor((span-16+gap)/(L+gap)); if(slots<=0) return 0; const off=(span-(slots*(L+gap)-gap))/2;
    for(let i=0;i<slots&&c<n;i++){ const p=off+L/2+i*(L+gap); let x,y; if(hor){ x=r.x+p; y=side==='n'?r.y+D/2+3:r.y+rh-D/2-3; } else { y=r.y+p; x=side==='w'?r.x+D/2+3:r.x+rw-D/2-3; } if(put(kind,x,y,side)) c++; } return c; };
  const cluster=(corner,nx,ny)=>{ const F=FURN.crates, S=F.w+2; let c=0; for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){ const x=corner[1]==='w'?r.x+F.w/2+3+i*S:r.x+rw-F.w/2-3-i*S, y=corner[0]==='n'?r.y+F.h/2+3+j*S:r.y+rh-F.h/2-3-j*S; if(put('crates',x,y,'n')) c++; } return c; };
  const decRow=(side,k,n,sp,a=0,s=1)=>{ const hor=side==='n'||side==='s', span=hor?rw:rh, m=26; let c=0, flip=rand()<0.5; for(let i=0;i<n;i++){ const p=40+i*sp; if(p>span-40) break; const q=flip?span-p:p; let x,y; if(hor){ x=r.x+q; y=side==='n'?r.y+m:r.y+rh-m; } else { y=r.y+q; x=side==='w'?r.x+m:r.x+rw-m; } if(nearDoor(x,y,10,10)||!clear(x,y,12,12,0)) continue; dec(k,x,y,a,s); c++; } return c; };

// 복도: 긴 융단 + 벽 촛대 + 한쪽 벽의 낮은 가구 (벽 한쪽만 써서 통로를 남긴다)
function dressCorridor(w,c,ctx){

function drawParticles(c,parts){

    c.globalCompositeOperation='lighter'; c.globalAlpha=a;
    if(p.k==='star'){ c.fillStyle='#fff6d0'; c.save(); c.translate(p.x,p.y); c.rotate(p.rot+p.t*5); starPath(c,0,0,p.sz*2.3,p.sz*0.7,4,0); c.fill(); c.restore(); }
    else if(p.k==='spark'){ c.strokeStyle=a>0.5?'#fff2c0':p.col; c.lineWidth=2; c.lineCap='round'; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*0.045,p.y-p.vy*0.045); c.stroke(); }
    else if(p.k==='ember'){ const gl=glowSprite(p.col,p.sz*1.4); c.drawImage(gl.c,p.x-gl.s*0.7,p.y-gl.s*0.7,gl.s*1.4,gl.s*1.4); }
    else { c.fillStyle=p.col; c.beginPath(); c.arc(p.x,p.y,p.sz,0,7); c.fill(); } }
  c.restore(); c.globalAlpha=1;
}

/* ---- 실 선택/공개용 인형 (일반 비율 캐릭터 + 12개 연결점) ---- */
function puppetLayout(cx,top,bottom,wAllow){ const sc_=Math.min((bottom-top)/208,wAllow/100), feet=bottom-2*sc_; return {s:sc_,fx:cx,fy:feet,pts:ANCHORS.map(([x,y])=>[cx+x*sc_,feet+y*sc_]),barY:feet-206*sc_}; }
function drawStrings(c,L,state,t){
  const barX0=L.fx-L.s*46, barX1=L.fx+L.s*46;
  c.strokeStyle='#2a1a0e'; c.lineWidth=9; c.lineCap='round'; c.beginPath(); c.moveTo(barX0,L.barY); c.lineTo(barX1,L.barY); c.stroke();
  c.strokeStyle='#8f7340'; c.lineWidth=3; c.stroke();
  L.pts.forEach(([x,y],i)=>{
    const bx = barX0+(barX1-barX0)*(i+0.5)/12; const cut=state.cut&&state.cut.has(i), sel=state.sel&&state.sel.has(i), fl=state.flash&&state.flash.get(i);
    c.beginPath();
    if(cut){ c.moveTo(bx,L.barY); c.lineTo(bx+(x-bx)*0.35,L.barY+(y-L.barY)*0.35); c.moveTo(x,y); c.lineTo(x+(bx-x)*0.1,y-14); c.strokeStyle='rgba(190,50,60,.9)'; c.lineWidth=2.4; c.stroke(); }
    else { const wob = fl==='miss'? Math.sin(t*50)*5*Math.max(0,1-(state.flashT||0)*1.5):0; c.moveTo(bx,L.barY); c.quadraticCurveTo((bx+x)/2+wob,(L.barY+y)/2,x,y); c.strokeStyle= sel?'#ffe9a0':fl==='hit'?'#ff6a6a':'rgba(214,200,166,.5)'; c.lineWidth= sel||fl?3.4:1.8; c.stroke(); }
  });
}
function drawAnchors(c,L,state,t){
  L.pts.forEach(([x,y],i)=>{
    const cut=state.cut&&state.cut.has(i), sel=state.sel&&state.sel.has(i), mine=state.mine&&state.mine.has(i)&&!cut, fl=state.flash&&state.flash.get(i);
    const r=Math.max(13,L.s*4.6);
    c.beginPath(); c.arc(x,y,r,0,7);
    c.fillStyle= cut?'#3a0c12': sel?'#c9a85a': fl==='hit'?'#a1232f': fl==='miss'?'#2a2a33':'#150d09'; c.fill();
    c.lineWidth=3; c.strokeStyle= cut?'#b3202f': sel?'#fff4c6': mine?'#d98a8a':'#8f7340'; if(mine&&!sel) c.setLineDash([4,3]); c.stroke(); c.setLineDash([]);
    c.fillStyle= sel?'#1a0f06':cut?'#d98a8a':'#d9cdb0'; c.font=`400 ${Math.round(r*0.95)}px ${FD}`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(cut?'✕':String(i+1),x,y+1);
    if(fl==='hit'){ c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=3; c.beginPath(); c.arc(x,y,r+8+(state.flashT||0)*30,0,7); c.stroke(); }
  });
}
let pickScene=null, revScene=null;

function drawReveal(c,t){

function drawCam(c,o,t,w){

    c.globalCompositeOperation='lighter'; c.fillStyle=g; c.beginPath(); c.moveTo(o.x,o.y); for(const p of pts) c.lineTo(p[0],p[1]); c.closePath(); c.fill(); c.globalCompositeOperation='source-over'; }

function drawPtrap(c,o,t,me){

  c.fillStyle='#0e0907'; c.strokeStyle=col; c.lineWidth=2;

function drawMorphBeast(c,e,t){

function drawMonster(c,m,t){

  c.fillStyle=bell?'#2a1c30':'#07050a'; c.strokeStyle='#1c1426'; c.lineWidth=2; c.beginPath(); c.moveTo(-14,-46); c.quadraticCurveTo(-34,0,-26+sw,22); c.lineTo(-8,14); c.lineTo(0,24); c.lineTo(10,14); c.lineTo(26-sw,22); c.quadraticCurveTo(34,0,14,-46); c.closePath(); c.fill(); c.stroke();

  if(m.asleep){ c.restore(); c.save(); c.translate(m.x,m.y); c.fillStyle='#d9cdb0'; c.font=`400 ${bell?14:20}px ${FD}`; c.textAlign='center'; for(let i=0;i<3;i++){ const k=((t*0.5+i/3)%1); c.globalAlpha=1-k; c.fillText('z',14+i*8+k*6,-60-k*34); } c.restore(); return; }

function groundPattern(c,th){ if(groundPat[th.id]) return groundPat[th.id]; const cv_=document.createElement('canvas'); cv_.width=cv_.height=256; const x=cv_.getContext('2d'); const g_=x.createLinearGradient(0,0,256,256); g_.addColorStop(0,th.ground[0]); g_.addColorStop(1,th.ground[1]); x.fillStyle=g_; x.fillRect(0,0,256,256);
  const r=mulberry32(5); for(let i=0;i<700;i++){ x.fillStyle=`rgba(${r()<0.5?'0,0,0':'255,255,255'},${0.03+r()*0.05})`; x.fillRect(r()*256,r()*256,1+r()*3,1+r()*3); }
  x.strokeStyle='rgba(0,0,0,.18)'; x.lineWidth=1; for(let i=0;i<60;i++){ const px=r()*256, py=r()*256; x.beginPath(); x.moveTo(px,py); x.lineTo(px+(r()-0.5)*6,py-3-r()*6); x.stroke(); }
  return groundPat[th.id]=c.createPattern(cv_,'repeat'); }

const NET={ws:null,open:false,id:-1,room:'',host:false,token:'',base:'',started:false,retrying:false,lobby:[],sys:{},handlers:{},rpcId:0,pending:new Map(),closedMsg:null,

  // 재접속: 시작된 방에서 끊기면 같은 토큰으로 자리를 되찾는다 (호스트는 해당 안 됨)
  save(){ try{ localStorage.setItem('mt_sess',JSON.stringify({url:NET.base,room:NET.room,token:NET.token,t:Date.now()})); }catch(_){} },
  loadSave(){ try{ const s=JSON.parse(localStorage.getItem('mt_sess')||'null'); return s&&s.token&&Date.now()-s.t<20*60000?s:null; }catch(_){ return null; } },
  clearSave(){ try{ localStorage.removeItem('mt_sess'); }catch(_){} },

  duelScene={d,count:3,humanCtl:true,skillA:0,skillB:0,done:res,endT:0,res:null,humanIn:true,lastC:4,net:{client:true,flip:!!a.flip,snaps:[],bmap:new Map(),inT:0,shapes:[],cols:[]}};
  d.onEvent=null; clearScreen(); mode='duel'; showSpellButtons(d.A);
  NET.handlers.ds=m=>{ if(duelScene&&duelScene.net&&duelScene.net.client){ const q=duelScene.net.snaps; q.push(m.d); if(q.length>5) q.splice(0,q.length-2); } };
  showTip('duel','듀얼','화면을 드래그해 탄을 피하세요. 작은 하얀 점이 피격 판정입니다. 아래 버튼(1·2·3)이 스펠이에요.',3000,'dt');
});
function ndClientApply(sc,S){
  const d=sc.d, n=sc.net, fl=n.flip, X=x=>fl?AW-x:x, Y=y=>fl?AH-y:y, mine=fl?S.B:S.A, foe=fl?S.A:S.B;
  const setM=(m,a,self)=>{ m.sx=X(a[0]); m.sy=Y(a[1]); m.hp=a[2]; m.inv=a[3]; m.face=a[4]?'hurt':'idle'; if(!self){ m.mx=fl?-a[5]:a[5]; m.my=fl?-a[6]:a[6]; if(a[7]){ m.tx=X(a[8]); m.ty=Y(a[9]); } else { m.tx=null; m.ty=null; } } m.cd[0]=a[10]; m.cd[1]=a[11]; m.cd[2]=a[12]; if(!n.init){ m.x=m.sx; m.y=m.sy; } };
  setM(d.A,mine,true); setM(d.B,foe,false); n.init=true;
  sc.count=S.c; d.t=S.t; d.spd=S.sp; n.shapes=S.sd[0]; n.cols=S.sd[1];
  const keep=new Map(); d.bul=S.b.map(a=>{ const id=a[0]; let b=n.bmap.get(id); const own=a[13]; const sideSelf=(own===0)!==fl;   // 발사한 쪽이 나인가
    const vx=fl?-a[3]:a[3], vy=fl?-a[4]:a[4];
    if(!b){ b={id,tr:[],seed:id*7.31%100,owner:sideSelf?d.A:d.B,tgt:sideSelf?d.B:d.A}; }
    b.x=X(a[1]); b.y=Y(a[2]); b.vx=vx; b.vy=vy; b.r=a[5]; b.col=n.cols[a[6]]; b.shape=n.shapes[a[7]]; b.rot=a[8]+(fl?Math.PI:0); b.age=a[9]; b.trail=a[10]; b.ch=a[11]; b.spin=a[12]; keep.set(id,b); return b; });
  n.bmap=keep;
  d.zones=S.z.map(z=>{ const o={...z}; if(fl){ o.x=AW-o.x; if(o.y!==undefined) o.y=AH-o.y; } o.owner=(z.os==='A')!==fl?d.A:d.B; return o; });
  for(const q of S.q){ const t=q[0];
    if(t==='b'){ burst(d,X(q[1]),Y(q[2]),q[3],q[4],q[5],q[6]||undefined); }
    else if(t==='f'){ d.fx.push({kind:q[1],x:X(q[2]),y:Y(q[3]),t:0,col:q[4],job:q[5]}); }
    else if(t==='sp'){ d.sparks.push({x:X(q[1]),y:Y(q[2]),t:0,col:q[3]}); }
    else if(t==='bn'){ const side=q[3]; d.banners.push({text:q[1],col:q[2],t:0,side:fl?(side==='A'?'B':'A'):side}); }
    else if(t==='ev'){ const side=q[2], isMe=(side==='A')!==fl; const m=isMe?d.A:d.B;
      if(q[1]==='cast') sfx.play((CASTSFX[m.job.id]||'castArch'),{vol:isMe?0.85:0.55});
      else if(q[1]==='hit'){ sfx.play('hit',{vol:isMe?1:0.65,rate:isMe?1:1.12}); if(isMe){ d.shake=0.35; d.flash=0.35; vibrate(60); } }
      else if(q[1]==='slam') sfx.play('slam',{vol:0.9}); else if(q[1]==='zap') sfx.play('zap',{vol:0.8}); } }
  if(S.ov&&!d.over){ d.over=true; const meSide=fl?'B':'A', w=S.res&&S.res.w===meSide?d.A.p:d.B.p; sc.res={winner:w,hitsA:S.res?(fl?S.res.hB:S.res.hA):0,hitsB:S.res?(fl?S.res.hA:S.res.hB):0,t:d.t}; sc.endT=1.6; hideSpellButtons(); if(w.human) sfx.play('gong',{vol:0.7}); else sfx.play('lose',{vol:0.8}); }
}
function ndClientStep(sc,dt){
  const d=sc.d, n=sc.net;
  while(n.snaps.length) ndClientApply(sc,n.snaps.shift());
  if(sc.count>0){ const before=Math.ceil(sc.count); sc.count=Math.max(0,sc.count-dt); const c1=Math.ceil(sc.count); if(c1!==sc.lastC){ sc.lastC=c1; if(c1>0) sfx.play('tom',{arg:c1===1?1.25:1,vol:0.9}); else { sfx.play('tom',{arg:1.7,vol:1}); sfx.play('gong',{vol:0.3}); } } }
  const bdt=dt*(d.spd||1);
  if(!d.over){
    const m=d.A; m.mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0); m.my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
    // 예측 이동 (호스트와 같은 규칙) + 서버 위치로 부드럽게 보정
    if(sc.count<=0){ let vx=m.mx, vy=m.my; if(m.tx!==null){ const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy); if(dist>2){ const sp=Math.min(dist/dt, m.speed*1.15); m.x+=dx/dist*sp*dt; m.y+=dy/dist*sp*dt; } vx=vy=0; } const mag=Math.hypot(vx,vy); if(mag>0){ m.x+=vx/Math.max(1,mag)*m.speed*dt; m.y+=vy/Math.max(1,mag)*m.speed*dt; } m.x=Math.max(32,Math.min(AW-32,m.x)); m.y=Math.max(m.minY,Math.min(m.maxY,m.y)); }
    if(m.sx!==undefined){ const k=Math.min(1,dt*6), ex=m.sx-m.x, ey=m.sy-m.y; if(Math.hypot(ex,ey)>90){ m.x=m.sx; m.y=m.sy; } else { m.x+=ex*k; m.y+=ey*k; } }
    const f=d.B; if(f.sx!==undefined){ const k=Math.min(1,dt*18); f.x+=(f.sx-f.x)*k; f.y+=(f.sy-f.y)*k; }
    for(const b of d.bul){ b.x+=b.vx*bdt; b.y+=b.vy*bdt; b.age+=bdt; if(b.spin) b.rot+=b.spin*bdt; if(b.trail){ b.tr.push(b.x,b.y); if(b.tr.length>b.trail*4) b.tr.splice(0,2); } }
    n.inT-=dt; if(n.inT<=0){ n.inT=1/30; NET.to(0,{k:'di',mx:r2(m.mx),my:r2(m.my),tx:m.tx===null?null:Math.round(m.tx),ty:Math.round(m.ty||0)},true); }
    updateSpellButtons();
  } else { sc.endT-=dt; if(sc.endT<=0&&sc.done){ const f=sc.done; sc.done=null; NET.handlers.ds=null; hideSpellButtons(); duelScene=null; mode='title'; f(null); return; } }
  if(d.fx){ for(let i=d.fx.length-1;i>=0;i--){ d.fx[i].t+=dt; if(d.fx[i].t>0.9) d.fx.splice(i,1); } }
  for(const z of d.zones) z.t+=dt;
  for(let i=d.parts.length-1;i>=0;i--){ const p=d.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; if(p.k==='ember') p.vy-=150*dt; else if(p.k==='spark') p.vy+=300*dt; else if(p.k==='ink') p.vy+=90*dt; if(p.t>p.life) d.parts.splice(i,1); }
  for(let i=d.sparks.length-1;i>=0;i--){ d.sparks[i].t+=dt; if(d.sparks[i].t>0.5) d.sparks.splice(i,1); }
  d.banners.forEach(b=>b.t+=dt); d.banners=d.banners.filter(b=>b.t<1.4);
  d.shake=Math.max(0,d.shake-dt); d.flash=Math.max(0,d.flash-dt);
  for(const m of [d.A,d.B]) if(m.face==='hurt'&&m.inv<0.8) m.face='idle';
}
// 한 쌍의 듀얼을 사람이 참여하는 방식으로 진행 (A,B: 플레이어). 결과: {winner,hitsA,hitsB}
async function runInteractivePair(A0,B0){
  const loc=[A0,B0].find(p=>p.human&&p.alive);
  let A,B; if(loc){ A=loc; B=A===A0?B0:A0; } else { A=(A0.remote!=null)?A0:B0; B=A===A0?B0:A0; }
  const tip=`${lab(B)}과(와)의 1대1. 사용 가능: ${SPELLS[A.job.id].filter(s=>level(A)>=s.lv).map(s=>s.name).join(' · ')}`;
  const rem=[A,B].filter(p=>p.remote!=null&&p.ctl);
  await Promise.all([A,B].filter(p=>p.ctl&&p.alive).map(h=>h.human?transition(()=>{},{text:'입장',tip,job:h.job}):(NET.to(h.remote,{k:'rpc',id:0,fn:'trans',args:{o:{text:'입장',tip:`${lab(h===A?B:A)}과(와)의 1대1.`,job:h.job.id},P:serAll(h)}}),null)));
  const waits=rem.map(h=>NET.ask(h.remote,'duel',{me:h.i,foe:(h===A?B:A).i,flip:h===B,P:serAll(h)},null,300000));
  let rs;
  if(loc){ const sc0=startDuelScene(A,B,B.remote!=null); rs=await sc0; duelScene=null; hideSpellButtons(); mode='title'; }
  else rs=await runRemoteDuel(A,B);
  await Promise.all(waits);
  return {rs,A,B};
}
(async function main(){
  P=makePlayers(0); frame();
  if(params.has('snd')){ sfx.init(); window.__pk=0; setInterval(()=>{ window.__pk=Math.max(window.__pk,sfx.level()); const q=sfx.status(); document.title='audio '+q.state+' '+q.rate+'Hz loops['+q.loops+'] err '+(window.__sfxErr||0)+' '+(window.__sfxLast||'')+' peak '+window.__pk.toFixed(3); },200); }
  const demo=params.get('demo');   // 디버그: ?demo=load / ?demo=duel / ?demo=book
  if(demo==='load'){ transition(()=>new Promise(()=>{}),{text:'NOW LOADING',tip:TIPS[0],job:JOBS[2]}); return; }
  if(demo==='duel'){ P.forEach(p=>p.gold=8); P[0].job=JOBS[+(params.get('a')||0)]; P[1].job=JOBS[+(params.get('b')||1)]; stageActors=[]; startDuelScene(P[0],P[1]); duelScene.count=0; duelScene.humanCtl=false; showSpellButtons(duelScene.d.A); return; }
  if(demo==='sprites'){ ui.innerHTML='<div class="scr" style="background:#a99b78"><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto">'+JOBS.map(j=>`<img src="${spriteURL(j,1.7)}" style="height:300px">`).join('')+'</div></div>'; return; }
  if(demo==='sfxtest'){ sfx.init(); let n=0; for(const k of Object.keys(sfxGen)){ sfx.play(k,{arg:1.1,v:0}); sfx.play(k,{arg:0.8,v:2}); n+=2; } window.__pk=0; setInterval(()=>{ window.__pk=Math.max(window.__pk,sfx.level()); const q=sfx.status(); document.title='sfx played '+n+' err '+(window.__sfxErr||0)+' rate '+q.rate+' state '+q.state+' initErr '+(q.err||'none')+' peak '+window.__pk.toFixed(3); },100); return; }
  if(demo==='bullets'){ const cc=document.createElement('canvas'); cc.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:3;background:#120a08'; document.body.appendChild(cc); cc.width=innerWidth; cc.height=innerHeight; const x=cc.getContext('2d');
    const list=[['ent','star','#f6e3a6'],['ent','beam','#f6e3a6'],['ent','ring','#f6e3a6'],['ent','curtain','#f6e3a6'],['tech','bolt','#9be37a'],['tech','gear','#9be37a'],['tech','rivet','#9be37a'],['scout','flame','#7fe3ff'],['scout','wave','#7fe3ff'],['scout','spear','#7fe3ff'],['arch','page','#cdb6ff'],['arch','ink','#cdb6ff'],['arch','drop','#cdb6ff'],['arch','glyph','#cdb6ff']];
    const cols=5, cw_=innerWidth/cols, rh=innerHeight/Math.ceil(list.length/cols); list.forEach(([j,sh,col],i)=>{ const px=(i%cols+0.5)*cw_, py=(Math.floor(i/cols)+0.5)*rh, sp=bulletSprite(sh,col,'가'); const g2=glowSprite(col,16); x.save(); x.globalCompositeOperation='lighter'; x.globalAlpha=0.6; x.drawImage(g2.c,px-g2.s*1.3,py-g2.s*1.3,g2.s*2.6,g2.s*2.6); x.restore(); const k=Math.min(cw_,rh)/BSZ*BSS*0.9; x.drawImage(sp,px-BSZ/BSS*k/2*1.0,py-BSZ/BSS*k/2*1.0,BSZ/BSS*k,BSZ/BSS*k); x.fillStyle='#d9cdb0'; x.font='14px sans-serif'; x.textAlign='center'; x.fillText(sh,px,py+rh*0.46); }); return; }
  if(demo==='walk'){ const cc=document.createElement('canvas'); cc.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:3;background:#2a1f16'; document.body.appendChild(cc); cc.width=innerWidth; cc.height=innerHeight; const x=cc.getContext('2d'); JOBS.forEach((j,i)=>{ for(let k=0;k<4;k++) drawChar(x,80+k*150+i*0,150+i*170,0.9,j,{t:[0.1,0.45,0.8,1.15][k],moving:true,noShadow:false}); }); return; }
  if(demo==='how'){ await howToScreen(); return; }
  if(demo==='settings'){ mode='title'; stageActors=stageCast(); await settingsScreen(); return; }
  if(params.has('pause')) setTimeout(()=>setPause(true),1500);
  if(demo==='explore'){ P[0].human=true; P[0].gold=0; if(params.has('job')) P[0].job=JOBS[+params.get('job')]; stageActors=[]; await runExplore(P); return; }
  if(demo==='cut'){ P.forEach(p=>p.gold=8); const jb=JOBS[+(params.get('job')||0)], w=P.find(p=>p.job===jb)||P[0]; w.job=jb; w.human=true; stageActors=[]; await runCut(w); return; }
  if(demo==='book'){ P.forEach(p=>p.gold=8); P[0].human=true; await assignScreen(P[0]); return; }
  if(params.get('online')){ const r=await onlineFlow(); if(r){ await (r.host?playGameNet(r.players):clientSession()); } return; }
  if(params.get('join')){ const r=await onlineFlow(); if(r){ await (r.host?playGameNet(r.players):clientSession()); NET.leave(); } }   // 초대 링크: 끝나면 타이틀로
  while(true){ const act=await titleScreen(); if(act&&act.online){ await (act.online.host?playGameNet(act.online.players):clientSession()); NET.leave(); continue; } if(act==='sim'||(AUTO&&act!=='start')) break; await playGame(); if(AUTO) break; }
})();
