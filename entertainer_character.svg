  <!-- nose -->
  <path d="M402 228 Q408 246 398 250" fill="none" stroke="#c97c5a" stroke-width="3" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="362" cy="256" rx="15" ry="9" fill="#ff5b8d" opacity="0.6"/>
  <ellipse cx="438" cy="270" rx="8" ry="4" fill="#ff5b8d" opacity="0.4"/>
  <!-- beauty star sticker -->
  <path d="M354 268 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#ffe94d" stroke="#12062b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- grin with fang & tongue -->
  <path d="M376 274 Q400 302 428 272 Q402 284 376 274 Z" fill="#8a0f3c" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M376 274 Q402 286 428 272 L424 278 Q402 292 380 280 Z" fill="#ff2f7a"/>
  <path d="M394 288 Q402 300 412 288" fill="#ff7ab0" stroke="#12062b" stroke-width="2"/>
  <path d="M384 277 l4 8 l5 -6 z" fill="#fff" stroke="#12062b" stroke-width="1.5" stroke-linejoin="round"/>

