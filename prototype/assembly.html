<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>줄 위의 극장 · 소집 프로토타입</title>
<style>
:root{--ink:#1b1410;--paper:#eadfc3;--paper2:#d8c7a0;--blood:#9a1d2f;--brass:#c9a04e;--curtain:#62151f;--wood:#3b2717}
html,body{margin:0;height:100%;overflow:hidden;background:#140c08;color:var(--paper);font:16px/1.55 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","WenQuanYi Zen Hei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.scr.bottom{align-items:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.page{pointer-events:auto;max-width:720px;width:100%;max-height:92vh;overflow:auto;background:linear-gradient(#eadfc3,#d6c49b);color:var(--ink);border:3px solid #3b2717;border-radius:8px;box-shadow:0 0 0 2px var(--brass),0 18px 60px #000b, inset 0 0 40px #8a6a3022;padding:22px 26px}
.page h1{font:800 30px/1.2 "Noto Serif KR","Nanum Myeongjo","Batang","WenQuanYi Zen Hei",serif;margin:0 0 4px;color:#4a1018;letter-spacing:.02em}
.page h2{font:800 22px/1.3 "Noto Serif KR","Nanum Myeongjo","Batang","WenQuanYi Zen Hei",serif;margin:0 0 6px;color:#4a1018}
.page p{margin:6px 0}.dim{color:#6b5a3e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{pointer-events:auto;background:linear-gradient(#b3283b,#7d1626);color:#fbeed0;border:2px solid #3b0d14;border-radius:30px;padding:11px 22px;font:700 16px "Noto Serif KR","Nanum Myeongjo","WenQuanYi Zen Hei",serif;cursor:pointer;box-shadow:0 3px 0 #3b0d14,0 6px 14px #0006;letter-spacing:.03em}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3b0d14}
.btn.ghost{background:transparent;color:#4a1018;border-color:#6b4a22;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #a98c58;border-radius:8px;padding:8px 10px;margin:7px 0;background:#f3e9cf88;cursor:pointer}
label.opt small{display:block;color:#6b5a3e}
select{background:#fbf3dd;color:var(--ink);border:1px solid #a98c58;border-radius:6px;padding:5px 8px;font:inherit}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid #b9a273;padding:6px 8px;text-align:left}th{color:#4a1018}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #1b1410}
.sprites{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:8px 0 2px}
.sprites img{height:120px}
.vs{font:800 28px "Noto Serif KR","WenQuanYi Zen Hei",serif;color:#7d1626}
.win{color:#1d6b35;font-weight:700}.lose{color:#9a1d2f;font-weight:700}
#spells{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:none;flex-direction:column-reverse;gap:12px;pointer-events:none;z-index:5}
.sp{pointer-events:auto;position:relative;width:84px;height:84px;border-radius:50%;border:3px solid #3b2717;background:radial-gradient(#fbeed0,#cdb27a);color:#2a1408;font:800 12px/1.15 "Noto Serif KR","WenQuanYi Zen Hei",serif;text-align:center;overflow:hidden;box-shadow:0 0 0 2px var(--brass),0 6px 16px #000a;cursor:pointer;padding:0}
.sp b{display:block;font-size:11px;opacity:.7}
.sp .cdm{position:absolute;inset:0;background:#000a;transform-origin:50% 100%;transform:scaleY(0)}
.sp.lock{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.sp span{position:relative;z-index:1;display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:6px}
#load{position:fixed;inset:0;z-index:20;pointer-events:none;visibility:hidden}
#load.on{visibility:visible;pointer-events:auto}
#load .cur{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#4f0f19 0 22px,#6d1a27 22px 44px,#561220 44px 66px);box-shadow:inset 0 0 80px #000c;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
#load .cur.l{left:0;transform:translateX(-101%);border-right:6px solid var(--brass)}
#load .cur.r{right:0;transform:translateX(101%);border-left:6px solid var(--brass)}
#load.closed .cur.l,#load.closed .cur.r{transform:translateX(0)}
#load .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .25s .25s}
#load.closed .mid{opacity:1}
#load .t{font:800 22px "Noto Serif KR","WenQuanYi Zen Hei",serif;letter-spacing:.18em;color:#f6e3a6;text-shadow:0 2px 0 #000}
#load .tip{font-size:14px;color:#e5d3a8;max-width:80vw;text-align:center;min-height:42px}
#load canvas{width:min(420px,86vw);height:auto}
</style>

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="spells"></div>
<div id="load"><div class="cur l"></div><div class="cur r"></div>
  <div class="mid"><canvas id="lcv" width="420" height="150"></canvas><div class="t" id="lt">NOW LOADING</div><div class="tip" id="ltip"></div></div></div>

<script>
/* ===================== CORE:BEGIN (DOM 없음: 규칙 + 듀얼 엔진) ===================== */
const JOBS = [
  {id:'ent',  name:'엔터테이너', color:'#f6e3a6', goal:'위기를 넘기며 시청자를 쌓는다'},
  {id:'tech', name:'기술자',     color:'#9be37a', goal:'발전기를 돌려 단독 탈출한다'},
  {id:'scout',name:'수색자',     color:'#7fe3ff', goal:'방해 요소를 찾아 해제한다'},
  {id:'arch', name:'기록자',     color:'#cdb6ff', goal:'단서를 모으고 목표를 간파한다'},
];
const STRING_NAMES = ['머리','가슴','좌 어깨','우 어깨','좌 팔꿈치','우 팔꿈치','좌 손목','우 손목','좌 무릎','우 무릎','좌 발목','우 발목'];
const N = 12, VITALS = 4;
const RULES0 = {basePicks:3, winBonus:1, comeback:'extra', winnerFirst:false}; // 승리 보상 = 선택 3개 → 4개 (이게 전부)

let rand = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri = n => Math.floor(rand()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,k){return shuffle(a).slice(0,k)}
function gauss(){let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const range = n => [...Array(n).keys()];

function makePlayers(humanIdx){
  const jobs = shuffle(JOBS);
  return range(4).map(i=>({
    i, job:jobs[i], human:i===humanIdx, name:jobs[i].name,
    vit:new Set(sample(range(N),VITALS)),   // 급소 4개: 랜덤 배정, 본인에게만 보임
    cut:new Set(),                           // 끊긴 급소: 모두에게 공개
    gold:0, skill:0.25+rand()*0.55, alive:true, duelWins:0,
  }));
}
const level = p => Math.min(5, Math.floor(p.gold/2));
const alive = P => P.filter(p=>p.alive);
function picksFor(p, won, rules){
  let n = rules.basePicks + (won ? rules.winBonus : 0);               // 이긴 쪽 4개 / 진 쪽 3개
  if(rules.comeback==='extra' && p.cut.size>=2) n += 1;                // 역전 기믹 A: 관객의 동정
  else if(rules.comeback==='last' && p.cut.size>=3) n = 5;             // 역전 기믹 B: 최후의 승부수
  return n;
}
function aiPicks(p, t, count){ return sample(range(N).filter(i=>!t.cut.has(i)), count); }
function resolveAttack(att, tar, picks){
  const hits = picks.filter(i=>tar.vit.has(i) && !tar.cut.has(i));
  hits.forEach(i=>tar.cut.add(i));
  if(tar.cut.size>=VITALS) tar.alive = false;
  return hits;
}
function applyPair(a, b, w, pa, pb, rules){
  const seq = rules.winnerFirst ? (w===a ? [[a,b,pa],[b,a,pb]] : [[b,a,pb],[a,b,pa]]) : [[a,b,pa],[b,a,pb]];
  const out = [];
  seq.forEach(([att,tar,pk],idx)=>{
    if(rules.winnerFirst && idx===1 && !att.alive){ out.push({att,tar,picks:pk,hits:[],canceled:true}); return; }
    out.push({att,tar,picks:pk,hits:resolveAttack(att,tar,pk)});
  });
  return out;
}
function pairUp(P){
  const al = shuffle(alive(P)), pairs = [];
  for(let i=0;i+1<al.length;i+=2) pairs.push([al[i],al[i+1]]);
  return {pairs, bye: al.length%2 ? al[al.length-1] : null};
}
function gainGold(P){ alive(P).forEach(p=>p.gold += 1+ri(2)); }

/* ---------- 규칙 시뮬레이션용 추상 듀얼 (엔진을 돌리지 않는 근사) ---------- */
function absDuel(a,b){
  const sa = 0.5*a.skill + 0.35*level(a)/5 + 0.075*gauss(), sb = 0.5*b.skill + 0.35*level(b)/5 + 0.075*gauss();
  return sa>=sb ? a : b;
}
function botGame(rules){
  const P = makePlayers(-1); let rounds = 0; const maxCut=[0,0,0,0];
  while(alive(P).length>1 && rounds<60){
    rounds++; gainGold(P);
    pairUp(P).pairs.forEach(([a,b])=>{
      const w = absDuel(a,b); w.duelWins++; w.gold += 1;
      applyPair(a,b,w, aiPicks(a,b,picksFor(a,w===a,rules)), aiPicks(b,a,picksFor(b,w===b,rules)), rules);
    });
    P.forEach(p=>{ maxCut[p.i]=Math.max(maxCut[p.i],p.cut.size); });
  }
  const al = alive(P);
  return {rounds, winner: al.length===1 ? al[0].i : -1, duelWins:P.map(p=>p.duelWins), maxCut};
}
function runBotGames(rules, n){
  let sum=0, draws=0, leaderGames=0, leaderWins=0;
  for(let g=0; g<n; g++){
    const r = botGame(rules); sum += r.rounds; if(r.winner<0) draws++;
    const mx = Math.max(...r.duelWins), idx = r.duelWins.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
    if(idx.length===1 && r.winner>=0){ leaderGames++; if(idx[0]===r.winner) leaderWins++; }
  }
  return {games:n, avgRounds:sum/n, draws:draws/n, leaderRate:leaderWins/Math.max(1,leaderGames)};
}

/* ================== 1대1 실시간 듀얼 엔진 ================== */
const AW=720, AH=1280, DUR=45, HP0=5;
const aimAng = (a,b) => Math.atan2(b.y-a.y, b.x-a.x);
function makeDuel(A,B){
  const mk=(p,y,dir,minY,maxY)=>({p,job:p.job,x:AW/2,y,homeY:y,dir,hp:HP0,inv:0,cd:[0,0,0],shot:0.5+rand()*0.4,r:7,speed:330,minY,maxY,mx:0,my:0,tx:null,ty:null,hits:0,face:'idle',ai:null});
  return {t:0,over:false,A:mk(A,AH-230,-1,AH*0.44,AH-70),B:mk(B,250,1,70,AH*0.56),bul:[],zones:[],timers:[],banners:[],sparks:[],log:[]};
}
function after(d,sec,fn){ d.timers.push({t:sec,fn}); }
function shoot(d,m,o){
  const b={x:o.x!==undefined?o.x:m.x, y:o.y!==undefined?o.y:m.y+m.dir*18, vx:Math.cos(o.ang)*o.sp, vy:Math.sin(o.ang)*o.sp,
           r:o.r||6, col:o.col||m.job.color, owner:m, tgt:m===d.A?d.B:d.A, upd:o.upd||null, age:0, shape:o.shape||'orb', spin:o.spin||0, rot:o.ang};
  if(d.bul.length<900) d.bul.push(b); return b;
}
function setVel(b,ang,sp){ b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.rot=ang; }
const downAng = m => m.dir>0 ? Math.PI/2 : -Math.PI/2;

/* 직업별 스펠 카드 3장: 쿨타임 + 재화 레벨로 해금 */
const SPELLS = {
 ent:[
  {name:'조명 부채꼴', cd:5, lv:0, text:'조준 부채꼴 3연발', cast(d,m,f){
    for(let k=0;k<3;k++) after(d,k*0.28,()=>{ const a=aimAng(m,f); for(let i=-3;i<=3;i++) shoot(d,m,{ang:a+i*0.17,sp:270,r:7}); }); }},
  {name:'앵콜 링', cd:9, lv:2, text:'퍼졌다가 상대를 향해 꺾이는 고리', cast(d,m,f){
    const n=22; for(let i=0;i<n;i++) shoot(d,m,{ang:i/n*Math.PI*2,sp:110,r:7,upd:(b,dt)=>{ if(!b.re && b.age>0.95){ b.re=1; setVel(b,aimAng(b,f)+(rand()-0.5)*0.5,290);} }}); }},
  {name:'박수갈채', cd:14, lv:4, text:'틈이 있는 탄막 장막 3겹', cast(d,m,f){
    for(let w=0;w<3;w++) after(d,w*0.85,()=>{ const gap=ri(12); for(let i=0;i<14;i++){ if(i===gap||i===gap+1) continue; shoot(d,m,{x:30+i*(AW-60)/13,y:m.y+m.dir*40,ang:downAng(m),sp:190,r:10}); } }); }},
 ],
 tech:[
  {name:'렌치 부메랑', cd:5, lv:0, text:'큰 렌치가 날아갔다가 돌아온다', cast(d,m,f){
    const a=aimAng(m,f); [-0.38,0,0.38].forEach(o=>shoot(d,m,{ang:a+o,sp:330,r:15,shape:'wrench',upd:(b,dt)=>{
      if(b.age<1.1){ b.vx*=(1-dt*0.9); b.vy*=(1-dt*0.9); } else { const aa=Math.atan2(m.y-b.y,m.x-b.x); const sp=Math.min(340,(b.age-1.1)*320); b.vx=Math.cos(aa)*sp; b.vy=Math.sin(aa)*sp; } }, spin:9})); }},
  {name:'전기 그물', cd:9, lv:2, text:'경고선이 뜬 뒤 번개가 내리친다', cast(d,m,f){
    [-220,-110,0,110,220].forEach((o,i)=>{ const x=Math.max(40,Math.min(AW-40,f.x+o+(rand()-0.5)*40)); d.zones.push({x,w:34,owner:m,tgt:f,phase:'wait',t:-i*0.14,warn:0.85,act:0.38}); }); }},
  {name:'톱니 나선', cd:14, lv:4, text:'세 갈래 톱니가 소용돌이친다', cast(d,m,f){
    for(let i=0;i<42;i++) after(d,i*0.065,()=>{ for(let arm=0;arm<3;arm++) shoot(d,m,{ang:i*0.33+arm*2.094,sp:165,r:7,shape:'gear',spin:6}); }); }},
 ],
 scout:[
  {name:'등불 유도탄', cd:5, lv:0, text:'잠시 상대를 따라가는 등불 3개', cast(d,m,f){
    const a=aimAng(m,f); [-0.55,0,0.55].forEach(o=>shoot(d,m,{ang:a+o,sp:175,r:12,upd:(b,dt)=>{ if(b.age<2.3){ const want=aimAng(b,f); let cur=Math.atan2(b.vy,b.vx); const df=Math.atan2(Math.sin(want-cur),Math.cos(want-cur)); cur+=Math.max(-1.7*dt,Math.min(1.7*dt,df)); setVel(b,cur,175);} }})); }},
  {name:'파문', cd:9, lv:2, text:'틈이 있는 물결 고리 3겹', cast(d,m,f){
    for(let k=0;k<3;k++) after(d,k*0.5,()=>{ const n=30, g0=ri(n); for(let i=0;i<n;i++){ const dd=(i-g0+n)%n; if(dd<3) continue; shoot(d,m,{ang:i/n*Math.PI*2,sp:140,r:7}); } }); }},
  {name:'그림자 사냥', cd:14, lv:4, text:'가장자리 표식에서 정조준 사격', cast(d,m,f){
    for(let k=0;k<7;k++){ const side=rand()<0.5?30:AW-30, y=f.y+(rand()-0.5)*500; d.zones.push({type:'mark',x:side,y:Math.max(40,Math.min(AH-40,y)),owner:m,tgt:f,phase:'wait',t:-k*0.22,warn:0.7,act:0.01,fire:true}); } }},
 ],
 arch:[
  {name:'쪽지 날리기', cd:5, lv:0, text:'물결치며 날아오는 쪽지', cast(d,m,f){
    for(let i=0;i<11;i++) after(d,i*0.12,()=>{ const a=aimAng(m,f)+(i%2?0.3:-0.3); const sgn=i%2?1:-1; shoot(d,m,{ang:a,sp:185,r:8,shape:'paper',upd:(b,dt)=>{ const perp=a+Math.PI/2; b.x+=Math.cos(perp)*Math.sin(b.age*6)*85*dt*sgn; b.y+=Math.sin(perp)*Math.sin(b.age*6)*85*dt*sgn; }}); }); }},
  {name:'잉크 번짐', cd:9, lv:2, text:'터지면서 갈라지는 큰 잉크', cast(d,m,f){
    const a=aimAng(m,f); [-0.45,0,0.45].forEach(o=>shoot(d,m,{ang:a+o,sp:115,r:17,upd:(b,dt)=>{ if(!b.sp && b.age>1.35){ b.sp=1; b.dead=1; for(let i=0;i<12;i++) shoot(d,m,{x:b.x,y:b.y,ang:i/12*Math.PI*2+rand()*0.3,sp:150,r:6}); } }})); }},
  {name:'낙서 폭풍', cd:14, lv:4, text:'표식이 뜬 자리에 낙서 탄이 쏟아진다', cast(d,m,f){
    for(let i=0;i<32;i++){ const x=Math.max(40,Math.min(AW-40,f.x+(rand()-0.5)*620)), y=Math.max(60,Math.min(AH-60,f.y+(rand()-0.5)*520));
      d.zones.push({type:'mark',x,y,owner:m,tgt:f,phase:'wait',t:-rand()*1.3,warn:0.7,act:0.01,drop:true}); } }},
 ],
};
function unlocked(m,i){ return level(m.p) >= SPELLS[m.job.id][i].lv; }
function canCast(d,m,i){ return !d.over && unlocked(m,i) && m.cd[i]<=0; }
function castSpell(d,m,i){
  if(!canCast(d,m,i)) return false;
  const sp = SPELLS[m.job.id][i], f = m===d.A ? d.B : d.A;
  m.cd[i] = sp.cd; sp.cast(d,m,f);
  d.banners.push({text:sp.name,col:m.job.color,t:0,side:m===d.A?'A':'B'}); d.log.push([d.t.toFixed(1),m.job.name,sp.name]);
  return true;
}

function stepDuel(d,dt){
  if(d.over) return; d.t+=dt;
  for(const m of [d.A,d.B]){
    const f = m===d.A?d.B:d.A;
    m.inv=Math.max(0,m.inv-dt); for(let i=0;i<3;i++) m.cd[i]=Math.max(0,m.cd[i]-dt);
    let vx=m.mx, vy=m.my;
    if(m.tx!==null){ const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy); if(dist>2){ const sp=Math.min(dist/dt, m.speed*1.15); m.x+=dx/dist*sp*dt; m.y+=dy/dist*sp*dt; } vx=vy=0; }
    const mag=Math.hypot(vx,vy); if(mag>0){ m.x+=vx/Math.max(1,mag)*m.speed*dt; m.y+=vy/Math.max(1,mag)*m.speed*dt; }
    m.x=Math.max(32,Math.min(AW-32,m.x)); m.y=Math.max(m.minY,Math.min(m.maxY,m.y));
    m.shot-=dt; if(m.shot<=0){ m.shot=0.7; const a0=aimAng(m,f); for(const o of [-0.16,0,0.16]) shoot(d,m,{ang:a0+o,sp:330,r:5}); }
  }
  for(let i=d.timers.length-1;i>=0;i--){ const tm=d.timers[i]; tm.t-=dt; if(tm.t<=0){ d.timers.splice(i,1); tm.fn(); } }
  for(let i=d.bul.length-1;i>=0;i--){
    const b=d.bul[i]; if(!b) continue; b.age+=dt; if(b.upd) b.upd(b,dt);
    b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.spin) b.rot+=b.spin*dt;
    const t=b.tgt; let remove=!!b.dead;
    if(!remove && t.inv<=0 && Math.hypot(b.x-t.x,b.y-t.y)<b.r+t.r){ t.hp--; t.hits++; t.inv=1.2; t.face='hurt'; d.sparks.push({x:t.x,y:t.y,t:0,col:b.col}); remove=true; }

  }
  for(let i=d.zones.length-1;i>=0;i--){
    const z=d.zones[i]; z.t+=dt;

      if(z.fire){ const a=Math.atan2(z.tgt.y-z.y,z.tgt.x-z.x); shoot(d,z.owner,{x:z.x,y:z.y,ang:a,sp:400,r:8}); }

  }
  for(let i=d.sparks.length-1;i>=0;i--){ d.sparks[i].t+=dt; if(d.sparks[i].t>0.5) d.sparks.splice(i,1); }

function duelResult(d){

  return {winner:w.p, hitsA:HP0-a.hp, hitsB:HP0-b.hp, hpA:a.hp, hpB:b.hp, t:d.t};
}

/* 봇 조종: 탄 예측 회피 + 쿨타임 스펠 사용 */
function aiControl(d,me,foe,skill,dt){
  const ai = me.ai || (me.ai={next:0,mx:0,my:0,castWait:0.8+rand()});
  ai.next-=dt;
  if(ai.next<=0){
    ai.next = 0.11 + (1-skill)*0.24;
    let best=[0,0], bs=1e9;
    const cand=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[.7,-.7],[-.7,.7],[-.7,-.7]];
    for(const c of cand){
      let score=0;
      for(const tt of [0.18,0.4]){
        const px=me.x+c[0]*me.speed*tt, py=me.y+c[1]*me.speed*tt, wgt = tt<0.3?3:1.6;
        for(const b of d.bul){ if(b.owner===me) continue;
          const dist=Math.hypot(b.x+b.vx*tt-px, b.y+b.vy*tt-py)-b.r-me.r;
          if(dist<46) score+=(46-Math.max(dist,0))*wgt+(dist<0?500*wgt:0); }
        for(const z of d.zones){ if(z.owner===me || z.type) continue;
          if(z.phase==='warn'||z.phase==='act'){ const dx=Math.abs(px-z.x)-z.w/2-me.r; if(dx<40) score+=(40-Math.max(dx,0))*(z.phase==='act'?4:1.6)+(dx<0&&z.phase==='act'?800:0); } }
      }
      const ex=me.x+c[0]*me.speed*0.45, ey=me.y+c[1]*me.speed*0.45;
      if(ex<60||ex>AW-60||ey<me.minY+10||ey>me.maxY-10) score+=140;
      score += Math.abs(ey-me.homeY)*0.035 + Math.abs(ex-foe.x)*0.012 + (c[0]===0&&c[1]===0?3:0) + rand()*2;
      if(score<bs){ bs=score; best=c; }
    }
    if(rand()<0.05+(1-skill)*0.22) best=cand[ri(cand.length)];
    ai.mx=best[0]; ai.my=best[1];
  }
  me.mx=ai.mx; me.my=ai.my; me.tx=null;
  ai.castWait-=dt;
  if(ai.castWait<=0){
    const ready=[0,1,2].filter(i=>canCast(d,me,i));
    if(ready.length){ castSpell(d,me,ready[ri(ready.length)]); ai.castWait=0.35+rand()*(1.6-skill); } else ai.castWait=0.2;
  }
}
function runDuelHeadless(A,B,skillA,skillB){
  const d=makeDuel(A,B); const dt=1/30;
  while(!d.over){ aiControl(d,d.A,d.B,skillA,dt); aiControl(d,d.B,d.A,skillB,dt); stepDuel(d,dt); }
  return duelResult(d);
}

const ANCHORS=[[0,-84],[0,-30],[-13,-36],[13,-36],[-20,-26],[20,-26],[-22,-16],[22,-16],[-7,-8],[7,-8],[-8,-1],[8,-1]];
function puppetLayout(cx,h,scale){ const feet=h*0.88; return {s:scale,fx:cx,fy:feet,pts:ANCHORS.map(([x,y])=>[cx+x*scale,feet+y*scale]),barY:h*0.1}; }
function drawStrings(c,L,state,t){
  const barX0=L.fx-L.s*50, barX1=L.fx+L.s*50;
  c.strokeStyle='#6b4a22'; c.lineWidth=8; c.lineCap='round'; c.beginPath(); c.moveTo(barX0,L.barY); c.lineTo(barX1,L.barY); c.stroke();
  c.strokeStyle='#c9a04e'; c.lineWidth=3; c.stroke();
  L.pts.forEach(([x,y],i)=>{
    const bx = barX0+(barX1-barX0)*(i+0.5)/12; const cut=state.cut&&state.cut.has(i), sel=state.sel&&state.sel.has(i), fl=state.flash&&state.flash.get(i);
    c.beginPath();
    if(cut){ c.moveTo(bx,L.barY); c.lineTo(bx+(x-bx)*0.35,L.barY+(y-L.barY)*0.35); c.moveTo(x,y); c.lineTo(x+(bx-x)*0.1,y-14); c.strokeStyle='rgba(255,90,90,.9)'; c.lineWidth=2.4; c.stroke(); }
    else { const wob = fl==='miss'? Math.sin(t*50)*5*Math.max(0,1-state.flashT*1.5):0; c.moveTo(bx,L.barY); c.quadraticCurveTo((bx+x)/2+wob,(L.barY+y)/2,x,y); c.strokeStyle= sel?'#ffe9a0':fl==='hit'?'#ff6a6a':'rgba(240,226,190,.62)'; c.lineWidth= sel||fl?3.4:1.8; c.stroke(); }
  });
}
function drawAnchors(c,L,state,t){
  L.pts.forEach(([x,y],i)=>{
    const cut=state.cut&&state.cut.has(i), sel=state.sel&&state.sel.has(i), mine=state.mine&&state.mine.has(i)&&!cut, fl=state.flash&&state.flash.get(i);
    const r=Math.max(13,L.s*3.4);
    c.beginPath(); c.arc(x,y,r,0,7);
    c.fillStyle= cut?'#5a1218': sel?'#e8c76a': fl==='hit'?'#c92b3b': fl==='miss'?'#334':'#241711'; c.fill();
    c.lineWidth=3; c.strokeStyle= cut?'#ff5a5a': sel?'#fff4c6': mine?'#ff9a9a':'#c9a04e'; if(mine&&!sel) c.setLineDash([4,3]); c.stroke(); c.setLineDash([]);
    c.fillStyle= sel?'#2a1408':cut?'#ff9a9a':'#f6e3a6'; c.font=`800 ${Math.round(r*0.95)}px "Noto Serif KR",serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(cut?'✕':String(i+1),x,y+1);
    if(fl==='hit'){ c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=3; c.beginPath(); c.arc(x,y,r+8+(state.flashT||0)*30,0,7); c.stroke(); }
  });
}
let pickScene=null, revScene=null;
function drawPick(c,t){
  drawStage(c,W,H,t);
  const sc=pickScene, s=Math.min(H*0.52/92, W*0.62/60);
  const L=sc.L=puppetLayout(W/2,H,s);
  drawStrings(c,L,{cut:sc.target.cut,sel:sc.sel,flashT:0},t);
  drawSD(c,L.fx,L.fy,L.s,sc.target.job,{t,face:'idle'});
  drawAnchors(c,L,{cut:sc.target.cut,sel:sc.sel},t);
  const bw=Math.min(W-24,420);
  c.textAlign='center'; c.fillStyle='rgba(20,8,6,.78)'; rr(c,W/2-bw/2,16,bw,52,14); c.fill();
  c.font='800 17px "Noto Serif KR","WenQuanYi Zen Hei",serif'; c.fillStyle='#f6e3a6'; c.fillText(`${sc.target.name}의 실 — ${sc.n}개를 고르세요 (${sc.sel.size}/${sc.n})`,W/2,34);
  if(opts.timer){ c.fillStyle='#3a2616'; c.fillRect(W/2-bw/2+16,52,bw-32,6); c.fillStyle='#e8c76a'; c.fillRect(W/2-bw/2+16,52,(bw-32)*Math.max(0,sc.left/15),6); }
}
function drawReveal(c,t){
  drawStage(c,W,H,t);
  const sc=revScene, s=Math.min(H*0.42/92,W*0.3/60);
  const L1=puppetLayout(W*0.27,H,s), L2=puppetLayout(W*0.73,H,s);
  const doBoard=(L,target,evs,mine)=>{
    const st={cut:new Set(target.snapCut),flash:new Map(),flashT:0,mine};
    evs.forEach(e=>{ if(sc.t>=e.at){ if(sc.t<e.at+0.5){ st.flash.set(e.i,e.hit?'hit':'miss'); st.flashT=sc.t-e.at; } if(e.hit && sc.t>=e.at+0.35) st.cut.add(e.i); } });
    drawStrings(c,L,st,t); drawSD(c,L.fx,L.fy,L.s,target.job,{t,face:evs.some(e=>e.hit&&sc.t>=e.at)?'hurt':'idle'}); drawAnchors(c,L,st,t);
  };
  doBoard(L1,sc.me,sc.evFoe,sc.me.vit);
  doBoard(L2,sc.foe,sc.evMe,null);
  c.textAlign='center'; c.textBaseline='middle'; c.font='800 18px "Noto Serif KR","WenQuanYi Zen Hei",serif'; c.fillStyle='#f6e3a6';
  const ly=Math.max(20,H*0.1-26); c.fillText('나의 인형 — 상대의 공격',W*0.27,ly); c.fillText('상대의 인형 — 나의 공격',W*0.73,ly);
}

      <label class="opt"><input type="checkbox" id="o-tm" ${opts.timer?'checked':''}><div>실 선택 15초 제한<small>끄면 천천히 고를 수 있습니다.</small></div></label>
      <label class="opt"><input type="checkbox" id="o-du" ${opts.duelMode==='auto'?'checked':''}><div>듀얼 자동 진행<small>직접 조작하지 않고 봇이 대신 싸웁니다.</small></div></label>`);
    const act = await waitButtons([{label:'공연 시작',value:'start'},{label:'봇 800판 시뮬레이션',value:'sim',ghost:true},{label:'전체 화면',value:'fs',ghost:true}],'title');
    rules.comeback=$('#o-cb').value; rules.winnerFirst=$('#o-wf').checked; opts.timer=$('#o-tm').checked; opts.duelMode=$('#o-du').checked?'auto':'play';
    if(act==='fs'){ try{ await document.documentElement.requestFullscreen(); }catch(e){} continue; }
    if(act==='sim'){ setScreen(simReport()); await waitButtons([{label:'돌아가기',value:1}],'sim'); if(AUTO) return 'sim'; continue; }
    return 'start';
  }
}
function spellListHTML(job){
  return `<table><tr><th>스펠 카드</th><th>쿨타임</th><th>해금</th><th>효과</th></tr>${SPELLS[job.id].map(s=>`<tr><td><b>${s.name}</b></td><td>${s.cd}초</td><td>재화 Lv ${s.lv}</td><td>${s.text}</td></tr>`).join('')}</table>`;
}
async function assignScreen(){
  const me=P.find(p=>p.human); stageActors=[me.job];
  setScreen(`<h2>당신의 배역</h2><div class="sprites"><img alt="" src="${spriteURL(me.job,2.2)}"></div>
    <p style="text-align:center"><span class="chip" style="font-size:22px"><i style="background:${me.job.color}"></i>${me.name}</span></p>
    <p style="text-align:center" class="dim">${me.job.goal}</p>
    <p class="dim">당신의 급소(숨겨진 실): <b style="color:#9a1d2f">${[...me.vit].sort((a,b)=>a-b).map(i=>`${i+1}번 ${STRING_NAMES[i]}`).join(', ')}</b></p>${spellListHTML(me.job)}
    <p class="dim">조작: 화면을 드래그하면 캐릭터가 따라 움직입니다(키보드는 WASD/방향키). 오른쪽 스펠 버튼(또는 1·2·3키)으로 카드를 씁니다. 작은 하얀 점이 피격 판정입니다.</p>`);
  if(STOP==='assign') await new Promise(()=>{});
  await waitButtons([{label:'무대로',value:1}],'assign_');
}
function spritesRow(pairs,bye){
  return pairs.map(([a,b])=>`<div class="sprites"><img alt="" src="${spriteURL(a.job,1.5)}"><span class="vs">VS</span><img alt="" src="${spriteURL(b.job,1.5)}" style="transform:scaleX(-1)"></div><p style="text-align:center">${nameOf(a)} &nbsp;대&nbsp; ${nameOf(b)}</p>`).join('')+(bye?`<p style="text-align:center">${nameOf(bye)} — 이번 소집은 쉽니다</p>`:'');
}
function startDuelScene(A,B){
  return new Promise(res=>{
    const d=makeDuel(A,B);
    duelScene={d,count:(AUTO&&STOP==='duel')?9999:3,humanCtl:!AUTO,skillA:A.skill,skillB:B.skill,done:res,endT:0,res:null,humanIn:A.human||B.human};
    clearScreen(); mode='duel'; if(duelScene.humanCtl) showSpellButtons(d.A); else hideSpellButtons();
  });
}
function updatePickBtn(){ const b=document.getElementById('pk'); if(b&&pickScene){ b.disabled = pickScene.sel.size!==pickScene.n; b.textContent=`확정 (${pickScene.sel.size}/${pickScene.n})`; } }
function runPick(me,target,n){
  return new Promise(res=>{
    pickScene={me,target,n,sel:new Set(),left:15,L:null,finish:null};
    ui.innerHTML=`<div class="scr bottom"><div style="pointer-events:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center"><div style="background:#140c08cc;border:2px solid #c9a04e;border-radius:12px;padding:8px 12px;font-size:13px;color:#f6e3a6">내 급소: ${[...me.vit].sort((a,b)=>a-b).map(i=>i+1+(me.cut.has(i)?'(끊김)':'')).join(', ')}</div><button class="btn" id="pk" disabled>확정</button></div></div>`;
    const finish=()=>{ const sel=pickScene.sel; while(sel.size<n){ const free=range(N).filter(i=>!target.cut.has(i)&&!sel.has(i)); sel.add(free[ri(free.length)]); } pickScene.finish=null; const out=[...sel]; pickScene=null; res(out); };
    pickScene.finish=finish; document.getElementById('pk').onclick=finish; updatePickBtn(); mode='pick';
    if(AUTO && STOP!=='pick') setTimeout(finish,0);
  });
}
function runReveal(me,foe,myPicks,foePicks,myHits,foeHits,snap,foeCanceled){
  return new Promise(res=>{
    const evMe=myPicks.map((i,k)=>({i,at:0.6+k*0.7,hit:myHits.includes(i)}));
    const evFoe=foeCanceled?[]:foePicks.map((i,k)=>({i,at:0.6+k*0.7,hit:foeHits.includes(i)}));
    const total=Math.max(evMe.length,evFoe.length)*0.7+1.6;
    revScene={t:0,total,me:{job:me.job,vit:me.vit,snapCut:snap[me.i]},foe:{job:foe.job,snapCut:snap[foe.i]},evMe,evFoe,done:null};
    ui.innerHTML=''; mode='reveal';
    if(AUTO && STOP==='reveal') return;
    revScene.done=()=>{ ui.innerHTML=`<div class="scr bottom"><div class="page" style="max-width:560px"><p>내 공격: ${myHits.length?`<span class="win">급소 ${myHits.length}개 끊음 (${myHits.map(i=>i+1).join(', ')})</span>`:'빗나감'}</p><p>상대 공격: ${foeCanceled?'<span class="dim">쓰러져서 취소됨</span>':(foeHits.length?`<span class="lose">내 급소 ${foeHits.length}개 끊김 (${foeHits.map(i=>i+1).join(', ')})</span>`:'빗나감')}</p></div></div>`; waitButtons([{label:'다음 소집으로',value:1}],'reveal_').then(res); };
    if(AUTO) { revScene.t=revScene.total; }
  });
}

async function playGame(){
  P=makePlayers(ri(4)); round=0; const me=P.find(p=>p.human);
  await transition(()=>{},{text:'배역 배정',tip:'막이 오릅니다…',job:me.job});
  await assignScreen();
  while(alive(P).length>1 && round<40){
    round++; gainGold(P);
    const {pairs,bye}=pairUp(P), human=P.find(p=>p.human);
    await transition(()=>{ mode='title'; stageActors=alive(P).map(p=>p.job); setScreen(`<h2>소집 ${round}</h2><p class="dim">탐색 라운드는 생략되었습니다. 모두 재화를 얻었습니다 (내 재화 Lv ${level(human)}).</p>${spritesRow(pairs,bye)}`); },{text:`소집 ${round}`,job:human.job});
    if(STOP==='brief') await new Promise(()=>{});
    await waitButtons([{label:human.alive?'듀얼 시작':'관전 중… 계속',value:1}],'brief_');
    const plan=[];
    for(const [a,b] of pairs){
      let r;
      if((a.human||b.human) && human.alive){
        const A=a.human?a:b, B=a.human?b:a; let rs;
        if((opts.duelMode==='play' && !AUTO) || (AUTO&&STOP==='duel')){
          await transition(()=>{},{text:'입장',tip:`${B.name}과(와)의 1대1. 사용 가능: ${SPELLS[A.job.id].filter(s=>level(A)>=s.lv).map(s=>s.name).join(' · ')}`,job:A.job});
          rs=await startDuelScene(A,B); duelScene=null; hideSpellButtons(); mode='title';
        } else rs=runDuelHeadless(A,B,0.6,B.skill);
        r={winner:rs.winner,hitsA:a===A?rs.hitsA:rs.hitsB,hitsB:a===A?rs.hitsB:rs.hitsA};
      } else { const rs=runDuelHeadless(a,b,a.skill,b.skill); r={winner:rs.winner,hitsA:rs.hitsA,hitsB:rs.hitsB}; }
      const w=r.winner,l=w===a?b:a; w.duelWins++; w.gold+=1; plan.push({a,b,w,l,r});
    }
    const mine=plan.find(x=>x.a.human||x.b.human);
    mode='title'; stageActors=alive(P).map(p=>p.job);
    const rows=plan.map(x=>`<tr><td>${nameOf(x.a)} vs ${nameOf(x.b)}</td><td>${nameOf(x.w)}</td><td>${x.r.hitsA} : ${x.r.hitsB}</td></tr>`).join('');
    let msg=''; if(mine && human.alive){ msg = mine.w===human ? `<p class="win">승리 — 이번 공격에서 실을 ${picksFor(human,true,rules)}개 고를 수 있습니다.</p>` : `<p class="lose">패배 — 이번 공격의 선택은 ${picksFor(human,false,rules)}개입니다.</p>`; }
    await transition(()=>{ setScreen(`<h2>듀얼 결과</h2><table><tr><th>대결</th><th>승자</th><th>피격</th></tr>${rows}</table>${msg}`); },{text:'결과',job:human.job});
    if(STOP==='result') await new Promise(()=>{});
    await waitButtons([{label:'실 선택으로',value:1}],'result_');
    const attacks=[];
    for(const x of plan) for(const [att,tar] of [[x.a,x.b],[x.b,x.a]]){
      const n=picksFor(att,x.w===att,rules); let picks;
      if(att.human && att.alive){ await transition(()=>{},{text:'실 선택',tip:`${tar.name}의 12개 실 중 ${n}개를 고르세요.`,job:att.job}); picks=await runPick(att,tar,n); }
      else picks=aiPicks(att,tar,n);
      attacks.push({att,tar,picks,n});
    }
    const snap={}; P.forEach(p=>snap[p.i]=new Set(p.cut));
    const results=[];
    for(const x of plan){ const A=attacks.find(q=>q.att===x.a), B=attacks.find(q=>q.att===x.b);
      results.push(...applyPair(x.a,x.b,x.w,A.picks,B.picks,rules).map(r=>({...r,n:(r.att===x.a?A:B).n}))); }
    const myA=results.find(r=>r.att.human);
    if(myA && human.alive){ const foeA=results.find(r=>r.att===myA.tar&&r.tar===myA.att);
      await transition(()=>{},{text:'공개',tip:'실이 팽팽해집니다…',job:human.job});
      await runReveal(human,myA.tar,myA.picks,foeA.picks,myA.hits,foeA.hits,snap,foeA.canceled); }
    mode='title';
  }
  const al=alive(P), win=al.length===1?al[0]:null;
  window.__result={rounds:round,winner:win?win.i:-1,humanWon:win?win.human:false};
  document.title='결과: '+JSON.stringify(window.__result);
  stageActors=win?[win.job]:[];
  await transition(()=>{ mode='title'; setScreen(`<h2>${win?`${win.name} 승리`:'무승부 — 동시 탈락'}</h2><p>${round}번의 소집 끝에 막이 내립니다.</p>${win&&win.human?'<p class="win">당신이 마지막까지 살아남았습니다.</p>':''}`); },{text:'막이 내립니다',job:me.job});
  if(STOP==='end') await new Promise(()=>{});
  return waitButtons([{label:'다시 하기',value:'again'}],'end_');
}
(async function main(){
  P=makePlayers(0); frame();
  const demo=params.get('demo');   // 디버그: ?demo=load / ?demo=duel
  if(demo==='load'){ transition(()=>new Promise(()=>{}),{text:'NOW LOADING',tip:TIPS[0],job:JOBS[2]}); return; }
  if(demo==='duel'){ P.forEach(p=>p.gold=8); P[0].job=JOBS[0]; P[1].job=JOBS[1]; stageActors=[]; startDuelScene(P[0],P[1]); duelScene.count=0; duelScene.humanCtl=false; showSpellButtons(duelScene.d.A); return; }
  while(true){ const act=await titleScreen(); if(act==='sim'||(AUTO&&act!=='start')) break; await playGame(); if(AUTO) break; }
})();
</script>
