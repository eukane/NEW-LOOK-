<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.6" stop-color="#4b1a7a"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dffdc"/>
      <stop offset="0.6" stop-color="#1fd1c4"/>
      <stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="0.5" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#ff2f7a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2af0d8"/>
      <stop offset="1" stop-color="#0c8fa8"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1fd6"/>
      <stop offset="0.5" stop-color="#9a5cff"/>
      <stop offset="1" stop-color="#4a17b0"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a9f0ff"/>
      <stop offset="0.7" stop-color="#d9b3ff"/>
      <stop offset="1" stop-color="#ff9ad0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d3aa"/><stop offset="1" stop-color="#8a6238"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe94d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a1a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="none" stroke="#6a3fa8" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="grill" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0 L6 6 M6 0 L0 6" stroke="#2a1745" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- ===== backdrop: LED stage ===== -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#ff7ad9" stroke-width="2">
    <path d="M0 640 H800 M0 700 H800 M0 780 H800 M0 880 H800"/>
    <path d="M400 600 L-100 1000 M400 600 L100 1000 M400 600 L300 1000 M400 600 L500 1000 M400 600 L700 1000 M400 600 L900 1000"/>
  </g>
  <!-- colored beams -->
  <polygon points="80,0 170,0 420,620 260,620" fill="#2af0d8" opacity="0.14"/>
  <polygon points="720,0 630,0 380,620 540,620" fill="#ffe94d" opacity="0.14"/>
  <ellipse cx="400" cy="905" rx="300" ry="46" fill="url(#floorGlow)"/>
  <ellipse cx="400" cy="900" rx="130" ry="18" fill="#12062b" opacity="0.7"/>

  <!-- ring light behind head -->
  <circle cx="400" cy="215" r="150" fill="none" stroke="#fff6c9" stroke-width="22" opacity="0.8" filter="url(#glow)"/>
  <circle cx="400" cy="215" r="150" fill="none" stroke="#fffbe6" stroke-width="9"/>
  <circle cx="400" cy="215" r="150" fill="none" stroke="#ffe94d" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- ===== ponytails ===== -->
  <path d="M350 170 C250 150 150 220 160 330 C168 400 210 440 190 500 C260 470 270 400 250 340 C300 330 340 270 350 220 Z" fill="url(#hair)" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M250 340 C230 300 210 270 190 250" fill="none" stroke="#e9fffa" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M452 160 C560 120 680 170 700 260 C715 330 670 370 690 430 C620 410 600 340 620 290 C560 290 480 250 452 215 Z" fill="url(#hair)" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M620 290 C630 250 650 225 670 210" fill="none" stroke="#e9fffa" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- hair ties -->
  <circle cx="352" cy="185" r="11" fill="#ffe94d" stroke="#12062b" stroke-width="2.5"/>
  <circle cx="450" cy="178" r="11" fill="#ffe94d" stroke="#12062b" stroke-width="2.5"/>

  <!-- ===== legs ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left leg skin -->
    <path d="M378 560 L368 700" stroke="#12062b" stroke-width="38"/>
    <path d="M378 560 L368 700" stroke="#f7c6a3" stroke-width="32"/>
    <!-- right leg skin (hip pop) -->
    <path d="M424 560 L470 675" stroke="#12062b" stroke-width="38"/>
    <path d="M424 560 L470 675" stroke="#f7c6a3" stroke-width="32"/>
    <!-- boots -->
    <path d="M368 690 L362 862" stroke="#12062b" stroke-width="46"/>
    <path d="M368 690 L362 862" stroke="url(#boot)" stroke-width="40"/>
    <path d="M470 668 L452 848" stroke="#12062b" stroke-width="46"/>
    <path d="M470 668 L452 848" stroke="url(#boot)" stroke-width="40"/>
  </g>
  <!-- wooden knee joints (puppet nod) -->
  <circle cx="368" cy="706" r="11" fill="url(#wood)" stroke="#12062b" stroke-width="2.5"/>
  <circle cx="471" cy="672" r="11" fill="url(#wood)" stroke="#12062b" stroke-width="2.5"/>
  <!-- boot cuffs, soles -->
  <rect x="338" y="690" width="60" height="14" rx="6" fill="#ffe94d" stroke="#12062b" stroke-width="2.5"/>
  <rect x="440" y="662" width="60" height="14" rx="6" fill="#ffe94d" stroke="#12062b" stroke-width="2.5" transform="rotate(-8 470 669)"/>
  <rect x="326" y="856" width="74" height="28" rx="12" fill="#b6ff3b" stroke="#12062b" stroke-width="3"/>
  <rect x="418" y="842" width="74" height="28" rx="12" fill="#b6ff3b" stroke="#12062b" stroke-width="3" transform="rotate(-6 455 856)"/>
  <g stroke="#12062b" stroke-width="2" opacity="0.5"><path d="M340 870 H386 M432 856 H478"/></g>

  <!-- ===== skirt ===== -->
  <path d="M348 470 L452 470 L498 570 L470 585 L445 568 L420 592 L400 570 L380 592 L355 568 L330 585 L302 570 Z" fill="#7a3cff" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M354 470 L446 470 L478 548 L455 560 L430 545 L412 566 L400 548 L388 566 L370 545 L345 560 L322 548 Z" fill="#b6ff3b" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#12062b" stroke-width="2" opacity="0.4"><path d="M370 478 L350 540 M400 478 V545 M430 478 L452 540"/></g>

  <!-- ===== torso (bodysuit) ===== -->
  <path d="M352 330 Q400 346 448 330 L444 478 Q400 492 356 478 Z" fill="url(#suit)" stroke="#12062b" stroke-width="3"/>
