  <g fill="#ffe94d">
    <circle cx="340" cy="372" r="3"/><circle cx="347" cy="388" r="3"/><circle cx="352" cy="404" r="3"/><circle cx="356" cy="420" r="3"/><circle cx="362" cy="436" r="3"/>
    <circle cx="460" cy="372" r="3"/><circle cx="453" cy="388" r="3"/><circle cx="448" cy="404" r="3"/><circle cx="444" cy="420" r="3"/><circle cx="438" cy="436" r="3"/>
