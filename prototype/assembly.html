.jobs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.jobs .chip{border:1px solid #3d2e1a;padding:3px 9px;font-size:12px;background:#0006}

.vc.cut{border-color:#4a3a20;background:#14100c;color:#6a5a3e;text-decoration:line-through}

.card2 .s{font-size:12px;color:#a89a78;min-height:2.6em}
.body{display:block;height:min(26vh,200px);width:auto;flex:none}

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="spells"></div>
<button id="actbtn" disabled>수색</button>
<button id="lightbtn">얼굴 빛<br>OFF</button>
<button id="lurebtn">미끼<br>×2</button>
<button id="mute" title="소리 (M)">♪</button>
<div id="load"><div class="cur l"></div><div class="cur r"></div>
  <div class="mid"><canvas id="lcv" width="420" height="170"></canvas><div class="t" id="lt">NOW LOADING</div><div class="tip" id="ltip"></div></div></div>

<script>
/* ===================== CORE:BEGIN (DOM 없음: 규칙 + 듀얼 엔진) ===================== */
const JOBS = [
  {id:'ent',  name:'엔터테이너', color:'#f6e3a6', goal:'위기를 넘기며 시청자를 쌓는다'},
  {id:'tech', name:'기술자',     color:'#9be37a', goal:'발전기를 돌려 단독 탈출한다'},
  {id:'scout',name:'수색자',     color:'#7fe3ff', goal:'방해 요소를 찾아 해제한다'},
  {id:'arch', name:'기록자',     color:'#cdb6ff', goal:'단서를 모으고 목표를 간파한다'},
];
const STRING_NAMES = ['머리','가슴','좌 어깨','우 어깨','좌 팔꿈치','우 팔꿈치','좌 손목','우 손목','좌 무릎','우 무릎','좌 발목','우 발목'];
const N = 12, VITALS = 4;
const RULES0 = {basePicks:3, winBonus:1, comeback:'extra', winnerFirst:false}; // 승리 보상 = 선택 3개 → 4개 (이게 전부)

let rand = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri = n => Math.floor(rand()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,k){return shuffle(a).slice(0,k)}
function gauss(){let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const range = n => [...Array(n).keys()];

function makePlayers(humanIdx){
  const jobs = shuffle(JOBS);
  return range(4).map(i=>({
    i, job:jobs[i], human:i===humanIdx, name:jobs[i].name,
    vit:new Set(sample(range(N),VITALS)),   // 급소 4개: 랜덤 배정, 본인에게만 보임
    cut:new Set(),                           // 끊긴 급소: 모두에게 공개
    gold:0, skill:0.25+rand()*0.55, alive:true, duelWins:0,
  }));
}
const level = p => Math.min(5, Math.floor(p.gold/2));
const alive = P => P.filter(p=>p.alive);
function picksFor(p, won, rules){
  let n = rules.basePicks + (won ? rules.winBonus : 0);               // 이긴 쪽 4개 / 진 쪽 3개
  if(rules.comeback==='extra' && p.cut.size>=2) n += 1;                // 역전 기믹 A: 관객의 동정
  else if(rules.comeback==='last' && p.cut.size>=3) n = 5;             // 역전 기믹 B: 최후의 승부수
  return n;
}
function aiPicks(p, t, count){ return sample(range(N).filter(i=>!t.cut.has(i)), count); }
function resolveAttack(att, tar, picks){
  const hits = picks.filter(i=>tar.vit.has(i) && !tar.cut.has(i));
  hits.forEach(i=>tar.cut.add(i));
  if(tar.cut.size>=VITALS) tar.alive = false;
  return hits;
}
function applyPair(a, b, w, pa, pb, rules){
  const seq = rules.winnerFirst ? (w===a ? [[a,b,pa],[b,a,pb]] : [[b,a,pb],[a,b,pa]]) : [[a,b,pa],[b,a,pb]];
  const out = [];
  seq.forEach(([att,tar,pk],idx)=>{
    if(rules.winnerFirst && idx===1 && !att.alive){ out.push({att,tar,picks:pk,hits:[],canceled:true}); return; }
    out.push({att,tar,picks:pk,hits:resolveAttack(att,tar,pk)});
  });
  return out;
}
function pairUp(P){
  const al = shuffle(alive(P)), pairs = [];
  for(let i=0;i+1<al.length;i+=2) pairs.push([al[i],al[i+1]]);
  return {pairs, bye: al.length%2 ? al[al.length-1] : null};
}
function gainGold(P){ alive(P).forEach(p=>p.gold += 1+ri(2)); }

/* ---------- 규칙 시뮬레이션용 추상 듀얼 (엔진을 돌리지 않는 근사) ---------- */
function absDuel(a,b){
  const sa = 0.5*a.skill + 0.35*level(a)/5 + 0.075*gauss(), sb = 0.5*b.skill + 0.35*level(b)/5 + 0.075*gauss();
  return sa>=sb ? a : b;
}
function botGame(rules){
  const P = makePlayers(-1); let rounds = 0;
  while(alive(P).length>1 && rounds<60){
    rounds++; gainGold(P);
    pairUp(P).pairs.forEach(([a,b])=>{
      const w = absDuel(a,b); w.duelWins++; w.gold += 1;
      applyPair(a,b,w, aiPicks(a,b,picksFor(a,w===a,rules)), aiPicks(b,a,picksFor(b,w===b,rules)), rules);
    });
  }
  const al = alive(P);
  return {rounds, winner: al.length===1 ? al[0].i : -1, duelWins:P.map(p=>p.duelWins)};
}
function runBotGames(rules, n){
  let sum=0, draws=0, leaderGames=0, leaderWins=0;
  for(let g=0; g<n; g++){
    const r = botGame(rules); sum += r.rounds; if(r.winner<0) draws++;
    const mx = Math.max(...r.duelWins), idx = r.duelWins.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
    if(idx.length===1 && r.winner>=0){ leaderGames++; if(idx[0]===r.winner) leaderWins++; }
  }
  return {games:n, avgRounds:sum/n, draws:draws/n, leaderRate:leaderWins/Math.max(1,leaderGames)};
}

/* ================== 1대1 실시간 듀얼 엔진 ================== */
const AW=720, AH=1280, DUR=45, HP0=5;
const aimAng = (a,b) => Math.atan2(b.y-a.y, b.x-a.x);
function makeDuel(A,B){
  const mk=(p,y,dir,minY,maxY)=>({p,job:p.job,x:AW/2,y,homeY:y,dir,hp:HP0,inv:0,cd:[0,0,0],shot:0.5+rand()*0.4,r:7,speed:330,minY,maxY,mx:0,my:0,tx:null,ty:null,hits:0,face:'idle',ai:null});
  return {t:0,over:false,fxOn:false,A:mk(A,AH-230,-1,AH*0.44,AH-70),B:mk(B,250,1,70,AH*0.56),bul:[],zones:[],timers:[],banners:[],sparks:[],log:[],fx:[],parts:[],shake:0,flash:0,spd:1,onEvent:null};
}
function after(d,sec,fn){ d.timers.push({t:sec,fn}); }
function ev(d,type,a,b){ if(d.onEvent) d.onEvent(type,a,b); }
const KIND={ent:'star',tech:'spark',scout:'ember',arch:'ink'};
function shoot(d,m,o){
  const b={x:o.x!==undefined?o.x:m.x, y:o.y!==undefined?o.y:m.y+m.dir*18, vx:Math.cos(o.ang)*o.sp, vy:Math.sin(o.ang)*o.sp,
           r:o.r||6, col:o.col||m.job.color, owner:m, tgt:m===d.A?d.B:d.A, upd:o.upd||null, age:0, shape:o.shape||'orb', spin:o.spin||0, rot:o.ang, trail:o.trail||0, tr:[], a0:o.ang, seed:rand()*100, ch:o.ch||''};
  if(d.bul.length<900) d.bul.push(b); return b;
}
function setVel(b,ang,sp){ b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.rot=ang; }
const downAng = m => m.dir>0 ? Math.PI/2 : -Math.PI/2;
function burst(d,x,y,col,n,sp,k){ if(!d.fxOn) return; for(let i=0;i<n;i++){ const a=rand()*6.283, v=sp*(0.3+rand()); d.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.4+rand()*0.5,col,sz:2+rand()*3,k:k||'dot',rot:rand()*6.283}); } }
function castFx(d,m,kind){ if(!d.fxOn) return; d.fx.push({kind,x:m.x,y:m.y,t:0,col:m.job.color,job:m.job.id}); burst(d,m.x,m.y,m.job.color,22,260,KIND[m.job.id]); }
function damage(d,t,col,k){ t.hp--; t.hits++; t.inv=1.2; t.face='hurt'; d.sparks.push({x:t.x,y:t.y,t:0,col}); burst(d,t.x,t.y,col,20,330,k); d.shake=0.35; d.flash=0.35; ev(d,'hit',t); }

function unlocked(m,i){ return level(m.p) >= SPELLS[m.job.id][i].lv; }
function canCast(d,m,i){ return !d.over && unlocked(m,i) && m.cd[i]<=0; }
function castSpell(d,m,i){
  if(!canCast(d,m,i)) return false;
  const sp = SPELLS[m.job.id][i], f = m===d.A ? d.B : d.A;
  m.cd[i] = sp.cd; sp.cast(d,m,f); ev(d,'cast',m,i);
  d.banners.push({text:sp.name,col:m.job.color,t:0,side:m===d.A?'A':'B'}); d.log.push([d.t.toFixed(1),m.job.name,sp.name]);
  return true;
}

function stepDuel(d,dt){
  if(d.over) return; d.t+=dt;
  d.spd = 1+Math.min(1,Math.max(0,(d.t-10)/35))*0.65;   // 10초 뒤부터 서서히 탄 가속 (최대 ×1.65)
  const bdt=dt*d.spd;
  for(const m of [d.A,d.B]){
    const f = m===d.A?d.B:d.A;
    m.inv=Math.max(0,m.inv-dt); for(let i=0;i<3;i++) m.cd[i]=Math.max(0,m.cd[i]-dt);
    let vx=m.mx, vy=m.my;
    if(m.tx!==null){ const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy); if(dist>2){ const sp=Math.min(dist/dt, m.speed*1.15); m.x+=dx/dist*sp*dt; m.y+=dy/dist*sp*dt; } vx=vy=0; }
    const mag=Math.hypot(vx,vy); if(mag>0){ m.x+=vx/Math.max(1,mag)*m.speed*dt; m.y+=vy/Math.max(1,mag)*m.speed*dt; }
    m.x=Math.max(32,Math.min(AW-32,m.x)); m.y=Math.max(m.minY,Math.min(m.maxY,m.y));
    m.shot-=dt; if(m.shot<=0){ m.shot=0.7/d.spd; BASIC[m.job.id](d,m,f); }
  }
  for(let i=d.timers.length-1;i>=0;i--){ const tm=d.timers[i]; tm.t-=dt; if(tm.t<=0){ d.timers.splice(i,1); tm.fn(); } }
  for(let i=d.bul.length-1;i>=0;i--){
    const b=d.bul[i]; if(!b) continue; b.age+=bdt; if(b.upd) b.upd(b,bdt);
    b.x+=b.vx*bdt; b.y+=b.vy*bdt; if(b.spin) b.rot+=b.spin*bdt;
    if(d.fxOn && b.trail){ b.tr.push(b.x,b.y); if(b.tr.length>b.trail*4) b.tr.splice(0,2); }
    const t=b.tgt; let remove=!!b.dead;
    if(!remove && t.inv<=0 && Math.hypot(b.x-t.x,b.y-t.y)<b.r+t.r){ damage(d,t,b.col,KIND[b.owner.job.id]); remove=true; }
    if(b.x<-60||b.x>AW+60||b.y<-60||b.y>AH+60) remove=true;
    if(remove) d.bul.splice(i,1);
  }
  for(let i=d.zones.length-1;i>=0;i--){
    const z=d.zones[i]; z.t+=dt;
    if(z.phase==='wait' && z.t>=0) z.phase='warn';
    if(z.phase==='warn' && z.t>=z.warn){
      z.phase='act';
      if(z.type==='slam'){ ev(d,'slam',z); d.shake=Math.max(d.shake,0.5); burst(d,z.x,z.y,'#c9c2a8',26,300,'spark');
        if(z.tgt.inv<=0 && Math.hypot(z.tgt.x-z.x,z.tgt.y-z.y)<z.rad+z.tgt.r) damage(d,z.tgt,'#ffd27a','spark');
        const r0=rand()*6.283; for(let k=0;k<8;k++) shoot(d,z.owner,{x:z.x,y:z.y,ang:r0+k/8*6.283,sp:190,r:7,shape:'rivet',spin:7,trail:2}); }
      else if(!z.type) ev(d,'zap',z);
      if(z.fire){ const a=Math.atan2(z.tgt.y-z.y,z.tgt.x-z.x); shoot(d,z.owner,{x:z.x,y:z.y,ang:a,sp:440,r:8,shape:'spear',trail:9}); }
      if(z.drop){ shoot(d,z.owner,{x:z.x,y:z.y,ang:downAng(z.owner),sp:130+rand()*90,r:9,shape:'glyph',spin:(rand()-0.5)*4,ch:GLYPHS[ri(GLYPHS.length)]}); }
      if(!z.type) burst(d,z.x,AH*0.5,'#c8ffd8',14,300);
    }
    if(z.phase==='act' && !z.type && z.tgt.inv<=0 && Math.abs(z.tgt.x-z.x)<z.w/2+z.tgt.r) damage(d,z.tgt,'#c8ffd8','spark');
    if(z.t>=z.warn+z.act) d.zones.splice(i,1);
  }
  for(let i=d.sparks.length-1;i>=0;i--){ d.sparks[i].t+=dt; if(d.sparks[i].t>0.5) d.sparks.splice(i,1); }
  if(d.fxOn){
    for(let i=d.parts.length-1;i>=0;i--){ const p=d.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; if(p.k==='ember') p.vy-=150*dt; else if(p.k==='spark') p.vy+=300*dt; else if(p.k==='ink') p.vy+=90*dt; if(p.t>p.life) d.parts.splice(i,1); }
    for(let i=d.fx.length-1;i>=0;i--){ d.fx[i].t+=dt; if(d.fx[i].t>0.9) d.fx.splice(i,1); }
    d.shake=Math.max(0,d.shake-dt); d.flash=Math.max(0,d.flash-dt);
  }
  for(const m of [d.A,d.B]) if(m.face==='hurt' && m.inv<0.8) m.face='idle';
  d.banners.forEach(b=>b.t+=dt); d.banners=d.banners.filter(b=>b.t<1.4);
  if(d.A.hp<=0 || d.B.hp<=0 || d.t>=DUR){ d.over=true; }
}
function duelResult(d){
  const a=d.A, b=d.B; let w;
  if(a.hp!==b.hp) w = a.hp>b.hp ? a : b;
  else if(level(a.p)!==level(b.p)) w = level(a.p)>level(b.p) ? a : b;
  else w = rand()<0.5 ? a : b;
  return {winner:w.p, hitsA:HP0-a.hp, hitsB:HP0-b.hp, hpA:a.hp, hpB:b.hp, t:d.t};
}

/* 봇 조종: 탄 예측 회피 + 쿨타임 스펠 사용 */
function aiControl(d,me,foe,skill,dt){
  const ai = me.ai || (me.ai={next:0,mx:0,my:0,castWait:0.8+rand()});
  ai.next-=dt;
  if(ai.next<=0){
    ai.next = 0.11 + (1-skill)*0.24;
    let best=[0,0], bs=1e9;
    const cand=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[.7,-.7],[-.7,.7],[-.7,-.7]];
    for(const c of cand){
      let score=0;
      for(const tt of [0.18,0.4]){
        const px=me.x+c[0]*me.speed*tt, py=me.y+c[1]*me.speed*tt, wgt = tt<0.3?3:1.6;
        for(const b of d.bul){ if(b.owner===me) continue;
          const dist=Math.hypot(b.x+b.vx*d.spd*tt-px, b.y+b.vy*d.spd*tt-py)-b.r-me.r;
          if(dist<46) score+=(46-Math.max(dist,0))*wgt+(dist<0?500*wgt:0); }
        for(const z of d.zones){ if(z.type==='slam'){ if(z.owner===me||z.phase!=='warn') continue; const left=z.warn-z.t, dd=Math.hypot(px-z.x,py-z.y)-z.rad-me.r;
            if(dd<12 && left<1.0) score += left<tt+0.3 ? 900 : 120; continue; }
          if(z.owner===me || z.type) continue;
          if(z.phase==='warn'||z.phase==='act'){ const dx=Math.abs(px-z.x)-z.w/2-me.r; if(dx<40) score+=(40-Math.max(dx,0))*(z.phase==='act'?4:1.6)+(dx<0&&z.phase==='act'?800:0); } }
      }
      const ex=me.x+c[0]*me.speed*0.45, ey=me.y+c[1]*me.speed*0.45;
      if(ex<60||ex>AW-60||ey<me.minY+10||ey>me.maxY-10) score+=140;
      score += Math.abs(ey-me.homeY)*0.035 + Math.abs(ex-foe.x)*0.012 + (c[0]===0&&c[1]===0?3:0) + rand()*2;
      if(score<bs){ bs=score; best=c; }
    }
    if(rand()<0.05+(1-skill)*0.22) best=cand[ri(cand.length)];
    ai.mx=best[0]; ai.my=best[1];
  }
  me.mx=ai.mx; me.my=ai.my; me.tx=null;
  ai.castWait-=dt;
  if(ai.castWait<=0){
    const ready=[0,1,2].filter(i=>canCast(d,me,i));
    if(ready.length){ castSpell(d,me,ready[ri(ready.length)]); ai.castWait=0.35+rand()*(1.6-skill); } else ai.castWait=0.2;
  }
}
function runDuelHeadless(A,B,skillA,skillB){
  const d=makeDuel(A,B); const dt=1/30;
  while(!d.over){ aiControl(d,d.A,d.B,skillA,dt); aiControl(d,d.B,d.A,skillB,dt); stepDuel(d,dt); }
  return duelResult(d);
}

/* ---- 효과음 재생기: 미리 DSP 로 렌더한 샘플 + 컴프레서 + 합성 잔향 (첫 입력 때 켜짐) ---- */
const sfx=(()=>{
  let ctx=null, master=null, wet=null, on=!MUTE; const cache={};
  function init(){ if(ctx||MUTE) return;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=18; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.2;
      const conv=ctx.createConvolver(), ir=dsp.impulse(1.4,sfxRng(99)), ib=ctx.createBuffer(1,ir.length,SR); ib.copyToChannel(ir,0); conv.buffer=ib;
      wet=ctx.createGain(); wet.gain.value=0.2; wet.connect(conv); conv.connect(comp); master.connect(comp); comp.connect(ctx.destination);
    }catch(e){ ctx=null; } }
  function buf(name,arg,v){ const key=name+'|'+(arg===undefined?'':arg)+'|'+v; if(cache[key]) return cache[key];
    const x=sfxRender(name,arg,v*977+name.length*131+Math.round((arg||1)*100)), b=ctx.createBuffer(1,x.length,SR); b.copyToChannel(x,0); return cache[key]=b; }
  function play(name,o={}){ if(!on||!ctx) return;
    try{ if(ctx.state==='suspended') ctx.resume();
      const v=o.v===undefined?Math.floor(Math.random()*3):o.v, s=ctx.createBufferSource(); s.buffer=buf(name,o.arg,v); s.playbackRate.value=(o.rate||1)*(1+(Math.random()-0.5)*0.05);
      const g=ctx.createGain(); g.gain.value=o.vol===undefined?1:o.vol; s.connect(g); g.connect(master);
      const sg=ctx.createGain(); sg.gain.value=o.rev===undefined?1:o.rev; g.connect(sg); sg.connect(wet); s.start(ctx.currentTime+(o.at||0)); }catch(e){ window.__sfxErr=(window.__sfxErr||0)+1; window.__sfxLast=name+': '+e; } }
  return {init,play,get on(){return on;},toggle(){on=!on; return on;}};

function puppetLayout(cx,top,bottom,wAllow){ const sc_=Math.min((bottom-top)/208,wAllow/100), feet=bottom-2*sc_; return {s:sc_,fx:cx,fy:feet,pts:ANCHORS.map(([x,y])=>[cx+x*sc_,feet+y*sc_]),barY:feet-206*sc_}; }

function drawReveal(c,t){

let bookScene=null;
function bookRect(){
  const portrait = W/H < 0.85; let bw,bh;
  if(!portrait){ bh=Math.min(H*0.9, W*0.64, 800); bw=bh*1.52; if(bw>W*0.97){ bw=W*0.97; bh=bw/1.52; } }
  else { bw=Math.min(W*0.95,560); bh=Math.min(H*0.9,bw*1.55); }
  return {x:(W-bw)/2,y:(H-bh)/2,w:bw,h:bh,portrait};
}
const BOOK_T={open:0.7,flip:0.14,dur:0.42};
function pageFill(c,x,y,w,h,shade){
  const gr=c.createLinearGradient(x,y,x+w,y+h); gr.addColorStop(0,'#aa9b76'); gr.addColorStop(0.5,'#9c8d68'); gr.addColorStop(1,'#8a7b58'); c.fillStyle=gr; c.fillRect(x,y,w,h);
  c.fillStyle='rgba(60,35,15,.10)'; for(let i=0;i<5;i++){ c.beginPath(); c.ellipse(x+((i*0.37+0.1)%1)*w,y+((i*0.53+0.2)%1)*h,w*0.12,h*0.08,0.4*i,0,7); c.fill(); }
  const eg=c.createLinearGradient(x,y,x+w,y); eg.addColorStop(0,'rgba(20,10,4,.28)'); eg.addColorStop(0.08,'rgba(20,10,4,0)'); eg.addColorStop(0.92,'rgba(20,10,4,0)'); eg.addColorStop(1,'rgba(20,10,4,.28)'); c.fillStyle=eg; c.fillRect(x,y,w,h);
  const eh=c.createLinearGradient(x,y,x,y+h); eh.addColorStop(0,'rgba(20,10,4,.25)'); eh.addColorStop(0.07,'rgba(20,10,4,0)'); eh.addColorStop(0.93,'rgba(20,10,4,0)'); eh.addColorStop(1,'rgba(20,10,4,.3)'); c.fillStyle=eh; c.fillRect(x,y,w,h);

function drawBook(c,t){
  const sc=bookScene, R=sc.R, tt=sc.t; drawStage(c,W,H,t);
  c.fillStyle='rgba(0,0,0,.6)'; c.beginPath(); c.ellipse(W/2,R.y+R.h+8,R.w*0.52,18,0,0,7); c.fill();
  const open=Math.min(1,tt/BOOK_T.open), e=1-Math.pow(1-open,3);
  c.save();
  const pad=16; c.fillStyle='#160d08'; rr(c,R.x-pad,R.y-pad,R.w+pad*2,R.h+pad*2,10); c.fill(); c.strokeStyle='#3d2e1a'; c.lineWidth=3; rr(c,R.x-pad+5,R.y-pad+5,R.w+pad*2-10,R.h+pad*2-10,8); c.stroke();
  c.fillStyle='#6b5530'; for(const [cx_,cy_] of [[R.x-pad,R.y-pad],[R.x+R.w+pad,R.y-pad],[R.x-pad,R.y+R.h+pad],[R.x+R.w+pad,R.y+R.h+pad]]){ c.beginPath(); c.arc(cx_,cy_,9,0,7); c.fill(); }
  const cx=R.portrait?R.x:R.x+R.w/2, half=R.portrait?R.w:R.w/2;
  c.save(); c.beginPath(); c.rect(R.x-2,R.y,R.w+4,R.h); c.clip();
  const rx=R.portrait?R.x:cx; pageFill(c,rx,R.y,half,R.h,0);
  for(let i=1;i<=4;i++){ c.strokeStyle=`rgba(30,18,8,${0.35-i*0.05})`; c.beginPath(); c.moveTo(rx+half+i*1.6,R.y+i*1.3); c.lineTo(rx+half+i*1.6,R.y+R.h-i*0.6); c.stroke(); }
  if(!R.portrait){ c.save(); c.translate(cx,0); c.scale(e,1); pageFill(c,-half,R.y,half,R.h,0.12*(1-e)); c.restore(); }
  c.restore();
  if(!R.portrait){ const gg=c.createLinearGradient(cx-34*e,0,cx+34*e,0); gg.addColorStop(0,'rgba(0,0,0,0)'); gg.addColorStop(0.5,'rgba(0,0,0,.55)'); gg.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=gg; c.fillRect(cx-34,R.y,68,R.h); }
  for(let k=0;k<sc.flips;k++){
    const st=BOOK_T.open+k*BOOK_T.flip, u=(tt-st)/BOOK_T.dur; if(u<=0||u>=1) continue;
    const th=u*Math.PI, sx=Math.cos(th), ease=Math.sin(th);
    c.save(); c.translate(R.portrait?R.x:cx,0); c.scale(sx,1);
    pageFill(c,0,R.y,half,R.h,0.04+0.35*ease*ease);
    const sh=c.createLinearGradient(0,0,half,0); sh.addColorStop(0,'rgba(0,0,0,.25)'); sh.addColorStop(1,'rgba(255,240,200,'+(0.12*ease)+')'); c.fillStyle=sh; c.fillRect(0,R.y,half,R.h);
    c.strokeStyle='rgba(20,10,4,.5)'; c.lineWidth=1.5; c.strokeRect(0,R.y,half,R.h);
    c.restore();
  }
  c.restore();
  atmosphere(c,W,H,t);
}

function bookScreen({left,right,buttons,flips=5,tag}){
  return new Promise(res=>{
    const R=bookRect(), fast=FAST||params.has('bt');
    bookScene={t:fast?99:0,flips,R,settled:false}; mode='book'; ui.innerHTML='';
    if(params.has('bt')) bookScene.t=+params.get('bt');
    if(!fast) sfxFlip(flips);
    const fs=Math.max(12,Math.min(17,R.w/(R.portrait?30:60)));
    const wrap=document.createElement('div'); wrap.className='bkwrap'; wrap.style.fontSize=fs+'px';
    const btnHtml=`<div class="row" style="position:sticky;bottom:0;margin-top:1em">${buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
    const pos=(x,y,w,h,html)=>`<div class="bk" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${html}</div>`;
    wrap.innerHTML = R.portrait ? pos(R.x,R.y,R.w,R.h,left+right+btnHtml) : pos(R.x,R.y,R.w/2,R.h,left)+pos(R.x+R.w/2,R.y,R.w/2,R.h,right+btnHtml);

    if(AUTO && !(STOP && tag && STOP===tag)) setTimeout(()=>res(buttons[0].value),0);
  });
}

function spritesRow(pairs,bye){
  return pairs.map(([a,b])=>`<div class="pairs"><img alt="" src="${spriteURL(a.job,1.2)}"><span class="vs">VS</span><img alt="" src="${spriteURL(b.job,1.2)}" style="transform:scaleX(-1)"></div><p style="text-align:center;margin:.1em 0 .6em">${nameOf(a)} &nbsp;대&nbsp; ${nameOf(b)}</p>`).join('')+(bye?`<p style="text-align:center">${nameOf(bye)} — 이번 소집은 쉽니다</p>`:'');
}
function startDuelScene(A,B){
  return new Promise(res=>{
    const d=makeDuel(A,B); d.fxOn=true;
    duelScene={d,count:(AUTO&&STOP==='duel')?9999:3,humanCtl:!AUTO,skillA:A.skill,skillB:B.skill,done:res,endT:0,res:null,humanIn:A.human||B.human,lastC:4};
    if(duelScene.humanIn) d.onEvent=(type,a)=>{ const mine=a===d.A;
      if(type==='cast') sfx.play({ent:'castEnt',tech:'castTech',scout:'castScout',arch:'castArch'}[a.job.id],{vol:mine?0.85:0.55});
      else if(type==='hit') sfx.play('hit',{vol:mine?1:0.65,rate:mine?1:1.12});
      else if(type==='slam') sfx.play('slam',{vol:0.9});
      else if(type==='zap') sfx.play('zap',{vol:0.8}); };
    clearScreen(); mode='duel'; if(duelScene.humanCtl) showSpellButtons(d.A); else hideSpellButtons();
  });
}
function updatePickBtn(){ const b=document.getElementById('pk'); if(b&&pickScene){ b.disabled = pickScene.sel.size!==pickScene.n; b.textContent=`확정 (${pickScene.sel.size}/${pickScene.n})`; } }
function runPick(me,target,n){
  return new Promise(res=>{
    pickScene={me,target,n,sel:new Set(),left:15,L:null,finish:null};
    ui.innerHTML=`<div class="scr bottom"><div style="pointer-events:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center"><div class="vrow"><span class="l">내 급소</span>${[...me.vit].sort((a,b)=>a-b).map(i=>`<span class="vc ${me.cut.has(i)?'cut':''}" title="${STRING_NAMES[i]}">${i+1}</span>`).join('')}</div><button class="btn" id="pk" disabled>확정</button></div></div>`;
    const finish=()=>{ const sel=pickScene.sel; while(sel.size<n){ const free=range(N).filter(i=>!target.cut.has(i)&&!sel.has(i)); sel.add(free[ri(free.length)]); } pickScene.finish=null; const out=[...sel]; pickScene=null; res(out); };
    pickScene.finish=finish; document.getElementById('pk').onclick=finish; updatePickBtn(); mode='pick';
    if(AUTO && STOP!=='pick') setTimeout(finish,0);
  });
}
function runReveal(me,foe,myPicks,foePicks,myHits,foeHits,snap,foeCanceled){
  return new Promise(res=>{
    const evMe=myPicks.map((i,k)=>({i,at:0.6+k*0.7,hit:myHits.includes(i)}));
    const evFoe=foeCanceled?[]:foePicks.map((i,k)=>({i,at:0.6+k*0.7,hit:foeHits.includes(i)}));
    const total=Math.max(evMe.length,evFoe.length)*0.7+1.6;
    revScene={t:0,total,me:{job:me.job,vit:me.vit,snapCut:snap[me.i]},foe:{job:foe.job,snapCut:snap[foe.i]},evMe,evFoe,done:null};
    ui.innerHTML=''; mode='reveal';
    if(AUTO && STOP==='reveal') return;
    revScene.done=()=>{ const nm=myHits.length, nf=foeHits.length;
      ui.innerHTML=`<div class="scr bottom"><div class="panel" style="max-width:560px;padding:16px 18px"><div class="cards">
        <div class="card2"><div class="k">내 공격</div><div class="n ${nm?'w':'z'}">${nm}</div><div class="s">${nm?`급소 ${nm}개 끊음<br>(${myHits.map(i=>STRING_NAMES[i]).join(', ')})`:'모두 빗나갔다'}</div></div>
        <div class="card2"><div class="k">상대 공격</div><div class="n ${foeCanceled?'z':nf?'l':'z'}">${foeCanceled?'—':nf}</div><div class="s">${foeCanceled?'쓰러져서 취소됨':nf?`내 급소 ${nf}개 끊김<br>(${foeHits.map(i=>STRING_NAMES[i]).join(', ')})`:'모두 빗나갔다'}</div></div></div></div></div>`; { const pn=ui.querySelector('.panel'); const r_=document.createElement('div'); r_.className='row'; r_.style.justifyContent='center'; r_.style.marginTop='4px'; r_.innerHTML='<button class="btn">다음 소집으로</button>'; pn.appendChild(r_); r_.firstChild.onclick=()=>res(); if(AUTO&&!(STOP&&STOP==='reveal_')) setTimeout(()=>res(),0); } };
    if(AUTO) { revScene.t=revScene.total; }
  });
}

async function playGame(){
  P=makePlayers(ri(4)); round=0; const me=P.find(p=>p.human);
  await transition(()=>{},{text:'배역 배정',tip:'막이 오릅니다…',job:me.job});
  await assignScreen();
  while(alive(P).length>1 && round<40){
    round++; const human=P.find(p=>p.human); let xsum=null;
    if(opts.explore && (!AUTO||params.has('xbot')) && human.alive){ await transition(()=>{},{text:`탐색 ${round}`,tip:'상자와 발전기를 찾아라. 그림자 인형사를 조심.',job:human.job}); xsum=await runExplore(P,{ev:nextEv?nextEv.id:null}); } else gainGold(P);
    nextEv=(params.get('ev')?BOOK_EVENTS.find(b=>b.id===params.get('ev')):(rand()<0.85?BOOK_EVENTS[ri(BOOK_EVENTS.length)]:null))||null;
    if(nextEv){ await transition(()=>{},{text:'잔혹동화 책',tip:'책이 스스로 펼쳐집니다…',job:human.job});
      await bookScreen({left:`<h3>잔혹동화 책 · ${nextEv.tag}</h3><h2>${nextEv.title}</h2>${eventIcon(nextEv.id)}<p class="quote">${nextEv.story}</p>`,right:`<h3>다음 장의 규칙</h3><p style="font-size:1.1em">${nextEv.rule}</p><p class="dim">책은 소집이 시작될 때 펼쳐지고, 효과는 다음 탐색 라운드에 적용됩니다.</p>`,buttons:[{label:'이야기를 이어 간다',value:1}],tag:STOP==='event'?'event':'event_'}); }
    const {pairs,bye}=pairUp(P);
    await transition(()=>{ mode='title'; stageActors=alive(P).map(p=>p.job); },{text:`소집 ${round}`,job:human.job});
    const briefL=`<h3>Act ${round} · 소집</h3><h2>제 ${round} 소집</h2><p class="quote">${FLAVOR[(round-1+ri(3))%FLAVOR.length]}</p>${xsum?`<table><tr><th>탐색 결과</th><th>재화</th><th>끊긴 실</th></tr>${P.map((p,i)=>`<tr><td>${nameOf(p)}</td><td>${xsum.gains[i]>0?'+':''}${xsum.gains[i]}</td><td>${xsum.snips[i]?'✂ '+xsum.snips[i]:'—'}</td></tr>`).join('')}</table><p class="dim">상자 ${xsum.counts.chest}개 · 발전기 ${xsum.counts.gen}개가 열렸습니다. 내 재화 Lv ${level(human)}.</p>`:`<p class="dim">모두 재화를 얻었습니다 (내 재화 Lv ${level(human)}).</p>`}`;
    const briefR=`<h3>대진표</h3>${spritesRow(pairs,bye)}`;
    await bookScreen({left:briefL,right:briefR,buttons:[{label:human.alive?'듀얼 시작':'관전 중… 계속',value:1}],tag:STOP==='brief'?'brief':'brief_'});
    const plan=[];
    for(const [a,b] of pairs){
      let r;
      if((a.human||b.human) && human.alive){
        const A=a.human?a:b, B=a.human?b:a; let rs;
        if((opts.duelMode==='play' && !AUTO) || (AUTO&&STOP==='duel')){
          await transition(()=>{},{text:'입장',tip:`${B.name}과(와)의 1대1. 사용 가능: ${SPELLS[A.job.id].filter(s=>level(A)>=s.lv).map(s=>s.name).join(' · ')}`,job:A.job});
          rs=await startDuelScene(A,B); duelScene=null; hideSpellButtons(); mode='title';
        } else rs=runDuelHeadless(A,B,0.6,B.skill);
        r={winner:rs.winner,hitsA:a===A?rs.hitsA:rs.hitsB,hitsB:a===A?rs.hitsB:rs.hitsA};
      } else { const rs=runDuelHeadless(a,b,a.skill,b.skill); r={winner:rs.winner,hitsA:rs.hitsA,hitsB:rs.hitsB}; }
      const w=r.winner,l=w===a?b:a; w.duelWins++; w.gold+=1; plan.push({a,b,w,l,r});
    }
    const mine=plan.find(x=>x.a.human||x.b.human);
    mode='title'; stageActors=alive(P).map(p=>p.job);
    const rows=plan.map(x=>`<tr><td>${nameOf(x.a)} vs ${nameOf(x.b)}</td><td>${nameOf(x.w)}</td><td>${x.r.hitsA} : ${x.r.hitsB}</td></tr>`).join('');
    let msg=''; if(mine && human.alive){ msg = mine.w===human ? `<p class="win">승리 — 이번 공격에서 실을 ${picksFor(human,true,rules)}개 고를 수 있습니다.</p>` : `<p class="lose">패배 — 이번 공격의 선택은 ${picksFor(human,false,rules)}개입니다.</p>`; }
    await transition(()=>{},{text:'결과',job:human.job});
    const hp=n=>'<div class="hp">'+'♥'.repeat(Math.max(0,n))+'<i>'+'♥'.repeat(Math.max(0,HP0-n))+'</i></div>';
    const card=(x,big)=>{ const a=x.a,b=x.b, ha=HP0-x.r.hitsA, hb=HP0-x.r.hitsB; // hitsA = a가 맞은 횟수
      return big?`<div class="hv"><div><img class="${x.w===a?'':'dead'}" alt="" src="${spriteURL(a.job,1.5)}">${hp(ha)}<div class="nm">${a.name}${a.human?'(나)':''}</div></div><span class="vs">VS</span><div><img class="${x.w===b?'':'dead'}" alt="" src="${spriteURL(b.job,1.5)}" style="transform:scaleX(-1)">${hp(hb)}<div class="nm">${b.name}${b.human?'(나)':''}</div></div></div>`
        :`<div class="mini"><img alt="" src="${spriteURL(a.job,0.8)}"><div class="mid">${nameOf(a)} ${HP0-x.r.hitsA}<br>${nameOf(b)} ${HP0-x.r.hitsB}</div><div class="res">${x.w.name} 승</div></div>`; };
    const others=plan.filter(x=>x!==mine);
    const leftHTML=mine&&human.alive?`<h3>Act ${round} · 결과</h3><h2>나의 듀얼</h2><div style="position:relative">${card(mine,true)}<div class="stamp ${mine.w===human?'w':'l'}">${mine.w===human?'승리':'패배'}</div></div>`:`<h3>Act ${round} · 결과</h3><h2>듀얼 결과</h2>${plan.map(x=>card(x,false)).join('')}`;
    const rew=mine&&human.alive?(mine.w===human?`<div class="rew"><div class="dim">이번 공격에서 고를 수 있는 실</div><b>${picksFor(human,true,rules)}개</b></div>`:`<div class="rew l"><div class="dim">이번 공격에서 고를 수 있는 실</div><b>${picksFor(human,false,rules)}개</b></div>`):'<p class="dim">당신은 관전 중입니다.</p>';
    await bookScreen({left:leftHTML,right:`<h3>${mine&&human.alive?'다른 대결':'다음 장'}</h3>${mine&&human.alive?(others.map(x=>card(x,false)).join('')||'<p class="dim">이번 소집은 한 판뿐입니다.</p>'):''}${rew}<p class="quote">책장이 넘어가자, 인형들의 실이 다시 팽팽해졌습니다.</p>`,buttons:[{label:'실 선택으로',value:1}],tag:STOP==='result'?'result':'result_'});
    const attacks=[];
    for(const x of plan) for(const [att,tar] of [[x.a,x.b],[x.b,x.a]]){
      const n0=picksFor(att,x.w===att,rules), sn=Math.min(att.snip||0,n0-1), n=n0-sn; att.snip=0; let picks;
      if(att.human && att.alive){ await transition(()=>{},{text:'실 선택',tip:`${tar.name}의 12개 실 중 ${n}개를 고르세요.${sn?` (가위에 실이 ${sn}개 끊겨 줄었습니다)`:''}`,job:att.job}); picks=await runPick(att,tar,n); }
      else picks=aiPicks(att,tar,n);
      attacks.push({att,tar,picks,n});
    }
    const snap={}; P.forEach(p=>snap[p.i]=new Set(p.cut));
    const results=[];
    for(const x of plan){ const A=attacks.find(q=>q.att===x.a), B=attacks.find(q=>q.att===x.b);
      results.push(...applyPair(x.a,x.b,x.w,A.picks,B.picks,rules).map(r=>({...r,n:(r.att===x.a?A:B).n}))); }
    const myA=results.find(r=>r.att.human);
    if(myA && human.alive){ const foeA=results.find(r=>r.att===myA.tar&&r.tar===myA.att);
      await transition(()=>{},{text:'공개',tip:'실이 팽팽해집니다…',job:human.job});
      await runReveal(human,myA.tar,myA.picks,foeA.picks,myA.hits,foeA.hits,snap,foeA.canceled); }
    mode='title';
  }
  const al=alive(P), win=al.length===1?al[0]:null;
  window.__result={rounds:round,winner:win?win.i:-1,humanWon:win?win.human:false};
  document.title='결과: '+JSON.stringify(window.__result);
  stageActors=win?[win.job]:[];
  await transition(()=>{ mode='title'; },{text:'막이 내립니다',job:me.job});
  if(win) await runCut(win);
  return bookScreen({left:`<h3>Finale</h3><h2>${win?`${win.name} 승리`:'무승부'}</h2>${win?`<img class="hero" alt="" src="${spriteURL(win.job,1.7)}">`:''}`,right:`<h3>마지막 장</h3><p class="quote">${win?(win.human?'당신의 줄만이 끝까지 팽팽했습니다.':'끝까지 서 있던 것은 당신이 아니었습니다.'):'마지막 두 줄이 동시에 끊어졌습니다.'}</p><p class="dim">${round}번의 소집 끝에 막이 내립니다.</p>`,buttons:[{label:'다시 하기',value:'again'}],tag:STOP==='end'?'end':'end_'});
}
(async function main(){
  P=makePlayers(0); frame();
  if(params.has('snd')){ sfx.init(); setInterval(()=>{ document.title='sfx err '+(window.__sfxErr||0)+' '+(window.__sfxLast||'')+' ctx '+(typeof actxState==='function'?actxState():''); },400); }
  const demo=params.get('demo');   // 디버그: ?demo=load / ?demo=duel / ?demo=book
  if(demo==='load'){ transition(()=>new Promise(()=>{}),{text:'NOW LOADING',tip:TIPS[0],job:JOBS[2]}); return; }
  if(demo==='duel'){ P.forEach(p=>p.gold=8); P[0].job=JOBS[+(params.get('a')||0)]; P[1].job=JOBS[+(params.get('b')||1)]; stageActors=[]; startDuelScene(P[0],P[1]); duelScene.count=0; duelScene.humanCtl=false; showSpellButtons(duelScene.d.A); return; }
  if(demo==='sprites'){ ui.innerHTML='<div class="scr" style="background:#a99b78"><div style="display:flex;gap:10px;pointer-events:auto">'+JOBS.map(j=>`<img src="${spriteURL(j,1.7)}" style="height:380px">`).join('')+'</div></div>'; return; }
  if(demo==='sfxtest'){ sfx.init(); let n=0; for(const k of Object.keys(sfxGen)){ sfx.play(k,{arg:1.1,v:0}); sfx.play(k,{arg:0.8,v:2}); n+=2; } document.title='sfx played '+n+' err '+(window.__sfxErr||0)+' '+(window.__sfxLast||''); setInterval(()=>{ document.title='sfx played '+n+' err '+(window.__sfxErr||0)+' '+(window.__sfxLast||''); },300); return; }
  if(demo==='bullets'){ const cc=document.createElement('canvas'); cc.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:3;background:#120a08'; document.body.appendChild(cc); cc.width=innerWidth; cc.height=innerHeight; const x=cc.getContext('2d');
    const list=[['ent','star','#f6e3a6'],['ent','beam','#f6e3a6'],['ent','ring','#f6e3a6'],['ent','curtain','#f6e3a6'],['tech','bolt','#9be37a'],['tech','gear','#9be37a'],['tech','rivet','#9be37a'],['scout','flame','#7fe3ff'],['scout','wave','#7fe3ff'],['scout','spear','#7fe3ff'],['arch','page','#cdb6ff'],['arch','ink','#cdb6ff'],['arch','drop','#cdb6ff'],['arch','glyph','#cdb6ff']];
    const cols=5, cw_=innerWidth/cols, rh=innerHeight/Math.ceil(list.length/cols); list.forEach(([j,sh,col],i)=>{ const px=(i%cols+0.5)*cw_, py=(Math.floor(i/cols)+0.5)*rh, sp=bulletSprite(sh,col,'가'); const g2=glowSprite(col,16); x.save(); x.globalCompositeOperation='lighter'; x.globalAlpha=0.6; x.drawImage(g2.c,px-g2.s*1.3,py-g2.s*1.3,g2.s*2.6,g2.s*2.6); x.restore(); const k=Math.min(cw_,rh)/BSZ*BSS*0.9; x.drawImage(sp,px-BSZ/BSS*k/2*1.0,py-BSZ/BSS*k/2*1.0,BSZ/BSS*k,BSZ/BSS*k); x.fillStyle='#d9cdb0'; x.font='14px sans-serif'; x.textAlign='center'; x.fillText(sh,px,py+rh*0.46); }); return; }
  if(demo==='explore'){ P[0].human=true; P[0].gold=0; stageActors=[]; await runExplore(P); return; }
  if(demo==='cut'){ P.forEach(p=>p.gold=8); const jb=JOBS[+(params.get('job')||0)], w=P.find(p=>p.job===jb)||P[0]; w.job=jb; w.human=true; stageActors=[]; await runCut(w); return; }
  if(demo==='book'){ P.forEach(p=>p.gold=8); P[0].human=true; await assignScreen(); return; }
  while(true){ const act=await titleScreen(); if(act==='sim'||(AUTO&&act!=='start')) break; await playGame(); if(AUTO) break; }
})();
</script>
