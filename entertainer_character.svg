    <path d="M474 352 L548 416" stroke="url(#jacket)" stroke-width="34"/>
    <path d="M548 416 L600 468" stroke="#12062b" stroke-width="34"/>
    <path d="M548 416 L600 468" stroke="url(#jacket)" stroke-width="28"/>
