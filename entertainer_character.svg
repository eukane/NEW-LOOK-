  <path d="M352 322 L316 346 L324 442 L376 452 L380 336 Z" fill="url(#jacket)" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M448 322 L484 346 L476 442 L424 452 L420 336 Z" fill="url(#jacket)" stroke="#12062b" stroke-width="3" stroke-linejoin="round"/>
