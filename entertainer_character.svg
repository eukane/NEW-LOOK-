    <path d="M326 352 L262 398" stroke="url(#jacket)" stroke-width="34"/>
    <path d="M262 398 L288 308" stroke="#12062b" stroke-width="34"/>
    <path d="M262 398 L288 308" stroke="url(#jacket)" stroke-width="28"/>
